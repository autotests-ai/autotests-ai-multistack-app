services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reference_app
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reference_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference -d reference_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: reference-app-copy-backend:latest
    build:
      context: ./backend/java/backend_java_spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reference_app
      DB_USER: reference
      DB_PASSWORD: reference
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-reference-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reference_internal
    # API only — not published; browsers hit `web`.

  web:
    image: reference-app-copy-web:latest
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        UI_MODULE: ${UI_MODULE:-frontend/javascript/vanilla/frontend_javascript_vanilla}
        UI_RUNTIME: ${UI_RUNTIME:-frontend/_shared/frontend_javascript_app}
        UI_MOUNT: ${UI_MOUNT:-frontend_typescript_react}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SERVER_PORT:-8080}:80"
    networks:
      - reference_internal

networks:
  reference_internal:
    driver: bridge

volumes:
  pgdata:
