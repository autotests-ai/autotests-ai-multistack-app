services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reference_app
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - reference_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference -d reference_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: reference-app-copy-backend:latest
    build:
      context: .
      dockerfile: backend/java/backend_java_spring/Dockerfile
      args:
        # Active product UI (repo-relative). Switch module here when deploying another stack
        # (e.g. a React `dist/` after `npm run build`). Dockerfile stays stack-agnostic.
        UI_MODULE: ${UI_MODULE:-frontend/javascript/vanilla/frontend_javascript_vanilla}
        UI_RUNTIME: ${UI_RUNTIME:-frontend/_shared/frontend_javascript_app}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reference_app
      DB_USER: reference
      DB_PASSWORD: reference
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-reference-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - reference_internal

networks:
  reference_internal:
    driver: bridge

volumes:
  pgdata:
