services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - reference_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ensure-dbs:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
      PGHOST: postgres
    volumes:
      - ./deploy/postgres/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["bash", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reference_internal

  backend-java-spring:
    image: reference-app-copy-backend-java-spring:latest
    build:
      context: ./backend/java/backend-java-spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reference_app_java_spring
      DB_USER: reference
      DB_PASSWORD: reference
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-reference-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ensure-dbs:
        condition: service_completed_successfully
    networks:
      - reference_internal
    ports:
      - "${BACKEND_JAVA_PORT:-8800}:8080"

  backend-kotlin-spring:
    image: reference-app-copy-backend-kotlin-spring:latest
    build:
      context: ./backend/kotlin/backend-kotlin-spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reference_app_kotlin_spring
      DB_USER: reference
      DB_PASSWORD: reference
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-reference-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ensure-dbs:
        condition: service_completed_successfully
    networks:
      - reference_internal
    ports:
      - "${BACKEND_KOTLIN_PORT:-8810}:8080"

  backend-python-flask:
    image: reference-app-copy-backend-python-flask:latest
    build:
      context: ./backend/python/backend-python-flask
    restart: unless-stopped
    networks:
      - reference_internal
    ports:
      - "${BACKEND_FLASK_PORT:-8820}:8080"

  web:
    image: reference-app-copy-web:latest
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        UI_RUNTIME: ${UI_RUNTIME:-frontend/_shared/frontend-javascript-app}
        REACT_UI: ${REACT_UI:-frontend/_shared/frontend-react-ui}
    restart: unless-stopped
    networks:
      - reference_internal
    ports:
      - "${WEB_PORT:-8701}:80"

  edge:
    image: reference-app-copy-edge:latest
    build:
      context: .
      dockerfile: deploy/edge/Dockerfile
    restart: unless-stopped
    depends_on:
      - web
      - backend-java-spring
      - backend-python-flask
      - backend-kotlin-spring
    ports:
      - "${SERVER_PORT:-8700}:80"
    networks:
      - reference_internal

networks:
  reference_internal:
    driver: bridge

volumes:
  pgdata:
