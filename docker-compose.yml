name: autotests-ai-multistack-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: multistack
      POSTGRES_PASSWORD: multistack
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - autotests_ai_multistack_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multistack -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ensure-dbs:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: multistack
      POSTGRES_PASSWORD: multistack
      PGHOST: postgres
    volumes:
      - ./deploy/postgres/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["bash", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autotests_ai_multistack_internal

  backend-java-spring:
    image: ghcr.io/autotests-ai/autotests-ai-multistack-app-backend-java-spring:${IMAGE_TAG:-latest}
    build:
      labels:
        org.opencontainers.image.title: autotests-ai-multistack-app-backend-java-spring
        org.opencontainers.image.description: autotests-ai-multistack-app · backend-java-spring
        org.opencontainers.image.source: https://github.com/autotests-ai/autotests-ai-multistack-app
        org.opencontainers.image.url: https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/
        org.opencontainers.image.vendor: autotests-ai
      context: ./backend/java/backend-java-spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: multistack_app_java_spring
      DB_USER: multistack
      DB_PASSWORD: multistack
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-autotests-ai-multistack-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ensure-dbs:
        condition: service_completed_successfully
    networks:
      - autotests_ai_multistack_internal
    ports:
      - "${BACKEND_JAVA_PORT:-8800}:8080"
      # Prometheus scrape only. Default bind is loopback — docker publish bypasses ufw.
      - "${BACKEND_JAVA_MANAGEMENT_PORT:-127.0.0.1:8801}:8081"

