services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - reference_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reference -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-ensure-dbs:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: reference
      POSTGRES_PASSWORD: reference
      PGHOST: postgres
    volumes:
      - ./deploy/postgres/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["bash", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reference_internal

  backend-java-spring:
    image: ghcr.io/autotests-ai/reference-app-copy-backend-java-spring:${IMAGE_TAG:-latest}
    build:
      context: ./backend/java/backend-java-spring
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: reference_app_java_spring
      DB_USER: reference
      DB_PASSWORD: reference
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-reference-app-dev-secret-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-ensure-dbs:
        condition: service_completed_successfully
    networks:
      - reference_internal
    ports:
      - "${BACKEND_JAVA_PORT:-8800}:8080"

  backend-kotlin-spring:
