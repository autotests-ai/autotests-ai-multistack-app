  # of WireMock; mirrors the prod path shape so the SPA reaches the API from :9821.
  stand-gateway-ci:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/ci/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-typescript-react:
        condition: service_started
      backend-java-spring:
        condition: service_started
    networks:
      - autotests_ai_multistack_internal
    ports:
      - "${CI_GATEWAY_PORT:-9821}:80"

