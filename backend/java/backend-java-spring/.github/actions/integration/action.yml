name: integration
description: Spring Boot + Testcontainers PostgreSQL in this backend module.
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY == 'true' }}
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
    - uses: actions/cache@v6
      with:
        path: ${{ inputs.module_dir }}/.gradle/configuration-cache
        key: gradle-cc-backend-integration-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
        restore-keys: |
          gradle-cc-backend-integration-
    - name: Run integration tests (Gradle + Testcontainers)
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/build/allure-results
      run: |
        eval "${ALLURECTL_RUN}"
        run_with_allurectl ./gradlew test -DincludeTags=integration
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-integration
        path: ${{ inputs.module_dir }}/build/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
