name: Unit tests backend-java-spring
description: Gradle unit + JaCoCo for backend-java-spring

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: backend/java/backend-java-spring/**/*.gradle*

    - name: Backend unit + JaCoCo
      shell: bash
      working-directory: backend/java/backend-java-spring
      run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon
