<!-- Presentational HAR table. Columns: Method · Status · URL · Type · Size · Time.
     Expandable detail: Headers / Timings / Response (React tabs or static <details>). -->
<div class="har-viewer" data-testid="har-viewer">
  <div class="har-table-wrap">
    <table class="har-table">
      <thead>
        <tr>
          <th>Method</th>
          <th>Status</th>
          <th>URL</th>
          <th>Type</th>
          <th>Size</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody>
        <tr class="har-row har-row--open" tabindex="0" role="button" aria-expanded="true" aria-controls="har-detail-0" data-testid="session-har-row-0">
          <td class="har-method">GET</td>
          <td class="har-status--ok">200</td>
          <td class="har-url" title="https://example.com/">https://example.com/</td>
          <td class="har-mime">text/html</td>
          <td>1.2 KB</td>
          <td>42 ms</td>
        </tr>
        <tr id="har-detail-0" class="har-detail-row" data-testid="session-har-detail-row-0">
          <td colspan="6">
            <div class="har-detail" data-testid="session-har-detail">
              <div class="har-section">
                <div class="har-section__title">Response Headers</div>
                <div class="har-kv">
                  <div class="har-kv__k">Content-Type</div>
                  <div class="har-kv__v">text/html</div>
                </div>
              </div>
              <div class="har-section">
                <div class="har-section__title">Request Headers</div>
                <div class="har-kv">
                  <div class="har-kv__k">Accept</div>
                  <div class="har-kv__v">text/html</div>
                </div>
              </div>
            </div>
          </td>
        </tr>
        <tr class="har-row" tabindex="0" role="button" aria-expanded="false" data-testid="session-har-row-1">
          <td class="har-method">GET</td>
          <td class="har-status--warn">404</td>
          <td class="har-url" title="https://example.com/favicon.ico">https://example.com/favicon.ico</td>
          <td class="har-mime">text/plain</td>
          <td>369 B</td>
          <td>31 ms</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
