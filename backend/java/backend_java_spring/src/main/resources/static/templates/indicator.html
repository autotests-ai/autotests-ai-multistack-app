<!-- Indicator — signal dot. Color set from tokens (css/indicator.css). -->
<!-- Muted 55% by default (matches panel--content bar dots); --solid = full, --soft = extra dim. -->
<!-- Semantic: --neutral (default) | --success | --warning | --danger | --info -->
<!-- Allure status (aliases): --passed | --failed | --broken | --skipped | --unknown -->
<!-- Window controls: --close | --minimize | --maximize -->
<span class="indicator indicator--success" data-testid="indicator"></span>
