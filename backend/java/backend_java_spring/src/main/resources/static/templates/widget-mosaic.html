<section class="widget-mosaic" data-testid="widget-mosaic" aria-label="Dashboard mosaic">
  <figure class="widget-tile widget-tile--span-2x2" data-chart="currentStatus">
    <div class="widget-tile__bar">
      <div class="indicator-row" aria-hidden="true">
        <span class="indicator indicator--status-red"></span>
        <span class="indicator indicator--status-green"></span>
      </div>
      <span class="widget-tile__title">Current status</span>
    </div>
    <div class="widget-tile__body"></div>
  </figure>
  <figure class="widget-tile widget-tile--span-1x1" data-chart="testingPyramid">
    <div class="widget-tile__bar">
      <div class="indicator-row" aria-hidden="true">
        <span class="indicator indicator--status-red"></span>
        <span class="indicator indicator--status-green"></span>
        <span class="indicator indicator--status-blue"></span>
      </div>
      <span class="widget-tile__title">Testing pyramid</span>
    </div>
    <div class="widget-tile__body"></div>
  </figure>
  <figure class="widget-tile widget-tile--span-1x1" data-chart="durations">
    <div class="widget-tile__bar">
      <div class="indicator-row" aria-hidden="true">
        <span class="indicator indicator--status-blue"></span>
      </div>
      <span class="widget-tile__title">Durations</span>
    </div>
    <div class="widget-tile__body"></div>
  </figure>
</section>
