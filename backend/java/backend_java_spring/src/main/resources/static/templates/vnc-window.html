<!-- state: vnc-window--connecting | --disconnecting | --disconnected | --connected
     fullscreen: add vnc-window-frame--fullscreen to wrapper and vnc-window--fullscreen to panel;
     swap lock/chevron glyphs for unlocked/fullscreen state -->
<div class="vnc-window-frame">
  <div class="panel panel--vnc vnc-window vnc-window--connected" data-state="connected">
    <div class="panel__bar">
      <div class="vnc-window__controls">
        <button type="button" class="window-control window-control--danger" aria-label="Back" title="Back">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>
          </span>
        </button>
        <span class="connection-status connection-status--connected" role="status" aria-label="VNC connected"></span>
        <button type="button" class="window-control window-control--info vnc-window__session-control" aria-label="Unlock screen" title="Unlock screen">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
            </svg>
          </span>
        </button>
        <button type="button" class="window-control window-control--success vnc-window__session-control" aria-label="Enter fullscreen" title="Enter fullscreen">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4-4 4 4"/></svg>
          </span>
        </button>
      </div>
      <div class="vnc-window__actions">
        <button type="button" class="window-control window-control--neutral" aria-label="Copy from Selenoid" title="Copy from Selenoid">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <rect x="5" y="5" width="8" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M5 11H4a1.5 1.5 0 0 1-1.5-1.5V4A1.5 1.5 0 0 1 4 2.5h5.5A1.5 1.5 0 0 1 11 4v1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </span>
        </button>
        <button type="button" class="window-control window-control--neutral" aria-label="Paste to Selenoid" title="Paste to Selenoid">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 10V3m0 0L5.25 5.75M8 3l2.75 2.75"/><path d="M3 10v2.5A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V10"/>
            </svg>
          </span>
        </button>
      </div>
    </div>
    <div class="vnc-window__screen">
      <div class="vnc-window__screen-mount" aria-label="noVNC mount point"></div>
    </div>
  </div>
  <div class="vnc-window__external-status" role="status" aria-live="polite"></div>
</div>
