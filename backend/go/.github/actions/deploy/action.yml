name: deploy
description: SSH compose pull/up for a Go backend module.
inputs:
  module_dir:
    required: true
  stand:
    required: true
runs:
  using: composite
  steps:
    - id: id
      shell: bash
      run: |
        set -euo pipefail
        service="$(basename "${{ inputs.module_dir }}")"
        echo "service=${service}" >> "$GITHUB_OUTPUT"
        if [ -z "${DEPLOY_COMPOSE_SERVICES:-}" ]; then
          echo "DEPLOY_COMPOSE_SERVICES=postgres postgres-ensure-dbs ${service}" >> "$GITHUB_ENV"
        fi
    - name: Deploy backend
      uses: appleboy/ssh-action@v1.2.5
      env:
        GHCR_TOKEN: ${{ env.GITHUB_TOKEN }}
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ env.DEPLOY_SSH_KEY }}
        command_timeout: 15m
        envs: IMAGE_TAG,GHCR_TOKEN,DEPLOY_COMPOSE_SERVICES,DEPLOY_HEALTH_URL,DEPLOY_APP_DIR,DEPLOY_COMPOSE_PROJECT,DEPLOY_COMPOSE_ENV_FILE
        script: ${{ env.DEPLOY_SSH_SCRIPT }}
