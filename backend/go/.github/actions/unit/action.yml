name: unit
description: go test + coverprofile (JaCoCo analog) for a Go backend module.
inputs:
  module_dir:
    required: true
  coverage_artifact:
    required: false
    default: coverage-backend
  allure_artifact:
    required: false
    default: allure-results-unit
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: ${{ inputs.module_dir }}/go.sum
    - name: Unit tests (go test + coverprofile)
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
      run: |
        eval "${ALLURECTL_RUN:-true}"
        if declare -F run_with_allurectl >/dev/null; then
          run_with_allurectl go test ./... -coverprofile=coverage.out -covermode=atomic
        else
          go test ./... -coverprofile=coverage.out -covermode=atomic
        fi
    - if: steps.run-tests.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.coverage_artifact }}
        path: ${{ inputs.module_dir }}/coverage.out
        if-no-files-found: error
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.allure_artifact }}
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
