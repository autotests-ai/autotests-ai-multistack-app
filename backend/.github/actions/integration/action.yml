name: integration
description: Dispatch integration to the active module (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - if: env.BACKEND_LANG == 'java'
      uses: ./backend/java/backend-java-spring/.github/actions/integration
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.BACKEND_LANG == 'python'
      uses: ./backend/python/.github/actions/integration
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.BACKEND_LANG != 'java' && env.BACKEND_LANG != 'python'
      shell: bash
      run: |
        echo "STOP: no integration action for BACKEND_LANG=${BACKEND_LANG:-unset}" >&2
        exit 1
