name: openapi-sync
description: >-
  Fail unless every backend-* module has openapi.yaml copies that match
  _contract/openapi.yaml byte-for-byte (build/ trees ignored).
runs:
  using: composite
  steps:
    - name: Compare backend openapi.yaml copies to _contract
      shell: bash
      run: |
        set -euo pipefail
        ssot=_contract/openapi.yaml
        if [ ! -f "$ssot" ]; then
          echo "STOP: missing ${ssot}" >&2
          exit 1
        fi

        fail=0
        copies=0
        module_count=0

        while IFS= read -r mod; do
          [ -n "$mod" ] || continue
          module_count=$((module_count + 1))
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            found=1
            copies=$((copies + 1))
            if cmp -s "$ssot" "$f"; then
              echo "ok ${f}"
            else
              echo "STOP: drift ${f} != ${ssot}" >&2
              fail=1
            fi
          done < <(find "$mod" -name openapi.yaml ! -path '*/build/*' | LC_ALL=C sort)
          if [ "$found" -eq 0 ]; then
            echo "STOP: no openapi.yaml in ${mod}" >&2
            fail=1
          fi
        done < <(find backend -mindepth 2 -maxdepth 2 -type d -name 'backend-*' | LC_ALL=C sort)

        if [ "$module_count" -eq 0 ]; then
          echo "STOP: no backend modules under backend/*/" >&2
          exit 1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "STOP: backend openapi.yaml must match ${ssot} byte-for-byte" >&2
          exit 1
        fi
        echo "openapi-sync: ${copies} copies in ${module_count} modules match ${ssot}"
