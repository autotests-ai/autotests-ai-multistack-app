name: build
description: Dispatch build to the active module (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.BACKEND_LANG == 'python'
      uses: ./backend/python/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'kotlin'
      uses: ./backend/kotlin/backend-kotlin-spring/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'go'
      uses: ./backend/go/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'javascript'
      uses: ./backend/javascript/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'typescript'
      uses: ./backend/typescript/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'java'
      uses: ./backend/java/backend-java-spring/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'csharp'
      uses: ./backend/csharp/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'rust'
      uses: ./backend/rust/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: >-
        env.BACKEND_LANG != 'java' &&
        env.BACKEND_LANG != 'kotlin' &&
        env.BACKEND_LANG != 'python' &&
        env.BACKEND_LANG != 'go' &&
        env.BACKEND_LANG != 'javascript' &&
        env.BACKEND_LANG != 'typescript' &&
        env.BACKEND_LANG != 'csharp' &&
        env.BACKEND_LANG != 'rust'
      shell: bash
      run: |
        echo "STOP: no build action for BACKEND_LANG=${BACKEND_LANG:-unset}" >&2
        exit 1
