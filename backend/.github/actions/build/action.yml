name: build
description: Dispatch build to the active module (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - uses: ./backend/java/backend-java-spring/.github/actions/build
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
