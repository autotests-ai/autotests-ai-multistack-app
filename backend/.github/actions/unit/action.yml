name: unit
description: Dispatch unit to the active module (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.BACKEND_LANG == 'java'
      uses: ./backend/java/backend-java-spring/.github/actions/unit
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG == 'python'
      uses: ./backend/python/.github/actions/unit
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.BACKEND_LANG != 'java' && env.BACKEND_LANG != 'python'
      shell: bash
      run: |
        echo "STOP: no unit action for BACKEND_LANG=${BACKEND_LANG:-unset}" >&2
        exit 1
