name: integration
description: Jest + Testcontainers PostgreSQL for a TypeScript backend module.
inputs:
  module_dir:
    required: true
  allure_artifact:
    required: false
    default: allure-results-integration
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: ${{ inputs.module_dir }}/package-lock.json
    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: npm ci
    - name: Run integration tests (Jest)
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
      run: |
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl npm test -- --runInBand --testPathPatterns=integration --coverage=false
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.allure_artifact }}
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
