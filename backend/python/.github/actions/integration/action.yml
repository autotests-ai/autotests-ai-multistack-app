name: integration
description: pytest + Testcontainers PostgreSQL for a Python backend module.
inputs:
  module_dir:
    required: true
  allure_artifact:
    required: false
    default: allure-results-integration
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.module_dir }}/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: python -m pip install -r requirements.txt
    - name: Run integration tests (pytest + Testcontainers)
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        PYTEST_INTEGRATION: "1"
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
      run: |
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl python -m pytest -m integration --no-cov --alluredir="${ALLURE_RESULTS}"
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.allure_artifact }}
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
