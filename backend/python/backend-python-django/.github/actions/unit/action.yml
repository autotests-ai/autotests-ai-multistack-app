name: Unit tests backend-python-django
description: pip install + pytest for backend-python-django

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/python/backend-python-django/requirements.txt

    - name: Install + pytest
      shell: bash
      working-directory: backend/python/backend-python-django
      run: |
        python -m pip install -r requirements.txt
        python -m pytest
