[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts =
    -q
    --cov=.
    --cov-fail-under=100
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
testpaths = tests
markers =
    integration: full app against real PostgreSQL (Testcontainers)
