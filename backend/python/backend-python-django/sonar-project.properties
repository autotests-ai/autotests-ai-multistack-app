# Defaults for local / CI override via -Dsonar.projectKey / SONAR_PROJECT_KEY.
sonar.projectKey=autotests-ai-multistack-app-backend-python-django
sonar.projectName=autotests-ai-multistack-app-backend-python-django
sonar.sources=api,config
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/allure-results/**,**/coverage.xml,**/migrations/**,config/wsgi.py,manage.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Bearer JWT API — CSRF is N/A. Analog of Java @SuppressWarnings("java:S4502").
sonar.issue.ignore.multicriteria=s4502
sonar.issue.ignore.multicriteria.s4502.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.s4502.resourceKey=**/*
