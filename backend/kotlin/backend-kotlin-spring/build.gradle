buildscript {
    ext {
        javaVersion                       = 21
        springBootVersion                 = '3.4.1'
        springDependencyManagementVersion = '1.1.7'
        slf4jVersion                      = '2.0.17'
        kotlinVersion                     = '2.1.0'
        sonarPluginVersion                = '6.2.0.5505'
        jjwtVersion                       = '0.12.6'
        mockitoKotlinVersion              = '5.4.0'
        // Boot 3.4 pins Testcontainers 1.20.x, which predates Docker Engine 29 — override.
        testcontainersVersion             = '1.21.4'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
    id 'org.jetbrains.kotlin.plugin.spring' version "${kotlinVersion}"
    id 'org.jetbrains.kotlin.plugin.jpa' version "${kotlinVersion}"
    id 'jacoco'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'org.sonarqube' version "${sonarPluginVersion}"
}

sonar {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'autotests-ai-multistack-app-backend-kotlin-spring'
        property 'sonar.projectName', System.getenv('SONAR_PROJECT_KEY') ?: 'autotests-ai-multistack-app-backend-kotlin-spring'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'https://sonar.qa.guru'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.sources', 'src/main/kotlin'
        property 'sonar.tests', 'src/test/kotlin'
        property 'sonar.kotlin.binaries', 'build/classes/kotlin/main'
        property 'sonar.exclusions', '**/MultistackApplication.kt'
    }
}

group = 'dev.multistack'
version = '0.1.0'

ext['slf4j.version'] = slf4jVersion
ext['testcontainers.version'] = testcontainersVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation "org.mockito.kotlin:mockito-kotlin:${mockitoKotlinVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll('-Xjsr305=strict')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.named('test') {
    useJUnitPlatform {
        def includeTagsProp = System.getProperty('includeTags')
        if (includeTagsProp) {
            includeTags(*(includeTagsProp.split(',')*.trim()))
        }
        def excludeTagsProp = System.getProperty('excludeTags')
        if (excludeTagsProp) {
            excludeTags(*(excludeTagsProp.split(',')*.trim()))
        }
    }
    finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                '**/MultistackApplication.class',
                '**/MultistackApplicationKt.class',
        ])
    }))
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
        }
    }
    classDirectories.setFrom(tasks.named('jacocoTestReport', JacocoReport).get().classDirectories)
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
