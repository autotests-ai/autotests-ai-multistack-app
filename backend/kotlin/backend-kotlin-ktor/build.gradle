buildscript {
    ext {
        javaVersion           = 21
        kotlinVersion         = '2.4.21'
        slf4jVersion          = '2.0.20'
        sonarPluginVersion    = '7.5.0.8588'
        ktorVersion           = '3.5.2'
        hikariVersion         = '7.1.0'
        postgresDriverVersion = '42.7.13'
        javaJwtVersion        = '4.6.1'
        bcryptVersion         = '0.10.2'
        micrometerVersion     = '1.17.1'
        junitVersion          = '6.1.3'
        testcontainersVersion = '2.0.2'
        h2Version             = '2.3.232'
        mockitoKotlinVersion  = '6.4.0'
        allureBomVersion      = '3.0.0'
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}"
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlinVersion}"
    id 'jacoco'
    id 'application'
    id 'org.sonarqube' version "${sonarPluginVersion}"
}

sonar {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'autotests-ai-multistack-app-backend-kotlin-ktor'
        property 'sonar.projectName', System.getenv('SONAR_PROJECT_KEY') ?: 'autotests-ai-multistack-app-backend-kotlin-ktor'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'https://sonar.qa.guru'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.sources', 'src/main/kotlin'
        property 'sonar.tests', 'src/test/kotlin'
        property 'sonar.kotlin.binaries', 'build/classes/kotlin/main'
        property 'sonar.exclusions', '**/MultistackApplication.kt'
    }
}

group = 'dev.multistack'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

application {
    mainClass = 'dev.multistack.app.MultistackApplicationKt'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("io.ktor:ktor-bom:${ktorVersion}")
    implementation 'io.ktor:ktor-server-core'
    implementation 'io.ktor:ktor-server-netty'
    implementation 'io.ktor:ktor-server-auth'
    implementation 'io.ktor:ktor-server-auth-jwt'
    implementation 'io.ktor:ktor-server-cors'
    implementation 'io.ktor:ktor-server-content-negotiation'
    implementation 'io.ktor:ktor-server-status-pages'
    implementation 'io.ktor:ktor-server-metrics-micrometer'
    implementation 'io.ktor:ktor-serialization-kotlinx-json'
    implementation "io.micrometer:micrometer-registry-prometheus:${micrometerVersion}"
    implementation "com.auth0:java-jwt:${javaJwtVersion}"
    implementation "at.favre.lib:bcrypt:${bcryptVersion}"
    implementation "com.zaxxer:HikariCP:${hikariVersion}"
    runtimeOnly "org.postgresql:postgresql:${postgresDriverVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    testImplementation 'io.ktor:ktor-server-test-host'
    testImplementation 'io.ktor:ktor-client-content-negotiation'
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:${testcontainersVersion}"
    testImplementation "com.h2database:h2:${h2Version}"
    testImplementation "org.mockito.kotlin:mockito-kotlin:${mockitoKotlinVersion}"
    testImplementation platform("io.qameta.allure:allure-bom:${allureBomVersion}")
    testImplementation 'io.qameta.allure:allure-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll('-Xjsr305=strict')
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

tasks.named('test') {
    useJUnitPlatform {
        def includeTagsProp = System.getProperty('includeTags')
        if (includeTagsProp) {
            includeTags(*(includeTagsProp.split(',')*.trim()))
        }
        def excludeTagsProp = System.getProperty('excludeTags')
        if (excludeTagsProp) {
            excludeTags(*(excludeTagsProp.split(',')*.trim()))
        }
    }
    systemProperty 'allure.results.directory',
            layout.buildDirectory.dir('allure-results').get().asFile.absolutePath
    finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
                '**/MultistackApplication.class',
                '**/MultistackApplicationKt*',
        ])
    }))
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
        }
    }
    classDirectories.setFrom(tasks.named('jacocoTestReport', JacocoReport).get().classDirectories)
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
