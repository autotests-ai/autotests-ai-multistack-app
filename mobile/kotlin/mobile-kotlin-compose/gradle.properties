org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# API origin baked into BuildConfig.API_BASE. Default = prod live pair
# (GitHub Release APK). Not CI, not the /stack/ board.
#
# Same names as Appium -Denv= (apiBase, not deviceHost):
#   ./gradlew :app:assembleDebug -Penv=ci      # emulator → compose :8800 via 10.0.2.2
#   ./gradlew :app:assembleDebug -Penv=stage
#   ./gradlew :app:assembleDebug -Penv=prod     # this file
# -PapiBase= still wins (bootRun on :8080, another backend cell, …):
#   ./gradlew :app:assembleDebug -PapiBase=http://10.0.2.2:8080/api
apiBase=https://autotests.ai/stack/backend-java-spring/api
# Matrix backend id — scopes the stored auth token exactly like the SPA
# (`authToken:<backendId>` in appBase.ts). Empty → plain `authToken`.
backendId=backend-java-spring
# `/stack/` board opened by header-nav-stack (no WebView — system browser).
stackIndexUrl=https://autotests.ai/stack/
