name: unit
description: Dispatch unit to the active frontend language family (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.FRONTEND_LANG == 'typescript'
      uses: ./frontend/typescript/.github/actions/unit
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.FRONTEND_LANG == 'javascript'
      uses: ./frontend/javascript/.github/actions/unit
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.FRONTEND_LANG != 'typescript' && env.FRONTEND_LANG != 'javascript'
      shell: bash
      run: |
        echo "STOP: no unit action for FRONTEND_LANG=${FRONTEND_LANG:-unset}" >&2
        exit 1
