org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# API origin for the matrix backend cell. Override per stand:
#   ./gradlew assembleDebug -PapiBase=http://10.0.2.2:8080/api          (emulator → local Spring)
#   ./gradlew assembleDebug -PapiBase=https://autotests.ai/stack/backend-python-fastapi/api
apiBase=https://autotests.ai/stack/backend-java-spring/api
# Matrix backend id — scopes the stored auth token exactly like the SPA
# (`authToken:<backendId>` in appBase.ts). Empty → plain `authToken`.
backendId=backend-java-spring
# `/stack/` board opened by header-nav-stack (no WebView — system browser).
stackIndexUrl=https://autotests.ai/stack/
