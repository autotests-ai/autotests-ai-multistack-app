<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="icons/qa-guru-logo.svg" />
  <link rel="apple-touch-icon" href="icons/pwa-192.png" />
  <title>Login — Multistack</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/link.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/plaque-field.css">
  <link rel="stylesheet" href="css/icon.css">
  <link rel="stylesheet" href="css/icon-btn.css">
  <link rel="stylesheet" href="css/lang-toggle.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="app-header"></div>
  <script src="js/app-base.js"></script>
  <script>
    window.headerConfig = {
      brand: { href: appPath('/'), label: 'Reference' },
      nav: [
        { href: appPath('/'), label: 'Home', testid: 'header-nav-home' },
        { href: appPath('/login'), label: 'Login', active: true, testid: 'header-nav-login' },
        { href: appPath('/register'), label: 'Register', testid: 'header-nav-register' },
        { href: '/stack/', label: 'Stack', testid: 'header-nav-stack' },
      ],
      lang: { default: 'en' },
      theme: { default: 'dark' },
    };
  </script>
  <script type="module" src="js/header.js"></script>

  <main class="auth-page">
    <div class="panel panel--content auth-panel" data-testid="login-panel">
      <div class="panel__bar">
        <div class="panel__dots" aria-hidden="true">
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
        </div>
        <div class="panel__trail">
          <span class="panel__title" data-testid="login-form-title">Login Form</span>
        </div>
      </div>
      <div class="panel__body">
        <form id="login-form" class="auth-form" data-testid="login-form">
          <div class="plaque-field-list">
            <label class="plaque-field plaque-field--divided plaque-field--stretch">
              <span class="plaque-field__text">Login</span>
              <input
                id="login-input"
                name="username"
                type="text"
                class="plaque-field__control input"
                autocomplete="username"
                data-testid="login-input"
              />
            </label>

            <label class="plaque-field plaque-field--divided plaque-field--stretch">
              <span class="plaque-field__text">Password</span>
              <input
                id="password-input"
                name="password"
                type="password"
                class="plaque-field__control input"
                autocomplete="current-password"
                data-testid="password-input"
              />
            </label>
          </div>

          <p id="error-message" class="auth-error" aria-live="polite" data-testid="error-message"></p>

          <div class="auth-form__actions">
            <button id="submit-button" type="submit" class="btn btn--primary btn--block" data-testid="submit-button">Login</button>
          </div>
        </form>

        <p class="auth-footer-link">
          No account? <a href="register" data-testid="register-link">Register</a>
        </p>
      </div>
    </div>
  </main>

  <script src="vendor/jquery.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
