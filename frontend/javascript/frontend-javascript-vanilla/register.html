<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="icons/qa-guru-logo.svg" />
  <link rel="apple-touch-icon" href="icons/pwa-192.png" />
  <title>Register — Multistack</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/link.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/button.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/plaque-field.css">
  <link rel="stylesheet" href="css/icon.css">
  <link rel="stylesheet" href="css/icon-btn.css">
  <link rel="stylesheet" href="css/lang-toggle.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="app-header"></div>
  <script src="js/app-base.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/header-config.js"></script>
  <script type="module">
    import { envNavItems } from './js/env-hosts.js';
    window.envNavItems = envNavItems;
    I18n.applyDocumentLang(I18n.readStoredLang());
    window.headerConfig = buildHeaderConfig(I18n.readStoredLang());
  </script>
  <script type="module" src="js/header.js"></script>

  <main class="auth-page">
    <div class="panel panel--content auth-panel" data-testid="register-panel">
      <div class="panel__bar">
        <div class="panel__dots" aria-hidden="true">
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
        </div>
        <div class="panel__trail">
          <span class="panel__title" data-testid="register-form-title" data-i18n="register.title">Register</span>
        </div>
      </div>
      <div class="panel__body">
        <form id="register-form" class="auth-form" data-testid="register-form">
          <div class="plaque-field-list">
            <label class="plaque-field plaque-field--divided plaque-field--stretch">
              <span class="plaque-field__text" data-i18n="register.loginLabel">Login</span>
              <input
                id="register-login-input"
                name="username"
                type="text"
                class="plaque-field__control input"
                autocomplete="username"
                data-testid="register-login-input"
              />
            </label>

            <label class="plaque-field plaque-field--divided plaque-field--stretch">
              <span class="plaque-field__text" data-i18n="register.passwordLabel">Password</span>
              <input
                id="register-password-input"
                name="password"
                type="password"
                class="plaque-field__control input"
                autocomplete="new-password"
                data-testid="register-password-input"
              />
            </label>

            <label class="plaque-field plaque-field--divided plaque-field--stretch">
              <span class="plaque-field__text" data-i18n="register.confirmLabel">Confirm</span>
              <input
                id="confirm-password-input"
                name="confirm-password"
                type="password"
                class="plaque-field__control input"
                autocomplete="new-password"
                data-testid="confirm-password-input"
              />
            </label>
          </div>

          <p id="register-error-message" class="auth-error" aria-live="polite" data-testid="register-error-message"></p>

          <div class="auth-form__actions">
            <button id="register-submit-button" type="submit" class="btn btn--primary btn--block" data-testid="register-submit-button" data-i18n="register.submit">Register</button>
          </div>
        </form>

        <p class="auth-footer-link">
          <span data-i18n="register.haveAccount">Already have an account?</span>
          <a href="login" data-testid="login-link" data-i18n="register.loginLink">Login</a>
        </p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
