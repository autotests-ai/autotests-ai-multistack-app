# Static UI at document root.
# Prod: host nginx strips /{backend}/{frontend}.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/backend-[^/]+/frontend-[^/]+(/.*)$ {
        rewrite ^/backend-[^/]+/frontend-[^/]+(/.*)$ $1 last;
    }

    # $uri.html resolves the extensionless /login and /register the pages navigate to.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
