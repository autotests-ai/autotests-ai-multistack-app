# Static UI at document root.
# Prod: host nginx strips /{backend}/{frontend}.
# Local publish-port: optional strip so /{backend}/{frontend}/stack/ still hits /stack/.
# /stack/ is a real directory (matrix + index.html) — do not SPA-fallback over it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/backend-[^/]+/frontend-[^/]+(/.*)$ {
        rewrite ^/backend-[^/]+/frontend-[^/]+(/.*)$ $1 last;
    }

    location = /stack/matrix.json {
        default_type application/json;
        try_files /stack/matrix.json =404;
    }

    location ^~ /stack/ {
        try_files $uri $uri/ /stack/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
