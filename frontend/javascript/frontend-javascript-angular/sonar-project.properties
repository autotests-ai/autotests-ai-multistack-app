# Defaults for local / CI override via -Dsonar.projectKey / SONAR_PROJECT_KEY.
sonar.projectKey=autotests-ai-multistack-app-frontend-javascript-angular
sonar.projectName=autotests-ai-multistack-app-frontend-javascript-angular
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*
sonar.exclusions=**/node_modules/**,**/dist/**,**/allure-results/**,**/coverage/**
sonar.coverage.exclusions=src/main.js,src/styles.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
