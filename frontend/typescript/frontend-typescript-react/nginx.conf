# Static SPA at document root.
# Prod: host nginx strips /{backend}/{frontend}.
# Local publish-port: optional strip so /{backend}/{frontend}/stack/ still hits /stack/.
# /stack/ is an SPA route — do not treat the matrix.json directory as an index.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/backend-[^/]+/frontend-[^/]+(/.*)$ {
        rewrite ^/backend-[^/]+/frontend-[^/]+(/.*)$ $1 last;
    }

    location = /stack/matrix.json {
        default_type application/json;
        try_files /stack/matrix.json =404;
    }

    location ~ ^/stack/?$ {
        try_files /index.html =404;
    }

    # Preload scanner may request ./assets/* under /stack/ before <base> applies.
    location ^~ /stack/assets/ {
        rewrite ^/stack/assets/(.*)$ /assets/$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
