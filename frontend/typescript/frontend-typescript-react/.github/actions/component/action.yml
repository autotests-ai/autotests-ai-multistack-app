name: Component RTL frontend-typescript-react
description: npm ci + Vitest / React Testing Library

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: frontend/typescript/frontend-typescript-react/package-lock.json

    - name: Vitest + React Testing Library
      shell: bash
      working-directory: frontend/typescript/frontend-typescript-react
      run: |
        npm ci
        npm test
