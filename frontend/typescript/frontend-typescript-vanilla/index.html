<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="icons/qa-guru-logo.svg" />
  <link rel="apple-touch-icon" href="icons/pwa-192.png" />
  <title>Multistack</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/link.css">
  <link rel="stylesheet" href="css/input.css">
  <link rel="stylesheet" href="css/icon.css">
  <link rel="stylesheet" href="css/icon-btn.css">
  <link rel="stylesheet" href="css/lang-toggle.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="page-shell page-shell--below-header grid multistack" data-testid="multistack-layout">
    <div class="panel panel--content">
      <div class="panel__bar">
        <div class="panel__dots" aria-hidden="true">
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
        </div>
        <div class="panel__trail">
          <span class="panel__title">Multistack</span>
        </div>
      </div>
      <div class="panel__body">
        <p class="text text--muted">
          TypeScript vanilla demo — items loaded from <code>/api/items</code>.
        </p>
      </div>
    </div>

    <div class="panel panel--content" data-testid="welcome-panel" hidden>
      <div class="panel__bar">
        <div class="panel__dots" aria-hidden="true">
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
        </div>
        <div class="panel__trail">
          <span class="panel__title">Session</span>
        </div>
      </div>
      <div class="panel__body multistack__welcome-body">
        <p id="welcome-message" class="text" data-testid="welcome-message"></p>
        <button id="logout-button" type="button" class="btn btn--primary" data-testid="logout-button">Logout</button>
        <button id="delete-account-button" type="button" class="btn btn--danger" data-testid="delete-account-button">Delete account</button>
      </div>
    </div>

    <div class="panel panel--content" data-testid="health-panel">
      <div class="panel__bar">
        <div class="panel__dots" aria-hidden="true">
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
          <span class="panel__dot"></span>
        </div>
        <div class="panel__trail">
          <span class="panel__title">Health</span>
        </div>
      </div>
      <div class="panel__body">
        <p class="text text--sm text--muted" data-testid="health-status">→ Checking health…</p>
      </div>
    </div>

    <div class="grid" data-testid="items-list" aria-live="polite">
      <div class="panel panel--content">
        <div class="panel__bar">
          <div class="panel__dots" aria-hidden="true">
            <span class="panel__dot"></span>
            <span class="panel__dot"></span>
            <span class="panel__dot"></span>
          </div>
          <div class="panel__trail">
            <span class="panel__title">Items</span>
          </div>
        </div>
        <div class="panel__body">
          <p class="text text--muted">→ Loading items…</p>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/home.ts"></script>
</body>
</html>
