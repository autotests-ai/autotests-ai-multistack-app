# Static multi-page app at document root.
# Prod: host nginx strips /{backend}/{frontend}.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/backend-[^/]+/frontend-[^/]+(/.*)$ {
        rewrite ^/backend-[^/]+/frontend-[^/]+(/.*)$ $1 last;
    }

    # $uri.html resolves the extensionless URLs the app navigates to (/login,
    # /register) to their real documents — without it they fall through to
    # index.html and every auth link lands on the home page.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
