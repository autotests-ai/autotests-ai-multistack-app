name: Build frontend-typescript-vue image
description: docker compose build + amd64 check for frontend-typescript-vue

inputs:
  service:
    required: false
    default: frontend-typescript-vue
  image:
    required: false
    default: reference-app-copy-frontend-typescript-vue:latest

runs:
  using: composite
  steps:
    - name: Compose build + arch check
      shell: bash
      run: |
        set -euo pipefail
        docker compose build "${{ inputs.service }}"
        docker inspect "${{ inputs.image }}" --format '{{.Architecture}}' | grep -q amd64
        echo "${{ inputs.image }}" >> "${GITHUB_WORKSPACE}/.ci-images.txt"
