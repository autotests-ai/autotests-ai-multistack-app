name: Component RTL frontend-typescript-vue
description: npm ci + Vitest / Vue Testing Library

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: frontend/typescript/frontend-typescript-vue/package-lock.json

    - name: Vitest + Vue Testing Library
      shell: bash
      working-directory: frontend/typescript/frontend-typescript-vue
      run: |
        npm ci
        npm test
