<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reference · stack</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --ink: #1c1b19;
      --muted: #5c584f;
      --line: #d8d2c6;
      --ok: #1f7a4c;
      --ok-bg: #e4f3ea;
      --down: #a33b2b;
      --down-bg: #f8e8e5;
      --slot: #6b6570;
      --slot-bg: #eceaf0;
      --card: #fffdf8;
      --active: #1a4f8c;
      --active-bg: #e7f0fa;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #fff 0%, transparent 55%),
        linear-gradient(180deg, #ebe6dc 0%, var(--bg) 40%, #e7e2d8 100%);
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    .boards {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }
    .board { min-width: 0; }
    .board h2 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    @media (max-width: 900px) {
      .boards { grid-template-columns: 1fr; }
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .current {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #b7cce4;
      background: var(--active-bg);
      color: var(--active);
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .current__link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .current__link:hover { border-bottom-color: var(--active); }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .pill {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .pill--ok { color: var(--ok); background: var(--ok-bg); border-color: #b7dcc7; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 0.92rem;
    }
    th {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #f7f3eb;
    }
    tr:last-child td { border-bottom: 0; }
    tr.row--active td { background: var(--active-bg); }
    .id { font-family: var(--mono); font-size: 0.84rem; }
    a { color: inherit; }
    .stack-link {
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .stack-link:hover { border-bottom-color: var(--ink); }
    .stack-link.is-active,
    .stack-open.is-active {
      color: var(--active);
      font-weight: 650;
      border-bottom-color: var(--active);
    }
    .stack-link--disabled {
      color: var(--muted);
      cursor: default;
    }
    .stack-open {
      font-family: var(--mono);
      font-size: 0.78rem;
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    .stack-open:hover { border-bottom-color: var(--ink); }
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge--ok { color: var(--ok); background: var(--ok-bg); border-color: #b7dcc7; }
    .badge--slot { color: var(--slot); background: var(--slot-bg); border-color: #d5d0db; }
    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    .err {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: var(--down-bg);
      color: var(--down);
      border: 1px solid #e5c2bb;
      display: none;
    }
    .err.show { display: block; }
    footer {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <main data-testid="stack-page">
    <header>
      <div>
        <h1>Reference · stack</h1>
        <p class="lead">Матрица backend × frontend. Клик по active — <code>/{backend}/{frontend}/stack/</code>. Бейдж текущей пары — home приложения.</p>
      </div>
      <div class="current" id="current">…</div>
    </header>

    <div class="err" id="err"></div>
    <div class="summary" id="summary"></div>

    <div class="boards">
      <section class="board">
        <h2>Backend</h2>
        <table>
          <thead>
            <tr>
              <th>Module</th>
              <th>Status</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="rows-backend"></tbody>
        </table>
      </section>
      <section class="board">
        <h2>Frontend</h2>
        <table>
          <thead>
            <tr>
              <th>Module</th>
              <th>Status</th>
              <th>Open</th>
            </tr>
          </thead>
          <tbody id="rows-frontend"></tbody>
        </table>
      </section>
    </div>
    <footer id="foot"></footer>
  </main>
  <script src="./stack.js"></script>
</body>
</html>
