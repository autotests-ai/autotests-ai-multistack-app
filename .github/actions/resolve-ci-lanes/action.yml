name: resolve-ci-lanes
description: >-
  Same flags as dispatch deploy. Push infers from paths so tests/ does not
  rebuild the app; PR is none (no CD).
outputs:
  backend:
    value: ${{ steps.set.outputs.backend }}
  frontend:
    value: ${{ steps.set.outputs.frontend }}
  tests:
    value: ${{ steps.set.outputs.tests }}
  cd_production:
    value: ${{ steps.set.outputs.cd_production }}
  cd_stage:
    value: ${{ steps.set.outputs.cd_stage }}
  run_api_prod:
    value: ${{ steps.set.outputs.run_api_prod }}
  run_api_stage:
    value: ${{ steps.set.outputs.run_api_stage }}
  run_e2e_prod:
    value: ${{ steps.set.outputs.run_e2e_prod }}
  run_e2e_stage:
    value: ${{ steps.set.outputs.run_e2e_stage }}
runs:
  using: composite
  steps:
    - name: Resolve lanes
      id: set
      shell: bash
      env:
        BEFORE: ${{ env.BEFORE }}
        DEPLOY: ${{ env.DEPLOY }}
        DEPLOY_TARGET: ${{ env.DEPLOY_TARGET }}
        RUN_API: ${{ env.RUN_API }}
        RUN_E2E: ${{ env.RUN_E2E }}
        RUN_SCREENSHOT: ${{ env.RUN_SCREENSHOT }}
        UPDATE_E2E_SCREENSHOTS: ${{ env.UPDATE_E2E_SCREENSHOTS }}
        UPDATE_STAGE_SCREENSHOTS: ${{ env.UPDATE_STAGE_SCREENSHOTS }}
        INCLUDE_TAGS: ${{ env.INCLUDE_TAGS }}
        EXCLUDE_TAGS: ${{ env.EXCLUDE_TAGS }}
      run: |
        set -euo pipefail
        backend=false
        frontend=false
        tests=false
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          case "${DEPLOY}" in
            backend) backend=true ;;
            frontend) frontend=true ;;
            tests) tests=true ;;
            all) backend=true; frontend=true; tests=true ;;
            none|'') ;;
            *) echo "unknown deploy=${DEPLOY}" >&2; exit 1 ;;
          esac
        elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            backend=true
            frontend=true
            tests=true
          else
            CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            match() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
            SHARED='deploy/|docker-compose|\.github/'
            if match "^(backend/|${SHARED})"; then backend=true; fi
            if match "^(frontend/|${SHARED})"; then frontend=true; fi
            if match "^(tests/|${SHARED})"; then tests=true; fi
          fi
        fi
        cd_production=false
        cd_stage=false
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          case "${DEPLOY_TARGET}" in
            stage) cd_stage=true ;;
            both|production|'')
              cd_production=true
              cd_stage=true
              ;;
            *) echo "unknown deploy_target=${DEPLOY_TARGET}" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            cd_production=false
            if [ "${DEPLOY_TARGET}" = "production" ] || [ -z "${DEPLOY_TARGET}" ]; then
              cd_stage=false
            fi
          fi
        elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
          cd_production=true
          cd_stage=true
        elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
          cd_stage=true
        fi
        # Live-test intent only (event / lanes / inputs / cd_*). Deploy results stay on the jobs.
        dispatch_api=false
        dispatch_e2e_prod=false
        dispatch_e2e_stage=false
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          if [ "${RUN_API:-}" = "true" ]; then dispatch_api=true; fi
          if [ "${RUN_E2E:-}" = "true" ] || [ "${RUN_SCREENSHOT:-}" = "true" ] \
            || [ "${UPDATE_E2E_SCREENSHOTS:-}" = "true" ] \
            || [ -n "${INCLUDE_TAGS:-}" ] || [ -n "${EXCLUDE_TAGS:-}" ]; then
            dispatch_e2e_prod=true
          fi
          if [ "${RUN_E2E:-}" = "true" ] || [ "${RUN_SCREENSHOT:-}" = "true" ] \
            || [ "${UPDATE_STAGE_SCREENSHOTS:-}" = "true" ] \
            || [ -n "${INCLUDE_TAGS:-}" ] || [ -n "${EXCLUDE_TAGS:-}" ]; then
            dispatch_e2e_stage=true
          fi
        fi
        want_api=false
        if [ "$backend" = true ] || [ "$tests" = true ] || [ "$dispatch_api" = true ]; then
          want_api=true
        fi
        want_e2e_prod=false
        want_e2e_stage=false
        if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
          if [ "$backend" = true ] || [ "$frontend" = true ] || [ "$tests" = true ]; then
            want_e2e_prod=true
            want_e2e_stage=true
          fi
        elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          if [ "$tests" = true ] || [ "$dispatch_e2e_prod" = true ]; then
            want_e2e_prod=true
          fi
          if [ "$tests" = true ] || [ "$dispatch_e2e_stage" = true ]; then
            want_e2e_stage=true
          fi
        fi
        run_api_prod=false
        run_api_stage=false
        run_e2e_prod=false
        run_e2e_stage=false
        if [ "$cd_production" = true ]; then
          if [ "$want_api" = true ]; then run_api_prod=true; fi
          if [ "$want_e2e_prod" = true ]; then run_e2e_prod=true; fi
        fi
        if [ "$cd_stage" = true ]; then
          if [ "$want_api" = true ]; then run_api_stage=true; fi
          if [ "$want_e2e_stage" = true ]; then run_e2e_stage=true; fi
        fi
        printf 'backend=%s\nfrontend=%s\ntests=%s\ncd_production=%s\ncd_stage=%s\nrun_api_prod=%s\nrun_api_stage=%s\nrun_e2e_prod=%s\nrun_e2e_stage=%s\n' \
          "$backend" "$frontend" "$tests" "$cd_production" "$cd_stage" \
          "$run_api_prod" "$run_api_stage" "$run_e2e_prod" "$run_e2e_stage" >> "$GITHUB_OUTPUT"
        echo "trigger backend=${backend} frontend=${frontend} tests=${tests} cd_production=${cd_production} cd_stage=${cd_stage} run_api_prod=${run_api_prod} run_api_stage=${run_api_stage} run_e2e_prod=${run_e2e_prod} run_e2e_stage=${run_e2e_stage}"
