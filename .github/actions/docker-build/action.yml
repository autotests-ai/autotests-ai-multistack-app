name: docker-build
description: >-
  Build a module image. vars.DEPLOY_MODE=compose (takeaway) → docker compose
  build, no registry. Default / ghcr (clone) → buildx + GHCR push.
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: id
      shell: bash
      run: echo "service=$(basename "${{ inputs.module_dir }}")" >> "$GITHUB_OUTPUT"
    - name: Build image on the runner (no registry)
      if: env.DEPLOY_MODE == 'compose'
      shell: bash
      run: docker compose build "${{ steps.id.outputs.service }}"
    - if: env.DEPLOY_MODE != 'compose'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ env.GITHUB_TOKEN }}
    - if: env.DEPLOY_MODE != 'compose'
      uses: docker/setup-buildx-action@v4
    - if: env.DEPLOY_MODE != 'compose'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.module_dir }}
        file: ${{ inputs.module_dir }}/Dockerfile
        tags: ghcr.io/${{ github.repository_owner }}/autotests-ai-multistack-app-${{ steps.id.outputs.service }}:${{ github.sha }}
        load: true
        cache-from: type=gha,scope=autotests-ai-multistack-app-docker-${{ steps.id.outputs.service }}
        cache-to: type=gha,mode=max,scope=autotests-ai-multistack-app-docker-${{ steps.id.outputs.service }}
    - name: Push Docker image to GHCR
      if: env.DEPLOY_MODE != 'compose'
      shell: bash
      run: docker compose push ${{ steps.id.outputs.service }}
