name: resolve-module-dir
description: >-
  Nested module path when that directory exists; otherwise basename
  (old leaf layout). Empty input stays empty.
inputs:
  module_dir:
    required: false
    default: ""
outputs:
  dir:
    description: Existing directory to pass through as module_dir
    value: ${{ steps.resolve.outputs.dir }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        MODULE_DIR: ${{ inputs.module_dir }}
      run: |
        set -euo pipefail
        nested="${MODULE_DIR}"
        if [ -z "${nested}" ]; then
          echo "dir=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Living Java cells dropped builder/report from the folder id (NAMING.md).
        # ci.yml still formats the old 5-segment path from TESTS_BUILDER/TESTS_REPORT.
        case "${nested}" in
          tests/java/tests-java-gradle-junit5-allure3-selenide)
            nested=tests/java/tests-java-junit5-rest_assured-selenide ;;
          tests/java/tests-java-gradle-junit5-allure3-selenium)
            nested=tests/java/tests-java-junit5-rest_assured-selenium ;;
          tests/java/tests-java-gradle-junit5-allure3-playwright)
            nested=tests/java/tests-java-junit5-api_request-playwright ;;
        esac
        if [ -d "${nested}" ]; then
          echo "dir=${nested}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        leaf="$(basename "${nested}")"
        if [ -d "${leaf}" ]; then
          echo "dir=${leaf}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "STOP: module missing at ${nested} and ${leaf}" >&2
        exit 1
