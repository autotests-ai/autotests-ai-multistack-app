name: catalog-push
description: Push the catalog image loaded by build-push-action; retag :latest on main only.
inputs:
  service:
    required: true
runs:
  using: composite
  steps:
    - name: Push catalog image to GHCR
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
      run: |
        set -euo pipefail
        docker compose push "${SERVICE}"
        if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "skip :latest (only main retags latest)"
          exit 0
        fi
        img="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${APP_SLUG}-${SERVICE}"
        docker tag "${img}:${IMAGE_TAG}" "${img}:latest"
        docker push "${img}:latest"
