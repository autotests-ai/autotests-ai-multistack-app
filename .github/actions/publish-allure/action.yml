name: Publish Allure
description: TestOps upload + Allure Report 3 (JS) + allure-action + optional Telegram (ADR 008)

# Credentials / endpoint come from workflow env (set once in ci.yml):
#   ALLURE_ENDPOINT, ALLURE_TOKEN, ALLURE_PROJECT_ID,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_TOPIC_ID
# Inputs below are job-specific or optional overrides.

inputs:
  tests-dir:
    description: Working directory (module root with results / optional allurerc + publish scripts)
    required: true
  artifact-suffix:
    description: Suffix for upload-artifact names (usually the job id)
    required: true
  results-dir:
    description: Allure results path relative to tests-dir
    required: false
    default: build/allure-results
  report-dir:
    description: Allure HTML report path relative to tests-dir
    required: false
    default: build/reports/allure-report/allureReport
  allure-config:
    description: Optional Allure 3 config file relative to tests-dir (empty → no --config)
    required: false
    default: allurerc.mjs
  enable-notifications:
    description: "true → npm install + allure-publish.mjs (needs tests-module publish setup)"
    required: false
    default: "true"
  notification-project:
    description: Project label in the Telegram collage header
    required: false
    default: "Reference App Copy"
  launch-name:
    description: Allure TestOps launch name
    required: false
    default: ""
  github-token:
    description: Token for allure-action PR comments / checks
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # ── Stage 1: TestOps ───────────────────────────────────────────────────
    - name: Install allurectl
      if: env.ALLURE_PROJECT_ID != ''
      continue-on-error: true
      id: setup-allurectl
      uses: allure-framework/setup-allurectl@v1
      with:
        allure-endpoint: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
        allure-token: ${{ env.ALLURE_TOKEN }}
        allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

    - name: Upload results to Allure TestOps
      if: >-
        env.ALLURE_PROJECT_ID != '' &&
        steps.setup-allurectl.outcome == 'success'
      continue-on-error: true
      id: testops-upload
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      env:
        ALLURE_ENDPOINT: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
        ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
        ALLURE_PROJECT_ID: ${{ env.ALLURE_PROJECT_ID }}
        ALLURE_LAUNCH_NAME: ${{ inputs.launch-name }}
      run: |
        set -euo pipefail
        RESULTS="${{ inputs.results-dir }}"
        if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null || true)" ]; then
          echo "No allure-results at ${RESULTS} — skip TestOps upload"
          exit 0
        fi
        # Cert on this instance is issued for allure.autotests.cloud (not allure.qa.guru).
        ARGS=(
          upload "$RESULTS"
          --endpoint "${ALLURE_ENDPOINT}"
          --token "${ALLURE_TOKEN}"
          --project-id "${ALLURE_PROJECT_ID}"
        )
        if [ -n "${ALLURE_LAUNCH_NAME:-}" ]; then
          ARGS+=(--launch-name "${ALLURE_LAUNCH_NAME}")
        fi
        allurectl "${ARGS[@]}"

    # ── Stage 2: Allure Report 3 (JS CLI) + allure-action + artifacts ─────
    - name: Setup Node
      if: always()
      uses: actions/setup-node@v6
      with:
        node-version: "26"

    - name: Generate Allure 3 report
      if: always() && inputs.allure-config == ''
      continue-on-error: true
      id: allure-report
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      run: npx --yes allure@3.13.0 generate ${{ inputs.results-dir }} -o ${{ inputs.report-dir }}

    - name: Generate Allure 3 report (with config)
      if: always() && inputs.allure-config != ''
      continue-on-error: true
      id: allure-report-config
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      run: npx --yes allure@3.13.0 generate ${{ inputs.results-dir }} -o ${{ inputs.report-dir }} --config ${{ inputs.allure-config }}

    - name: Allure GitHub Action
      if: >-
        always() &&
        (steps.allure-report.outcome == 'success' || steps.allure-report-config.outcome == 'success')
      continue-on-error: true
      uses: allure-framework/allure-action@v0
      with:
        report-directory: ${{ inputs.tests-dir }}/${{ inputs.report-dir }}
        github-token: ${{ inputs.github-token }}

    - name: Upload Allure results artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-${{ inputs.artifact-suffix }}
        path: ${{ inputs.tests-dir }}/${{ inputs.results-dir }}/
        if-no-files-found: ignore

    - name: Upload Allure report artifact
      if: >-
        always() &&
        (steps.allure-report.outcome == 'success' || steps.allure-report-config.outcome == 'success')
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-report-${{ inputs.artifact-suffix }}
        path: ${{ inputs.tests-dir }}/${{ inputs.report-dir }}/
        if-no-files-found: ignore

    # ── Stage 3: Notifications (ADR 008) ───────────────────────────────────
    - name: Install Allure publish deps
      if: >-
        always() &&
        inputs.enable-notifications == 'true' &&
        (steps.allure-report.outcome == 'success' || steps.allure-report-config.outcome == 'success')
      continue-on-error: true
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      run: npm install --no-save

    - name: Publish Allure (theme + Telegram plugin)
      if: >-
        always() &&
        inputs.enable-notifications == 'true' &&
        (steps.allure-report.outcome == 'success' || steps.allure-report-config.outcome == 'success')
      continue-on-error: true
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      env:
        # PR → dry-run; push / dispatch → live (same rule every call site used).
        NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
        NOTIFICATION_PROJECT: ${{ inputs.notification-project }}
        ALLURE_REPORT_URL: ""
        ALLURE_DASHBOARD_URL: ""
        BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID || '-1004381150566' }}
        TELEGRAM_TOPIC_ID: ${{ env.TELEGRAM_TOPIC_ID || '3' }}
      run: node scripts/allure-publish.mjs
