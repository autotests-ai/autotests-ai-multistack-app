name: Publish Allure
description: TestOps upload + Allure Report 3 (JS) artifacts + Telegram notifications (ADR 008)

inputs:
  tests-dir:
    description: Path to the tests module (cwd for Allure CLI / notifications)
    required: true
  artifact-suffix:
    description: Suffix for upload-artifact names (usually the job id)
    required: true
  allure-endpoint:
    description: Allure TestOps endpoint
    required: false
    default: https://allure.qa.guru
  allure-token:
    description: Allure TestOps API token
    required: false
    default: ""
  allure-project-id:
    description: Allure TestOps project id (empty → skip TestOps)
    required: false
    default: ""
  telegram-bot-token:
    description: Telegram bot token (ADR 008)
    required: false
    default: ""
  telegram-chat-id:
    description: Telegram forum chat id (ADR 008 monitoring chat)
    required: false
    default: "-1004381150566"
  telegram-topic-id:
    description: Forum topic id (reference-app shared = 3)
    required: false
    default: "3"
  notification-live:
    description: "true → NOTIFICATION_MODE=live; false → dry-run"
    required: false
    default: "true"
  notification-project:
    description: Project label in the Telegram collage header
    required: false
    default: "Reference App Copy"
  test-outcome:
    description: Unused (kept for ci.yml call sites)
    required: false
    default: "success"
  build-url:
    description: CI build URL for notification links
    required: false
    default: ""
  launch-name:
    description: Allure TestOps launch name
    required: false
    default: ""
  github-token:
    description: Token for allure-action PR comments / checks
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # ── Stage 1: TestOps ───────────────────────────────────────────────────
    - name: Install allurectl
      if: inputs.allure-project-id != ''
      continue-on-error: true
      id: setup-allurectl
      uses: allure-framework/setup-allurectl@v1
      with:
        allure-endpoint: ${{ inputs.allure-endpoint }}
        allure-token: ${{ inputs.allure-token }}
        allure-project-id: ${{ inputs.allure-project-id }}

    - name: Upload results to Allure TestOps
      if: >-
        inputs.allure-project-id != '' &&
        steps.setup-allurectl.outcome == 'success'
      continue-on-error: true
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      env:
        ALLURE_LAUNCH_NAME: ${{ inputs.launch-name }}
      run: allurectl upload build/allure-results

    # ── Stage 2: Allure Report 3 (JS CLI) + artifacts ──────────────────────
    - name: Setup Node
      if: always()
      uses: actions/setup-node@v6
      with:
        node-version: "26"

    - name: Install Allure 3 deps
      if: always()
      continue-on-error: true
      id: allure-deps
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      run: npm install --no-save

    - name: Generate Allure 3 report
      if: always() && steps.allure-deps.outcome == 'success'
      continue-on-error: true
      id: allure-report
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      run: npx allure generate build/allure-results -o build/reports/allure-report/allureReport --config allurerc.mjs

    - name: Allure GitHub Action
      if: always() && steps.allure-report.outcome == 'success'
      continue-on-error: true
      uses: allure-framework/allure-action@v0
      with:
        report-directory: ${{ inputs.tests-dir }}/build/reports/allure-report/allureReport
        github-token: ${{ inputs.github-token }}

    - name: Upload Allure results artifact
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-${{ inputs.artifact-suffix }}
        path: ${{ inputs.tests-dir }}/build/allure-results/
        if-no-files-found: ignore

    - name: Upload Allure report artifact
      if: always() && steps.allure-report.outcome == 'success'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-report-${{ inputs.artifact-suffix }}
        path: ${{ inputs.tests-dir }}/build/reports/allure-report/allureReport/
        if-no-files-found: ignore

    # ── Stage 3: Notifications (ADR 008) ───────────────────────────────────
    - name: Publish Allure (theme + Telegram plugin)
      if: always() && steps.allure-report.outcome == 'success'
      continue-on-error: true
      working-directory: ${{ inputs.tests-dir }}
      shell: bash
      env:
        NOTIFICATION_MODE: ${{ inputs.notification-live == 'true' && 'live' || 'dry-run' }}
        NOTIFICATION_PROJECT: ${{ inputs.notification-project }}
        ALLURE_REPORT_URL: ""
        ALLURE_DASHBOARD_URL: ""
        BUILD_URL: ${{ inputs.build-url }}
        TELEGRAM_BOT_TOKEN: ${{ inputs.telegram-bot-token }}
        TELEGRAM_CHAT_ID: ${{ inputs.telegram-chat-id }}
        TELEGRAM_TOPIC_ID: ${{ inputs.telegram-topic-id }}
      run: node scripts/allure-publish.mjs
