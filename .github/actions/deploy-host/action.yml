name: deploy-host
description: >-
  SSH git checkout + compose up. DEPLOY_MODE=compose → up --build (no GHCR).
  Default / ghcr → login, pull, up. Job must set DEPLOY_* env (host, dir, services).
runs:
  using: composite
  steps:
    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.2.5
      env:
        GHCR_TOKEN: ${{ env.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ env.DEPLOY_SSH_KEY }}
        command_timeout: 15m
        envs: IMAGE_TAG,GHCR_TOKEN,GITHUB_ACTOR,DEPLOY_MODE,DEPLOY_COMPOSE_SERVICES,DEPLOY_HEALTH_URL,DEPLOY_APP_DIR,DEPLOY_COMPOSE_PROJECT,DEPLOY_COMPOSE_ENV_FILE,DEPLOY_SINGLE_BACKEND
        script: |
          set -euo pipefail
          APP_DIR="${DEPLOY_APP_DIR:?DEPLOY_APP_DIR is required}"
          cd "$APP_DIR"
          git fetch origin
          git checkout --force "$IMAGE_TAG"
          COMPOSE="docker compose"
          if [ -n "${DEPLOY_COMPOSE_PROJECT:-}" ]; then
            COMPOSE="$COMPOSE --project-name ${DEPLOY_COMPOSE_PROJECT}"
          fi
          if [ -n "${DEPLOY_COMPOSE_ENV_FILE:-}" ]; then
            COMPOSE="$COMPOSE --env-file ${DEPLOY_COMPOSE_ENV_FILE}"
          fi
          if [ -n "${DEPLOY_COMPOSE_SERVICES:-}" ]; then
            available="$($COMPOSE config --services)"
            keep=""
            for s in ${DEPLOY_COMPOSE_SERVICES}; do
              if printf '%s\n' "$available" | grep -qx "$s"; then
                keep="${keep} ${s}"
              else
                echo "skip missing compose service: ${s}"
              fi
            done
            DEPLOY_COMPOSE_SERVICES="${keep# }"
            if [ -z "${DEPLOY_COMPOSE_SERVICES}" ]; then
              echo "no listed compose services exist in this file" >&2
              exit 1
            fi
          fi
          if [ "${DEPLOY_SINGLE_BACKEND:-}" = "true" ]; then
            if [ ! -f deploy/stop-sibling-services.sh ]; then
              echo "STOP: DEPLOY_SINGLE_BACKEND requires deploy/stop-sibling-services.sh" >&2
              exit 1
            fi
            # Pull/build first while the previous cell still serves, then stop
            # every other service so two backends never run at once.
            if [ "${DEPLOY_MODE:-ghcr}" != "compose" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
              $COMPOSE pull ${DEPLOY_COMPOSE_SERVICES}
            fi
            bash deploy/stop-sibling-services.sh postgres postgres-ensure-dbs ${DEPLOY_COMPOSE_SERVICES}
            if [ "${DEPLOY_MODE:-ghcr}" = "compose" ]; then
              $COMPOSE up -d --build --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
            else
              $COMPOSE up -d --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
              docker logout ghcr.io
            fi
          elif [ "${DEPLOY_MODE:-ghcr}" = "compose" ]; then
            $COMPOSE up -d --build --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
          else
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            $COMPOSE pull ${DEPLOY_COMPOSE_SERVICES}
            $COMPOSE up -d --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
            docker logout ghcr.io
          fi
          if [ -n "${DEPLOY_HEALTH_URL:-}" ]; then
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${DEPLOY_HEALTH_URL}"
          fi
