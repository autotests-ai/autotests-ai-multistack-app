name: Backend Python

# Sibling of teaching ci.yml (java-spring knobs). Same verbs: unit · integration ·
# sonar. coverage.py / pytest-cov is the JaCoCo analog. Do not fold into teaching
# ci.yml (one BACKEND knob). Pins: tests/_tests-meta/.github/_ethalon/gha-actions.yaml

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/python/**"
      - ".github/workflows/backend_python_github.yml"
      - ".github/actions/setup-allurectl/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/python/**"
      - ".github/workflows/backend_python_github.yml"
      - ".github/actions/setup-allurectl/**"
  workflow_dispatch:

concurrency:
  group: backend-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"
  SONAR_SCANNER_NPM_VERSION: "5.0.0"
  SONAR_QUALITY_GATE_TIMEOUT: "600"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  ALLURECTL_VERSION: "2.22.0"
  ALLURE_LIVE_ENABLED: "false"
  CHECKOUT_FETCH_DEPTH: "1"

jobs:
  backend-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        framework: [flask, fastapi, django]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/python/.github/actions/unit
        with:
          module_dir: backend/python/backend-python-${{ matrix.framework }}
          coverage_artifact: coverage-backend-python-${{ matrix.framework }}
          allure_artifact: allure-results-unit-python-${{ matrix.framework }}

  integration-tests:
    needs: [backend-unit-tests]
    if: always() && !cancelled() && needs.backend-unit-tests.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        framework: [flask, fastapi, django]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/python/.github/actions/integration
        with:
          module_dir: backend/python/backend-python-${{ matrix.framework }}
          allure_artifact: allure-results-integration-python-${{ matrix.framework }}

  sonar-backend:
    needs: [backend-unit-tests, integration-tests]
    if: >-
      !cancelled() &&
      needs.backend-unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        framework: [flask, fastapi, django]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: autotests-ai-multistack-app-backend-python-${{ matrix.framework }}
      CHECKOUT_FETCH_DEPTH: "0"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/python/.github/actions/sonar
        with:
          module_dir: backend/python/backend-python-${{ matrix.framework }}
          coverage_artifact: coverage-backend-python-${{ matrix.framework }}
          report_task_artifact: sonar-backend-report-task-python-${{ matrix.framework }}
