# Expand deploy.yml to every active backend + frontend from deploy/matrix.yaml.

name: reference-app-copy Deploy all

on:
  workflow_dispatch:

run-name: reference-app-copy deploy all (${{ github.ref_name }} @ ${{ github.sha }})

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      deploy_mode: all
