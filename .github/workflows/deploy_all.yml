# Expand deploy.yml to every active backend + web.

name: reference-app-copy Deploy all

on:
  workflow_dispatch:

run-name: reference-app-copy deploy all (${{ github.ref_name }} @ ${{ github.sha }})

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      backends: >-
        backend-java-spring,backend-kotlin-spring,backend-python-flask,backend-python-fastapi,backend-python-django
      build_web: true
      deploy_mode: all
