# Expand test.yml (python unit matrix + default scope).

name: reference-app-copy Tests all

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "ci | prod | all"
        required: false
        default: all

run-name: reference-app-copy tests all (${{ github.ref_name }} @ ${{ github.sha }})

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      scope: ${{ inputs.scope || 'all' }}
      include_python: true
