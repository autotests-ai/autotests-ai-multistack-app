name: GHCR retention

# Registry janitor after CI on main. Not a job in ci.yml: must not appear on the
# teaching graph and must not sit on the build → deploy → api/e2e path.
# Folding this into build-* would delay deploy (needs build) and therefore stand tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  retain:
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    env:
      KEEP: "10"
      # Keep in sync with ci.yml env GHCR_*_PACKAGE
      GHCR_BACKEND_PACKAGE: reference-app-copy-backend-java-spring
      GHCR_FRONTEND_PACKAGE: reference-app-copy-frontend-typescript-react
    steps:
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          packages=(
            "${GHCR_BACKEND_PACKAGE}"
            "${GHCR_FRONTEND_PACKAGE}"
          )
          for pkg in "${packages[@]}"; do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done
