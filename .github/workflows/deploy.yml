# Leaf deploy — called by ci.yml (main) or deploy_all.yml / workflow_dispatch.
# Host logic SSOT: deploy/server-deploy.sh + deploy/matrix.yaml.
# Does not run autotests (see test.yml / ci.yml).

name: reference-app-copy Deploy

on:
  workflow_dispatch:
    inputs:
      backends:
        description: "Comma-separated compose backend ids"
        required: false
        default: backend-java-spring
      frontends:
        description: "Comma-separated compose frontend ids"
        required: false
        default: frontend-typescript-react
      deploy_mode:
        description: "default = selected services; all = every active id from matrix.yaml"
        required: false
        default: default
  workflow_call:
    inputs:
      backends:
        type: string
        required: false
        default: backend-java-spring
      frontends:
        type: string
        required: false
        default: frontend-typescript-react
      deploy_mode:
        type: string
        required: false
        default: default

run-name: reference-app-copy deploy (${{ github.ref_name }} @ ${{ github.sha }})

concurrency:
  group: deploy-reference-app-copy-production
  cancel-in-progress: false

env:
  BACKENDS: ${{ inputs.backends || 'backend-java-spring' }}
  FRONTENDS: ${{ inputs.frontends || 'frontend-typescript-react' }}
  DEPLOY_MODE: ${{ inputs.deploy_mode || 'default' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.stacks.outputs.backends }}
      frontends: ${{ steps.stacks.outputs.frontends }}
      images: ${{ steps.stacks.outputs.images }}
      matrix: ${{ steps.stacks.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target stacks
        id: stacks
        run: |
          set -euo pipefail
          MODE="${DEPLOY_MODE}"
          if [[ "${MODE}" == "all" ]]; then
            BACKENDS="$(python deploy/matrix_query.py ids backends --mode all --csv)"
            FRONTENDS="$(python deploy/matrix_query.py ids frontends --mode all --csv)"
          fi
          MATRIX_JSON="$(python deploy/matrix_query.py build-matrix \
            --mode default \
            --backends "${BACKENDS}" \
            --frontends "${FRONTENDS}")"
          IMAGES="$(python -c 'import json,sys; print(",".join(r["image"] for r in json.loads(sys.argv[1])))' "${MATRIX_JSON}")"
          {
            echo "BACKENDS=${BACKENDS}"
            echo "FRONTENDS=${FRONTENDS}"
          } >> "$GITHUB_ENV"
          {
            echo "backends=${BACKENDS}"
            echo "frontends=${FRONTENDS}"
            echo "images=${IMAGES}"
            echo "matrix<<EOF"
            echo "${MATRIX_JSON}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy targets: backends=${BACKENDS} frontends=${FRONTENDS}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose build + arch check
        run: |
          set -euo pipefail
          docker compose build "${{ matrix.compose_service }}"
          docker inspect "${{ matrix.image }}" --format '{{.Architecture}}' | grep -q amd64

      - name: Save image artifact
        run: |
          set -euo pipefail
          docker save "${{ matrix.image }}" | gzip > "/tmp/${{ matrix.id }}.tar.gz"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.id }}
          path: /tmp/${{ matrix.id }}.tar.gz
          retention-days: 1

  pack:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images

      - name: Merge into app-images.tar.gz
        env:
          IMAGES: ${{ needs.resolve.outputs.images }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/images/*.tar.gz)
          test "${#files[@]}" -gt 0 || {
            echo "::error::No image artifacts downloaded"
            exit 1
          }
          for f in "${files[@]}"; do
            gunzip -c "$f" | docker load
          done
          IFS=',' read -r -a imgs <<< "${IMAGES}"
          docker save "${imgs[@]}" | gzip > /tmp/app-images.tar.gz
          echo "Saved: ${imgs[*]}"

      - name: Upload app images
        uses: actions/upload-artifact@v7
        with:
          name: app-images
          path: /tmp/app-images.tar.gz
          retention-days: 1

  deploy:
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'reference_app_copy' }}
      BACKENDS: ${{ needs.resolve.outputs.backends }}
      FRONTENDS: ${{ needs.resolve.outputs.frontends }}
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Deploy"
            exit 1
          }

      - name: Download app images
        uses: actions/download-artifact@v8
        with:
          name: app-images
          path: /tmp

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Transfer app images
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          gunzip -c /tmp/app-images.tar.gz | \
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" docker load

      - name: Deploy on production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: BACKENDS,FRONTENDS,DEPLOY_MODE
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/reference_app_copy/reference-app-copy}"
            cd "$APP_DIR"
            # Sync first so this run executes the commit's server-deploy.sh / matrix_query.py
            git fetch --all
            git reset --hard origin/main
            SKIP_BUILD=1 bash deploy/server-deploy.sh
