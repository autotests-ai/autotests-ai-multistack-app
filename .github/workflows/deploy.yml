# Leaf deploy — called by ci.yml (main) or deploy_all.yml / workflow_dispatch.
# Deploy matrix artifact: deploy/deploy-matrix.json → selections.{default,all}
# (sync locally: python deploy/matrix_query.py sync-deploy-matrix).
# Host logic SSOT: deploy/server-deploy.sh + deploy/matrix.yaml.
# Does not run autotests (see test.yml / ci.yml).

name: reference-app-copy Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "default | all — picks selections.* from deploy-matrix.json"
        required: false
        default: default
  workflow_call:
    inputs:
      deploy_mode:
        type: string
        required: false
        default: default

run-name: reference-app-copy deploy (${{ github.ref_name }} @ ${{ github.sha }})

concurrency:
  group: deploy-reference-app-copy-production
  cancel-in-progress: false

env:
  DEPLOY_MODE: ${{ inputs.deploy_mode || 'default' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backends: ${{ steps.stacks.outputs.backends }}
      frontends: ${{ steps.stacks.outputs.frontends }}
      images: ${{ steps.stacks.outputs.images }}
      matrix: ${{ steps.stacks.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target stacks
        id: stacks
        run: |
          set -euo pipefail
          ARTIFACT=deploy/deploy-matrix.json
          if [[ ! -f "$ARTIFACT" ]]; then
            echo "::error::Missing $ARTIFACT — run locally: python deploy/matrix_query.py sync-deploy-matrix"
            exit 1
          fi
          MODE="${DEPLOY_MODE}"
          case "$MODE" in
            default|all) ;;
            *)
              echo "::error::deploy_mode must be default|all (got: ${MODE})"
              exit 1
              ;;
          esac
          sel="$(jq -c --arg m "$MODE" '.selections[$m]' "$ARTIFACT")"
          if [[ "$sel" == "null" || -z "$sel" ]]; then
            echo "::error::Missing selections.${MODE} in $ARTIFACT — re-run sync-deploy-matrix"
            exit 1
          fi
          BACKENDS="$(jq -r '.backends' <<<"$sel")"
          FRONTENDS="$(jq -r '.frontends' <<<"$sel")"
          IMAGES="$(jq -r '.images' <<<"$sel")"
          MATRIX_JSON="$(jq -c '.matrix' <<<"$sel")"
          test -n "$IMAGES" || {
            echo "::error::Resolved empty image list"
            exit 1
          }
          {
            echo "BACKENDS=${BACKENDS}"
            echo "FRONTENDS=${FRONTENDS}"
          } >> "$GITHUB_ENV"
          {
            echo "backends=${BACKENDS}"
            echo "frontends=${FRONTENDS}"
            echo "images=${IMAGES}"
            echo "matrix<<EOF"
            echo "${MATRIX_JSON}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy targets: backends=${BACKENDS} frontends=${FRONTENDS}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose build + arch check
        run: |
          set -euo pipefail
          docker compose build "${{ matrix.compose_service }}"
          docker inspect "${{ matrix.image }}" --format '{{.Architecture}}' | grep -q amd64

      - name: Save image artifact
        run: |
          set -euo pipefail
          docker save "${{ matrix.image }}" | gzip > "/tmp/${{ matrix.id }}.tar.gz"

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.id }}
          path: /tmp/${{ matrix.id }}.tar.gz
          retention-days: 1

  pack:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
          path: /tmp/images

      - name: Merge into app-images.tar.gz
        env:
          IMAGES: ${{ needs.resolve.outputs.images }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/images/*.tar.gz)
          test "${#files[@]}" -gt 0 || {
            echo "::error::No image artifacts downloaded"
            exit 1
          }
          for f in "${files[@]}"; do
            gunzip -c "$f" | docker load
          done
          IFS=',' read -r -a imgs <<< "${IMAGES}"
          docker save "${imgs[@]}" | gzip > /tmp/app-images.tar.gz
          echo "Saved: ${imgs[*]}"

      - name: Upload app images
        uses: actions/upload-artifact@v7
        with:
          name: app-images
          path: /tmp/app-images.tar.gz
          retention-days: 1

  deploy:
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'reference_app_copy' }}
      BACKENDS: ${{ needs.resolve.outputs.backends }}
      FRONTENDS: ${{ needs.resolve.outputs.frontends }}
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Deploy"
            exit 1
          }

      - name: Download app images
        uses: actions/download-artifact@v8
        with:
          name: app-images
          path: /tmp

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Transfer app images
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          gunzip -c /tmp/app-images.tar.gz | \
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" docker load

      - name: Deploy on production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: BACKENDS,FRONTENDS,DEPLOY_MODE
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/reference_app_copy/reference-app-copy}"
            cd "$APP_DIR"
            # Sync first so this run executes the commit's server-deploy.sh
            git fetch --all
            git reset --hard origin/main
            SKIP_BUILD=1 bash deploy/server-deploy.sh
