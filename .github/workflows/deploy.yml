name: reference-app-copy Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: reference-app-copy deploy (${{ github.ref_name }} @ ${{ github.sha }})

concurrency:
  group: deploy-reference-app-copy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Deploy"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image (linux/amd64)
        run: |
          docker compose build backend
          docker inspect reference-app-copy-backend:latest --format '{{.Architecture}}' | grep -q amd64

      - name: Transfer backend image
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'selenoid' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          docker save reference-app-copy-backend:latest | \
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              "${DEPLOY_USER}@${DEPLOY_HOST}" docker load

      - name: Deploy on production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
          username: ${{ vars.DEPLOY_USER || 'selenoid' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/selenoid/reference-app-copy}"
            export SERVER_PORT="${SERVER_PORT:-8084}"
            PUBLIC_URL="${PUBLIC_URL:-https://reference-app-copy.autotests.ai}"
            cd "$APP_DIR"
            git -c http.proxy= -c https.proxy= fetch --all
            git reset --hard origin/main
            docker compose up -d --no-build --remove-orphans
            bash deploy/health-poll.sh
            bash deploy/smoke-remote.sh "$PUBLIC_URL"
            echo "Deploy OK: ${PUBLIC_URL} ($(git rev-parse --short HEAD))"
