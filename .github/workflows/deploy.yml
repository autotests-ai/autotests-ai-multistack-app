# Universal deploy — defaults: backend-java-spring + frontend-typescript-react.
# Expand via workflow_dispatch inputs or deploy_all.yml.
# Does not run autotests (see test.yml).

name: reference-app-copy Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backends:
        description: "Comma-separated compose backend ids"
        required: false
        default: backend-java-spring
      frontends:
        description: "Comma-separated compose frontend ids"
        required: false
        default: frontend-typescript-react
      deploy_mode:
        description: "default = selected services; all = full server-deploy.sh"
        required: false
        default: default
  workflow_call:
    inputs:
      backends:
        type: string
        required: false
        default: backend-java-spring
      frontends:
        type: string
        required: false
        default: frontend-typescript-react
      deploy_mode:
        type: string
        required: false
        default: default

run-name: reference-app-copy deploy (${{ github.ref_name }} @ ${{ github.sha }})

concurrency:
  group: deploy-reference-app-copy-production
  cancel-in-progress: false

env:
  BACKENDS: ${{ inputs.backends || 'backend-java-spring' }}
  FRONTENDS: ${{ inputs.frontends || 'frontend-typescript-react' }}
  DEPLOY_MODE: ${{ inputs.deploy_mode || 'default' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init image list
        run: truncate -s 0 .ci-images.txt

      - name: Build backend-java-spring
        if: contains(format(',{0},', env.BACKENDS), ',backend-java-spring,')
        uses: ./backend/java/backend-java-spring/.github/actions/build

      - name: Build backend-kotlin-spring
        if: contains(format(',{0},', env.BACKENDS), ',backend-kotlin-spring,')
        uses: ./backend/kotlin/backend-kotlin-spring/.github/actions/build

      - name: Build backend-python-flask
        if: contains(format(',{0},', env.BACKENDS), ',backend-python-flask,')
        uses: ./backend/python/backend-python-flask/.github/actions/build

      - name: Build backend-python-fastapi
        if: contains(format(',{0},', env.BACKENDS), ',backend-python-fastapi,')
        uses: ./backend/python/backend-python-fastapi/.github/actions/build

      - name: Build backend-python-django
        if: contains(format(',{0},', env.BACKENDS), ',backend-python-django,')
        uses: ./backend/python/backend-python-django/.github/actions/build

      - name: Build frontend-typescript-react
        if: contains(format(',{0},', env.FRONTENDS), ',frontend-typescript-react,')
        uses: ./frontend/typescript/frontend-typescript-react/.github/actions/build

      - name: Build frontend-typescript-vue
        if: contains(format(',{0},', env.FRONTENDS), ',frontend-typescript-vue,')
        uses: ./frontend/typescript/frontend-typescript-vue/.github/actions/build

      - name: Build frontend-javascript-vanilla
        if: contains(format(',{0},', env.FRONTENDS), ',frontend-javascript-vanilla,')
        uses: ./frontend/javascript/frontend-javascript-vanilla/.github/actions/build

      - name: Save image artifacts
        run: |
          set -euo pipefail
          test -s .ci-images.txt || {
            echo "::error::No images selected to build"
            exit 1
          }
          mapfile -t imgs < .ci-images.txt
          docker save "${imgs[@]}" | gzip > /tmp/app-images.tar.gz
          echo "Saved: ${imgs[*]}"

      - name: Upload app images
        uses: actions/upload-artifact@v7
        with:
          name: app-images
          path: /tmp/app-images.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'reference_app_copy' }}
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Deploy"
            exit 1
          }

      - name: Download app images
        uses: actions/download-artifact@v8
        with:
          name: app-images
          path: /tmp

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Transfer app images
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          gunzip -c /tmp/app-images.tar.gz | \
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" docker load

      - name: Deploy on production host (all)
        if: env.DEPLOY_MODE == 'all'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/reference_app_copy/reference-app-copy}"
            cd "$APP_DIR"
            git -c http.proxy= -c https.proxy= fetch --all
            git reset --hard origin/main
            SKIP_BUILD=1 bash deploy/server-deploy.sh

      - name: Deploy on production host (default stacks)
        if: env.DEPLOY_MODE != 'all'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: BACKENDS,FRONTENDS
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/reference_app_copy/reference-app-copy}"
            cd "$APP_DIR"
            git -c http.proxy= -c https.proxy= fetch --all
            git reset --hard origin/main

            services=(postgres postgres-ensure-dbs)
            IFS=',' read -r -a backends <<< "${BACKENDS:-backend-java-spring}"
            for b in "${backends[@]}"; do
              b="$(echo "$b" | xargs)"
              [[ -n "$b" ]] && services+=("$b")
            done
            IFS=',' read -r -a frontends <<< "${FRONTENDS:-frontend-typescript-react}"
            for f in "${frontends[@]}"; do
              f="$(echo "$f" | xargs)"
              [[ -n "$f" ]] && services+=("$f")
            done

            docker compose up -d --force-recreate --no-build "${services[@]}"

            MAX_ATTEMPTS="${HEALTH_POLL_ATTEMPTS:-30}"
            SLEEP_SECS="${HEALTH_POLL_SLEEP:-2}"
            for b in "${backends[@]}"; do
              b="$(echo "$b" | xargs)"
              [[ -z "$b" ]] && continue
              case "$b" in
                backend-java-spring) port=8800; expect=reference-app-copy ;;
                backend-kotlin-spring) port=8810; expect=backend-kotlin-spring ;;
                backend-python-flask) port=8820; expect=backend-python-flask ;;
                backend-python-fastapi) port=8821; expect=backend-python-fastapi ;;
                backend-python-django) port=8822; expect=backend-python-django ;;
                *) echo "skip health for unknown backend: $b"; continue ;;
              esac
              url="http://127.0.0.1:${port}/api/health"
              for i in $(seq 1 "$MAX_ATTEMPTS"); do
                if body="$(curl --noproxy '*' -fsS "$url" 2>/dev/null)" \
                  && echo "$body" | grep -q '"status":"ok"' \
                  && echo "$body" | grep -q "$expect"; then
                  echo "Health OK: $url ($expect, attempt $i)"
                  break
                fi
                if [[ "$i" -eq "$MAX_ATTEMPTS" ]]; then
                  echo "FAIL: health not ok after ${MAX_ATTEMPTS} attempts: $url" >&2
                  exit 1
                fi
                sleep "$SLEEP_SECS"
              done
            done

            for f in "${frontends[@]}"; do
              f="$(echo "$f" | xargs)"
              [[ -z "$f" ]] && continue
              case "$f" in
                frontend-javascript-vanilla) port=9800 ;;
                frontend-typescript-react) port=9811 ;;
                frontend-typescript-vue) port=9813 ;;
                *) echo "skip health for unknown frontend: $f"; continue ;;
              esac
              url="http://127.0.0.1:${port}/"
              for i in $(seq 1 "$MAX_ATTEMPTS"); do
                code="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || true)"
                if [[ "$code" == "200" ]]; then
                  echo "Health OK: $url (HTTP $code, attempt $i)"
                  break
                fi
                if [[ "$i" -eq "$MAX_ATTEMPTS" ]]; then
                  echo "FAIL: frontend not ok after ${MAX_ATTEMPTS} attempts: $url (got $code)" >&2
                  exit 1
                fi
                sleep "$SLEEP_SECS"
              done
            done

            if [[ -f deploy/nginx/sync-nginx.sh ]]; then
              bash deploy/nginx/sync-nginx.sh
            fi
            echo "Deploy OK ($(git rev-parse --short HEAD)) mode=default backends=${BACKENDS} frontends=${FRONTENDS}"
