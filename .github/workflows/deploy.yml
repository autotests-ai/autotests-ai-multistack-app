name: reference-app-copy Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

run-name: reference-app-copy deploy (${{ github.ref_name }} @ ${{ github.sha }})

concurrency:
  group: deploy-reference-app-copy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images (linux/amd64)
        run: |
          docker compose build
          for img in \
            reference-app-copy-backend-java-spring:latest \
            reference-app-copy-backend-python-flask:latest \
            reference-app-copy-web:latest \
            reference-app-copy-edge:latest
          do
            docker inspect "$img" --format '{{.Architecture}}' | grep -q amd64
          done

      - name: Save image artifacts
        run: |
          docker save \
            reference-app-copy-backend-java-spring:latest \
            reference-app-copy-backend-python-flask:latest \
            reference-app-copy-web:latest \
            reference-app-copy-edge:latest \
            | gzip > /tmp/app-images.tar.gz

      - name: Upload app images
        uses: actions/upload-artifact@v7
        with:
          name: app-images
          path: /tmp/app-images.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '212.92.101.15' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'reference_app_copy' }}
    steps:
      - name: Require deploy secrets
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || {
            echo "::error::Missing secret DEPLOY_SSH_KEY — see README § Deploy"
            exit 1
          }

      - name: Download app images
        uses: actions/download-artifact@v8
        with:
          name: app-images
          path: /tmp

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Transfer app images
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          gunzip -c /tmp/app-images.tar.gz | \
            ssh "${DEPLOY_USER}@${DEPLOY_HOST}" docker load

      - name: Deploy on production host
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/home/reference_app_copy/reference-app-copy}"
            cd "$APP_DIR"
            git -c http.proxy= -c https.proxy= fetch --all
            git reset --hard origin/main
            SKIP_BUILD=1 bash deploy/server-deploy.sh
