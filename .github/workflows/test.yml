# Leaf tests — called by ci.yml (scope=ci | prod) or workflow_dispatch / test_all.yml.
# Flip job-level `if: false` when wiring a deferred layer (see tests/LAYERS.md).
#
# scope: ci | prod | all
#   ci   → unit_backend + test-infra + component_rtl
#   prod → prod_api (+ prod_e2e when enabled)
#   all  → ci + prod (manual / test_all)

name: reference-app-copy Tests

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "ci | prod | all"
        required: false
        default: all
      include_python:
        description: "Run python backend unit matrix"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      scope:
        type: string
        required: false
        default: all
      include_python:
        type: boolean
        required: false
        default: false

run-name: reference-app-copy tests (${{ inputs.scope || 'all' }} @ ${{ github.sha }})

concurrency:
  group: test-reference-app-copy-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

jobs:
  unit_backend:
    name: unit_backend
    if: >-
      inputs.scope == 'ci' ||
      inputs.scope == 'all' ||
      inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./backend/java/backend-java-spring/.github/actions/unit

  unit_backend_python:
    name: unit_backend_python (${{ matrix.stack }})
    if: >-
      inputs.include_python &&
      (inputs.scope == 'ci' ||
       inputs.scope == 'all' ||
       inputs.scope == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: flask
            path: backend/python/backend-python-flask
          - stack: fastapi
            path: backend/python/backend-python-fastapi
          - stack: django
            path: backend/python/backend-python-django
    steps:
      - uses: actions/checkout@v7
      - uses: ./${{ matrix.path }}/.github/actions/unit

  test-infra:
    name: test-infra
    if: >-
      inputs.scope == 'ci' ||
      inputs.scope == 'all' ||
      inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/test-infra

  component_rtl:
    name: component_rtl
    if: >-
      inputs.scope == 'ci' ||
      inputs.scope == 'all' ||
      inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./frontend/typescript/frontend-typescript-react/.github/actions/component

  component_vue:
    name: component_vue
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./frontend/typescript/frontend-typescript-vue/.github/actions/component

  compose_up:
    name: compose_up
    if: false
    needs: [unit_backend, test-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start postgres + backend
        run: |
          docker compose up -d --build --wait
          curl -fsS "http://127.0.0.1:8800/api/health" | grep -q '"status":"ok"'

  api:
    name: api
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/api

  integration:
    name: integration
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/integration

  e2e:
    name: e2e
    if: false
    needs: [api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/e2e

  visual:
    name: visual
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/visual

  manual:
    name: manual
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/manual

  prod_api:
    name: prod_api
    if: >-
      inputs.scope == 'prod' ||
      inputs.scope == 'all' ||
      inputs.scope == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/prod-api

  prod_e2e:
    name: prod_e2e
    if: false
    needs: [prod_api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/prod-e2e

  tests_javascript_playwright:
    name: tests_javascript_playwright
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/javascript/tests-javascript-playwright/.github/actions/e2e

  tests_python_selenium:
    name: tests_python_selenium
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/python/tests-python-selenium/.github/actions/e2e
