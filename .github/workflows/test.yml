# reference-app-copy Tests — defaults: java-spring unit, test-infra, prod_api.
# Expand via test_all.yml (include_python) or workflow_dispatch inputs.
# Flip job-level `if: false` when wiring a deferred layer (see tests/LAYERS.md).
#
# Deploy does not run tests. prod_api runs after successful Deploy (workflow_run).

name: reference-app-copy Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ["reference-app-copy Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      layers:
        description: "all-enabled | prod-only"
        required: false
        default: all-enabled
      include_python:
        description: "Run python backend unit matrix"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      layers:
        type: string
        required: false
        default: all-enabled
      include_python:
        type: boolean
        required: false
        default: false

run-name: reference-app-copy tests (${{ github.event_name }} @ ${{ github.sha }})

concurrency:
  group: test-reference-app-copy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

env:
  TESTS_JAVA: tests/java/tests-java-gradle-junit5-allure3-selenide
  FRONTEND_TS_VUE: frontend/typescript/frontend-typescript-vue
  FRONTEND_PREVIEW: frontend/_catalog/frontend-javascript-preview

jobs:
  unit_backend:
    name: unit_backend
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./backend/java/backend-java-spring/.github/actions/unit

  unit_backend_python:
    name: unit_backend_python (${{ matrix.stack }})
    if: >-
      inputs.include_python &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: flask
            path: backend/python/backend-python-flask
          - stack: fastapi
            path: backend/python/backend-python-fastapi
          - stack: django
            path: backend/python/backend-python-django
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Install + pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pytest

  test-infra:
    name: test-infra
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/test-infra

  component_rtl:
    name: component_rtl
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./frontend/typescript/frontend-typescript-react/.github/actions/component

  component_vue:
    name: component_vue
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_TS_VUE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Vitest + Vue Testing Library (src/test)
        run: |
          npm ci
          npm test

  compose_up:
    name: compose_up
    if: false
    needs: [unit_backend, test-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start postgres + backend
        run: |
          docker compose up -d --build --wait
          curl -fsS "http://127.0.0.1:8800/api/health" | grep -q '"status":"ok"'

  api:
    name: api
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: API layer
        run: ./gradlew testApi -Denv=reference_ci -DallureReportMode=none --no-daemon

  integration:
    name: integration
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Integration (mount / layout)
        run: ./gradlew testIntegration -Denv=reference_ci -DallureReportMode=none -Dheadless=true --no-daemon

  component_browser:
    name: component_browser
    if: false
    needs: [unit_backend, test-infra]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Catalog preview :3000
        working-directory: ${{ env.FRONTEND_PREVIEW }}
        run: |
          python -m http.server 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/components.html >/dev/null && exit 0
            sleep 1
          done
          echo "preview failed on :3000" >&2
          exit 1
      - name: Component browser (DS catalog)
        run: ./gradlew testComponent -Denv=reference_ci -DallureReportMode=none -Dheadless=true --no-daemon

  e2e:
    name: e2e
    if: false
    needs: [api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: E2E smoke (local)
        run: ./gradlew testE2e -Denv=reference_ci_e2e -DallureReportMode=none -Dheadless=true --no-daemon

  visual:
    name: visual
    if: false
    needs: [compose_up]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Visual baselines
        run: ./gradlew testVisual -Denv=reference_ci_visual -DallureReportMode=none -Dheadless=true --no-daemon

  manual:
    name: manual
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Manual stubs
        run: ./gradlew testManual -Denv=reference_ci -DallureReportMode=none --no-daemon

  prod_api:
    name: prod_api
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      ((github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call') &&
       (inputs.layers == 'prod-only' ||
        inputs.layers == 'all-enabled' ||
        inputs.layers == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/prod-api

  prod_e2e:
    name: prod_e2e
    if: false
    needs: [prod_api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.TESTS_JAVA }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Prod E2E smoke (Selenoid)
        run: ./gradlew testE2e -Denv=reference_prod_e2e -DallureReportMode=none --no-daemon
