name: CI

# Teaching tests: when TESTS_LANG=java, two knobs (-Denv / -DincludeTags) pick stand and slice.
# Other TESTS_LANG values run the full active-module suite (no Gradle tag filters yet).
# Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — APP_URL / UI_URL / BASE_URL, GHCR package
# names and RUN_LABEL are derived from them. Swap TESTS / TESTS_DIR / TESTS_LANG (or
# BACKEND / FRONTEND) when the teaching default changes; job ids stay layer names.
#
# Allure: test jobs publish raw results; a non-gating reporting matrix handles
# TestOps upload, static reports and Telegram without blocking the delivery DAG.
# Pyramid layers (classical): unit · integration (no UI) · api · e2e · manual
# Sideways FE: component (jsdom). Visual (@Tag visual) inside e2e; baselines → e2e-update-baselines.
# CD on main (two lanes; deploy host serialized via concurrency group).
# needs = real dependencies only (not graph layout). Sonar gates deploy, not build.
# Deploy of either lane moves the shared host checkout dir to the new SHA.
# Roots: unit-tests · component-tests · tests-harness-* · e2e-mock-tests · changes
#   sonar-backend ← unit-tests · sonar-frontend ← component-tests
#   sonar-tests ← tests-harness-backend + tests-harness-frontend
#   build-backend ← unit-tests · build-frontend ← component-tests
#   deploy-backend ← build-backend + sonar-backend
#   deploy-frontend ← build-frontend + sonar-frontend + e2e-mock-tests
#   stand-ready ← deploy-backend + deploy-frontend (curl live UI + /api/health)
#   integration-tests · api-tests ← stand-ready (parallel)
#   e2e-tests ← integration-tests + api-tests → manual-tests · e2e-update-baselines
# push main: changes gates build/deploy by path; tests + sonar always run.
# PR: no deploy; e2e-mock-tests runs on runner (mock compose profile).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "CD lanes to build+deploy (push ignores — uses path diff via changes job)"
        type: choice
        options: [none, backend, frontend, both]
        default: none
      run_integration:
        description: "Run integration tests against reference_prod"
        type: boolean
        default: false
      run_api:
        description: "Run API contract tests against reference_prod"
        type: boolean
        default: false
      run_mock:
        description: "Run mock E2E tests on the runner"
        type: boolean
        default: false
      run_e2e:
        description: "Run regular E2E tests (visual excluded unless run_visual=true)"
        type: boolean
        default: false
      run_visual:
        description: "Include visual tests in e2e-tests"
        type: boolean
        default: false
      run_manual:
        description: "Run tests tagged manual against reference_prod"
        type: boolean
        default: false
      include_tags:
        description: "e2e-tests (java): override -DincludeTags. Empty = run_e2e/run_visual selection."
        type: string
        default: ""
      exclude_tags:
        description: "e2e-tests (java): add -DexcludeTags independently of include_tags"
        type: string
        default: ""
      update_baselines:
        description: "Run e2e-tests, then e2e-update-baselines to refresh visual PNG baselines"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  # java|kotlin|python|go|javascript|typescript — unit-tests setup/run follows this
  BACKEND_LANG: java
  BACKEND_PORT: "8800"
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Teaching tests module — selenide today; flip TESTS/TESTS_DIR/TESTS_LANG together
  TESTS: tests-java-gradle-junit5-allure3-selenide
  TESTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide
  # java|javascript|typescript|python — harness / api / browser layer jobs follow this
  TESTS_LANG: java
  APP_SLUG: reference-app-copy
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.25"
  CHROME_FOR_TESTING_VERSION: "148.0.7778.178"
  ALLURECTL_VERSION: "2.22.0"
  SONAR_SCANNER_NPM_VERSION: "5.0.0"
  SONAR_QUALITY_GATE_TIMEOUT: "600"
  # ── Derived (literals — workflow env cannot nest env.*; keep in sync above) ─
  PUBLIC_HOST: reference-app-copy.autotests.ai
  APP_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  # Playwright → UI_URL; pytest → BASE_URL (same stand URL)
  UI_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  BASE_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  GHCR_BACKEND_PACKAGE: reference-app-copy-backend-java-spring
  GHCR_FRONTEND_PACKAGE: reference-app-copy-frontend-typescript-react
  RUN_LABEL: "${{ github.repository }} #${{ github.run_number }}"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  # ── Non-secret reporting defaults ───────────────────────────────────────
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
      tests: ${{ steps.set.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        id: set
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            emit backend false; emit frontend false; emit tests false
            exit 0
          fi
          # Force-push and first-push leave `before` unusable (nulled, or a commit this clone
          # never fetched); diffing against it aborts the job, so fall back to "everything".
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            emit backend true; emit frontend true; emit tests true
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          match() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
          SHARED='deploy/|docker-compose|\.github/workflows/ci\.yml'
          match "^(backend/|${SHARED})"  && emit backend true  || emit backend false
          match "^(frontend/|${SHARED})" && emit frontend true || emit frontend false
          match "^(tests/|${SHARED})"    && emit tests true    || emit tests false

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: unit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java / kotlin (Gradle + JaCoCo) ───────────────────────────────────
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Owns the Gradle User Home cache: entries are keyed per job, so the Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so Gradle encrypts the project
      # configuration-cache with a stable key (without it each runner invents its own).
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.BACKEND_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'kotlin'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/kotlin/backend-kotlin-spring/*.gradle*', 'backend/kotlin/backend-kotlin-spring/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - name: Run unit tests (Gradle + JaCoCo)
        if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: ${{ env.BACKEND_DIR }}
      - if: (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            ${{ env.BACKEND_DIR }}/build/jacoco/**
            ${{ env.BACKEND_DIR }}/build/reports/jacoco/**
            ${{ env.BACKEND_DIR }}/build/classes/**
          if-no-files-found: error
      # ── python ───────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt
      - name: Install Python dependencies
        if: env.BACKEND_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Run Python tests (pytest)
        if: env.BACKEND_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.BACKEND_DIR }}

      # ── go ───────────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum
      - name: Run Go unit tests
        if: env.BACKEND_LANG == 'go'
        run: go test ./...
        working-directory: ${{ env.BACKEND_DIR }}

      # ── javascript / typescript ──────────────────────────────────────────
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      - name: Install backend npm dependencies
        if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Run backend unit tests (npm)
        if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-unit
          path: ${{ env.BACKEND_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  component-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: component
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install frontend npm dependencies
        run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Lint frontend
        run: npm run lint
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Run component tests (Vitest + coverage)
        id: run-tests
        run: npm test -- --coverage
        working-directory: ${{ env.FRONTEND_DIR }}
      - if: steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage/
          if-no-files-found: error
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-component
          path: ${{ env.FRONTEND_DIR }}/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  tests-harness-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: harness-backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) and are published for the reporting matrix.
      - name: Run harness-backend tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-backend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-backend
          path: |
            ${{ env.TESTS_DIR }}/build/jacoco/**
            ${{ env.TESTS_DIR }}/build/reports/jacoco/**
            ${{ env.TESTS_DIR }}/build/classes/**
          if-no-files-found: error
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-harness-backend
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  tests-harness-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: harness-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) and are published for the reporting matrix.
      - name: Run harness-frontend tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-frontend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-frontend
          path: |
            ${{ env.TESTS_DIR }}/build/jacoco/**
            ${{ env.TESTS_DIR }}/build/reports/jacoco/**
            ${{ env.TESTS_DIR }}/build/classes/**
          if-no-files-found: error
      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - name: Install npm dependencies
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - name: Install Playwright Chromium
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - name: Install Python dependencies
        if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-harness-frontend
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  # Quality axis (SonarQube) — hard gate before deploy (not build). Coverage reused via artifacts.
  # Quality Gate wait is native in each scanner (`sonar.qualitygate.wait=true`).
  sonar-backend:
    needs: [unit-tests]
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY || 'reference-app-copy-backend-java-spring' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: ${{ env.BACKEND_DIR }}/build
      - name: Sonar scan + gate (backend)
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f build/reports/jacoco/test/jacocoTestReport.xml ]]; then
            echo "ERROR: JaCoCo report missing — unit-tests artifact incomplete" >&2
            exit 1
          fi

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          # Token via env only (SONAR_TOKEN) — never argv (canon: docs/sonar/GITHUB-ACTIONS.md).
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - name: Write Sonar summary (backend)
        if: always()
        run: |
          {
            echo "## sonar-backend"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tests-module Sonar after both harness slices; coverage merged from harness job artifacts.
  sonar-tests:
    needs: [tests-harness-backend, tests-harness-frontend]
    if: >-
      !cancelled() &&
      needs.tests-harness-backend.result == 'success' &&
      needs.tests-harness-frontend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_TESTS_PROJECT_KEY || 'reference-app-copy-tests-java-gradle-junit5-allure3-selenide' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-backend
          path: harness-backend
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-frontend
          path: harness-frontend
      - name: Sonar scan + gate (tests)
        working-directory: ${{ env.TESTS_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          JACOCO_XML_PATHS="${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml,${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"
          for xml in "${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml" \
                     "${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"; do
            if [[ ! -f "$xml" ]]; then
              echo "ERROR: JaCoCo report missing: $xml" >&2
              exit 1
            fi
          done

          ./gradlew compileTestJava --no-daemon

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (harness coverage artifacts) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths="${JACOCO_XML_PATHS}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - name: Write Sonar summary (tests)
        if: always()
        run: |
          {
            echo "## sonar-tests"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sonar-frontend:
    needs: [component-tests]
    if: ${{ !cancelled() && needs.component-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY || 'reference-app-copy-frontend-typescript-react' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage
      - name: Sonar scan + gate (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -d coverage ]] || [ -z "$(ls -A coverage 2>/dev/null || true)" ]; then
            echo "ERROR: coverage artifact missing — component-tests incomplete" >&2
            exit 1
          fi
          npm ci

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          npx --yes "@sonar/scan@${SONAR_SCANNER_NPM_VERSION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - name: Write Sonar summary (frontend)
        if: always()
        run: |
          {
            echo "## sonar-frontend"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    needs: [unit-tests, changes]
    if: >-
      !cancelled() &&
      needs.unit-tests.result == 'success' &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'backend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend Docker image
        run: docker compose build ${{ env.BACKEND }}
      - name: Push backend Docker image to GHCR
        run: docker compose push ${{ env.BACKEND }}

  build-frontend:
    needs: [component-tests, changes]
    if: >-
      !cancelled() &&
      needs.component-tests.result == 'success' &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build frontend Docker image
        run: docker compose build ${{ env.FRONTEND }}
      - name: Push frontend Docker image to GHCR
        run: docker compose push ${{ env.FRONTEND }}

  # Registry housekeeping is deliberately non-gating: API/permission failures must not
  # prevent deployment of an image that was already built and pushed successfully.
  ghcr-retention:
    needs: [build-backend, build-frontend]
    if: >-
      !cancelled() &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
          BACKEND_BUILD_RESULT: ${{ needs.build-backend.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.build-frontend.result }}
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          packages=()
          if [ "${BACKEND_BUILD_RESULT}" = "success" ]; then
            packages+=("${GHCR_BACKEND_PACKAGE}")
          fi
          if [ "${FRONTEND_BUILD_RESULT}" = "success" ]; then
            packages+=("${GHCR_FRONTEND_PACKAGE}")
          fi
          for pkg in "${packages[@]}"; do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done

  deploy-backend:
    needs: [build-backend, sonar-backend]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      needs.sonar-backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'reference-production' }}
      url: ${{ env.APP_URL }}
    # Shared deploy host: serialize git checkout with deploy-frontend (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    # Backend (+ postgres) — integration-tests need API :8800, not frontend.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy backend to stand
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull postgres postgres-ensure-dbs ${{ env.BACKEND }}
            docker compose up -d --remove-orphans postgres postgres-ensure-dbs ${{ env.BACKEND }}
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health
            docker logout ghcr.io

  # Stub API on runner (compose --profile mock); gates FE deploy; PR + FE-touch push.
  e2e-mock-tests:
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.run_mock ||
          inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: e2e-mock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (-Denv=reference_mock -DincludeTags=mock) ────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Gradle User Home cache read-only (harness jobs may have warmed entries on main).
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      # reference_mock has no remoteUrl: the stand lives on the runner's localhost, which a
      # Selenoid browser could not reach, so the browser has to be local too.
      - name: Install pinned Chrome for Testing
        if: env.TESTS_LANG == 'java'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: ${{ env.CHROME_FOR_TESTING_VERSION }}
          install-chromedriver: true
      # stand-gateway serves the SPA and proxies /api/ to WireMock stubs (deploy/mock/mappings).
      # Naming the service is load-bearing: a bare `up` also starts every profile-less service,
      # so --build would compile all twelve backends the mock stand never talks to. depends_on
      # pulls in exactly frontend-typescript-react (built) and api-mock (pulled).
      - name: Bring up mock stand
        if: env.TESTS_LANG == 'java'
        run: |
          set -euo pipefail
          docker compose --profile mock up -d --build stand-gateway
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:${MOCK_GATEWAY_PORT}/api/health"
        env:
          MOCK_GATEWAY_PORT: "9911"
      - name: Run e2e mock tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: ./gradlew test -Denv=reference_mock -DincludeTags=mock
        working-directory: ${{ env.TESTS_DIR }}
      - name: Tear down mock stand
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: docker compose --profile mock down -v --remove-orphans
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e-mock
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  # FE deploy after build + sonar + mock gate; shared host lock with deploy-backend.
  deploy-frontend:
    needs: [build-frontend, sonar-frontend, e2e-mock-tests]
    if: >-
      !cancelled() &&
      needs.build-frontend.result == 'success' &&
      needs.sonar-frontend.result == 'success' &&
      needs.e2e-mock-tests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'reference-production' }}
      url: ${{ env.APP_URL }}
    # Independent of backend lane; shared host lock via concurrency (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy frontend to stand
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.FRONTEND }}
            docker compose up -d --remove-orphans ${{ env.FRONTEND }}
            docker logout ghcr.io

  # Curl live UI + API health after deploy lanes (handles partial/skipped deploy).
  stand-ready:
    needs: [changes, deploy-backend, deploy-frontend]
    # A lane that did not deploy is fine — the stand keeps whatever is already live. A push that
    # deployed nothing and touched no test source has nothing to verify, so the prod layers stay
    # off: a README commit must not spend an e2e run against prod.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
         (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
         (needs.deploy-backend.result == 'success' ||
          needs.deploy-frontend.result == 'success' ||
          needs.changes.outputs.tests == 'true')) ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy != 'none' ||
          inputs.run_integration ||
          inputs.run_api ||
          inputs.run_e2e ||
          inputs.run_visual ||
          inputs.run_manual ||
          inputs.update_baselines ||
          inputs.include_tags != '' ||
          inputs.exclude_tags != '') &&
         (!(inputs.deploy == 'backend' || inputs.deploy == 'both') ||
          needs.deploy-backend.result == 'success') &&
         (!(inputs.deploy == 'frontend' || inputs.deploy == 'both') ||
          needs.deploy-frontend.result == 'success'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live stand (UI + API health)
        env:
          API_HEALTH: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/api/health
        run: |
          set -euo pipefail
          echo "==> UI ${UI_URL}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${UI_URL}"
          echo "==> API ${API_HEALTH}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${API_HEALTH}"

  integration-tests:
    needs: stand-ready
    if: >-
      !cancelled() && needs.stand-ready.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: integration
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (no UI — Rest Assured against deployed API) ─────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Gradle User Home cache read-only (harness jobs may have warmed entries on main).
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - name: Run integration tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test -Denv=reference_prod -DincludeTags=integration
        working-directory: ${{ env.TESTS_DIR }}
      # ── javascript / typescript (full suite) ──────────────────────────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - name: Install npm dependencies
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - name: Install Playwright Chromium
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite) ──────────────────────────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - name: Install Python dependencies
        if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-integration
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  api-tests:
    needs: stand-ready
    if: >-
      !cancelled() && needs.stand-ready.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_api)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (no UI — Rest Assured API contract against deployed backend) ─
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Gradle User Home cache read-only (harness jobs may have warmed entries on main).
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - name: Run API tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test -Denv=reference_prod -DincludeTags=api
        working-directory: ${{ env.TESTS_DIR }}
      # ── javascript / typescript (full suite) ──────────────────────────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - name: Install npm dependencies
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - name: Install Playwright Chromium
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite) ──────────────────────────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - name: Install Python dependencies
        if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  # Join integration + api on main; dispatch e2e/visual when upstream layer jobs were skipped.
  e2e-tests:
    needs: [integration-tests, api-tests]
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.integration-tests.result == 'success' &&
         needs.api-tests.result == 'success') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.run_e2e ||
          inputs.run_visual ||
          inputs.update_baselines ||
          inputs.include_tags != '' ||
          inputs.exclude_tags != '') &&
         (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
         (needs.api-tests.result == 'success' || needs.api-tests.result == 'skipped'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: e2e
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java: -DincludeTags / -DexcludeTags (override via dispatch inputs) ─
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - name: Run e2e tests (Gradle with tag filters)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: reference_prod
          INCLUDE_TAGS: ${{ inputs.include_tags }}
          EXCLUDE_TAGS: ${{ inputs.exclude_tags }}
          RUN_E2E: ${{ github.event_name == 'push' || inputs.run_e2e || inputs.update_baselines }}
          RUN_VISUAL: ${{ inputs.run_visual }}
        run: |
          set -euo pipefail
          ARGS=(-Denv="$RUN_ENV")
          DEFAULT_EXCLUDE=""
          if [ -n "${INCLUDE_TAGS}" ]; then
            ARGS+=(-DincludeTags="${INCLUDE_TAGS}")
          else
            TAGS=()
            [ "${RUN_E2E}" = "true" ] && TAGS+=(e2e)
            [ "${RUN_VISUAL}" = "true" ] && TAGS+=(visual)
            [ "${#TAGS[@]}" -gt 0 ] || TAGS=(e2e)
            TAGS_CSV="$(IFS=,; echo "${TAGS[*]}")"
            ARGS+=(-DincludeTags="${TAGS_CSV}")
            [[ ",${TAGS_CSV}," == *",visual,"* ]] || DEFAULT_EXCLUDE=visual
          fi
          if [ -n "${EXCLUDE_TAGS}" ]; then
            ARGS+=(-DexcludeTags="${EXCLUDE_TAGS}")
          elif [ -n "${DEFAULT_EXCLUDE}" ]; then
            ARGS+=(-DexcludeTags="${DEFAULT_EXCLUDE}")
          fi
          ./gradlew test "${ARGS[@]}"
        working-directory: ${{ env.TESTS_DIR }}
      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - name: Install npm dependencies
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - name: Install Playwright Chromium
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - name: Install Python dependencies
        if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  # Optional after e2e; skipped on push and when update_baselines=false.
  e2e-update-baselines:
    needs: [e2e-tests]
    if: >-
      !cancelled() &&
      needs.e2e-tests.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.update_baselines == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: e2e-baselines
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - name: Run e2e visual baseline update (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: reference_prod
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=visual -DupdateBaselines=true
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e-baselines
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1
      - if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-baseline-pngs
          path: ${{ env.TESTS_DIR }}/src/test/resources/screenshots/
          if-no-files-found: ignore

  # Main-chain tip after e2e; manual execution is explicit.
  manual-tests:
    needs: [e2e-tests, stand-ready]
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_manual &&
      needs.stand-ready.result == 'success' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ── java (-DincludeTags=manual) ───────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ github.job }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-${{ github.job }}-
      - name: Run manual tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: reference_prod
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=manual
        working-directory: ${{ env.TESTS_DIR }}
      - name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-manual
          path: ${{ env.TESTS_DIR }}/build/allure-results/**
          if-no-files-found: ignore
          retention-days: 1

  # Non-gating observability fan-out. Test jobs expose only raw results, so builds,
  # deploys and downstream test layers never wait for TestOps/report/Telegram work.
  report-tests:
    name: report-${{ matrix.layer }}
    needs:
      - unit-tests
      - component-tests
      - tests-harness-backend
      - tests-harness-frontend
      - e2e-mock-tests
      - integration-tests
      - api-tests
      - e2e-tests
      - e2e-update-baselines
      - manual-tests
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: unit
            notify: false
          - layer: component
            notify: false
          - layer: harness-backend
            notify: true
          - layer: harness-frontend
            notify: true
          - layer: e2e-mock
            notify: true
          - layer: integration
            notify: true
          - layer: api
            notify: true
          - layer: e2e
            notify: true
          - layer: e2e-baselines
            notify: true
          - layer: manual
            notify: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download raw Allure results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results-${{ matrix.layer }}
          path: allure-results
      - name: Install pinned allurectl
        if: steps.results.outcome == 'success' && env.ALLURE_PROJECT_ID != ''
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allurectl-version: ${{ env.ALLURECTL_VERSION }}
      - name: Upload results to a layer-specific TestOps launch
        if: steps.results.outcome == 'success' && env.ALLURE_PROJECT_ID != '' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_LAUNCH_NAME: "${{ matrix.layer }} — ${{ env.RUN_LABEL }}"
          ALLURE_JOB_UID: "${{ github.repository }}/actions/workflows/ci.yml/${{ matrix.layer }}"
          ALLURE_JOB_RUN_UID: "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.layer }}"
          ALLURE_JOB_NAME: "${{ github.repository }} — ${{ matrix.layer }}"
          ALLURE_JOB_RUN_NAME: "${{ matrix.layer }} #${{ github.run_number }}.${{ github.run_attempt }}"
        run: |
          set -euo pipefail
          if [ -z "${ALLURE_TOKEN:-}" ]; then
            echo "No ALLURE_TOKEN — skip TestOps upload"
            exit 0
          fi
          allurectl upload "allure-results" \
            --endpoint "${ALLURE_ENDPOINT}" \
            --token "${ALLURE_TOKEN}" \
            --project-id "${ALLURE_PROJECT_ID}" \
            --launch-name "${ALLURE_LAUNCH_NAME}"
      - name: Set up pinned Node.js
        if: steps.results.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - name: Install pinned Allure CLIs
        if: steps.results.outcome == 'success'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - name: Generate standard Allure report
        if: steps.results.outcome == 'success'
        id: allure-report
        run: '"${TESTS_DIR}/node_modules/.bin/allure" generate "${GITHUB_WORKSPACE}/allure-results" -o "${GITHUB_WORKSPACE}/allure-report"'
      - name: Publish Allure report
        if: steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.layer }}-tests
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Send Allure Telegram notification
        if: matrix.notify && steps.allure-report.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          NOTIFICATION_PROJECT: "${{ env.APP_SLUG }} ${{ matrix.layer }} #${{ github.run_number }}"
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_REFERENCE_APP_TOPIC_ID || vars.TELEGRAM_REFERENCE_APP_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID || '3' }}
          NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "No Telegram token — skip notification"
            exit 0
          fi
          ALLURE_FOLDER="${GITHUB_WORKSPACE}/allure-report"
          ALLURE_RESULTS="${GITHUB_WORKSPACE}/allure-results"
          if [ ! -f "${ALLURE_FOLDER}/summary.json" ]; then
            echo "No ${ALLURE_FOLDER}/summary.json — skip Telegram"
            exit 0
          fi
          CFG=notifications/config.ci.json
          jq \
            --arg p "${NOTIFICATION_PROJECT}" \
            --arg b "${BUILD_URL}" \
            --arg af "${ALLURE_FOLDER}" \
            --arg ar "${ALLURE_RESULTS}" \
            '.base.project = $p
             | .base.links.build = $b
             | .base.allureFolder = $af
             | .base.allureResultsFolder = $ar' \
            notifications/config.json > "$CFG"
          if [ "${NOTIFICATION_MODE}" = "live" ]; then
            MODE_FLAG="--live"
          else
            MODE_FLAG="--dry-run"
          fi
          npx --no-install allure-notifications send \
            --config "$CFG" \
            "${MODE_FLAG}" \
            --out collage.png
