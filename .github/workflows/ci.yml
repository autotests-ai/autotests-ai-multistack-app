name: CI

# One test task, two knobs: -Denv=<stand> picks where we point, -DincludeTags/-DexcludeTags pick
# which tests run. Every job below is the same command a student types locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Stand for -Denv (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      includeTags:
        description: "-DincludeTags, e.g. visual | manual | smoke | mount (empty = no extra gradle run)"
        type: string
        default: ""
      excludeTags:
        description: "-DexcludeTags, e.g. visual"
        type: string
        default: ""
      runners:
        description: "Extra language runners against prod"
        type: choice
        options: [none, playwright, pytest, both]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Owns the Gradle User Home cache: entries are keyed per job, so the four Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      - uses: gradle/actions/setup-gradle@v6
      # setup-gradle caches Gradle User Home, but the configuration cache lives in the project
      # directory, so it needs its own entry. Keyed by the files the entry depends on plus the
      # sha, because GitHub cache entries are immutable and each run writes a fresh one.
      - uses: actions/cache@v6
        with:
          path: backend/java/backend-java-spring/.gradle/configuration-cache
          key: gradle-cc-backend-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: gradle-cc-backend-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties') }}-
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: backend/java/backend-java-spring
        env:
          GRADLE_ACTIONS_SKIP_BUILD_RESULT_CAPTURE: "true"

  python-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - backend-python-flask
          - backend-python-fastapi
          - backend-python-django
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/python/${{ matrix.module }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: backend/python/${{ matrix.module }}
      # pytest.ini wires --cov-fail-under=100 (same bar as the Java JaCoCo gate above).
      - run: python -m pytest
        working-directory: backend/python/${{ matrix.module }}

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/typescript/frontend-typescript-react/package-lock.json
      - run: npm ci
        working-directory: frontend/typescript/frontend-typescript-react
      - run: npm test
        working-directory: frontend/typescript/frontend-typescript-react

  test-infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      - run: ./gradlew test jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=test-infra -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  build:
    needs: [unit-tests, python-unit-tests, component-tests, test-infra-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build backend-java-spring frontend-typescript-react
      - run: docker compose push backend-java-spring frontend-typescript-react
      # Keep the newest N SHA versions per package; never delete a version that carries `latest`.
      # Needs repo Admin on each package (Manage Actions access). No PAT — GITHUB_TOKEN only.
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          for pkg in \
            reference-app-copy-backend-java-spring \
            reference-app-copy-frontend-typescript-react
          do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Packages land private, so the host pulls them with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend-java-spring frontend-typescript-react
            docker compose up -d --remove-orphans backend-java-spring frontend-typescript-react
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8800/api/health
            docker logout ghcr.io

  api-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Reads the entry written by test-infra-tests on main; no need to write another.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew test -Denv=reference_prod -DincludeTags=api -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  gradle-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.includeTags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Manual slices against prod: read the shared entry, never write one of their own.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - env:
          RUN_ENV: ${{ inputs.env }}
          INCLUDE_TAGS: ${{ inputs.includeTags }}
          EXCLUDE_TAGS: ${{ inputs.excludeTags }}
        run: ./gradlew test "-Denv=$RUN_ENV" "-DincludeTags=$INCLUDE_TAGS" "-DexcludeTags=$EXCLUDE_TAGS" -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  playwright-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'playwright' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/javascript/tests-javascript-playwright/package-lock.json
      - run: npm ci
        working-directory: tests/javascript/tests-javascript-playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/javascript/tests-javascript-playwright
      - run: npm test
        working-directory: tests/javascript/tests-javascript-playwright

  pytest-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'pytest' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/python/tests-python-selenium/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: tests/python/tests-python-selenium
      - run: python -m pytest
        working-directory: tests/python/tests-python-selenium
