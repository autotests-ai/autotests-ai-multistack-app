name: CI

# One test task, two knobs: -Denv=<stand> picks where we point, -DincludeTags/-DexcludeTags pick
# which tests run. Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — paths, compose services, prod URL and GHCR
# package names are derived from them. Swap TESTS_JAVA to …-selenium (or BACKEND / FRONTEND)
# when the teaching default changes; job ids stay language/layer names, not tool names.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Stand for -Denv (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      includeTags:
        description: "-DincludeTags, e.g. visual | manual | smoke | mount (empty = no extra java-tests run)"
        type: string
        default: ""
      excludeTags:
        description: "-DexcludeTags, e.g. visual"
        type: string
        default: ""
      runners:
        description: "Extra language runners against prod (module ids = env.TESTS_*)"
        type: choice
        options: [none, javascript, python, both]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  BACKEND_PORT: "8800"
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Java teaching module — selenide today; flip to …-selenium / allure2 / … when that slot goes active
  TESTS_JAVA: tests-java-gradle-junit5-allure3-selenide
  TESTS_JAVASCRIPT: tests-javascript-playwright
  TESTS_PYTHON: tests-python-selenium
  PUBLIC_HOST: reference-app-copy.autotests.ai
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.13"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Owns the Gradle User Home cache: entries are keyed per job, so the Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so Gradle encrypts the project
      # configuration-cache with a stable key (without it each runner invents its own).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Enhanced caching only persists Gradle User Home; the configuration-cache lives under
      # the project and needs its own entry. Both pieces are required — either alone is a miss.
      - uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles(format('{0}/*.gradle*', env.BACKEND_DIR), format('{0}/gradle/wrapper/gradle-wrapper.properties', env.BACKEND_DIR), format('{0}/gradle.properties', env.BACKEND_DIR)) }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: ${{ env.BACKEND_DIR }}

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run lint
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm test
        working-directory: ${{ env.FRONTEND_DIR }}

  test-infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      - run: ./gradlew test jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=test-infra -DallureReportMode=none
        working-directory: tests/java/${{ env.TESTS_JAVA }}

  build:
    needs: [unit-tests, component-tests, test-infra-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build ${{ env.BACKEND }} ${{ env.FRONTEND }}
      - run: docker compose push ${{ env.BACKEND }} ${{ env.FRONTEND }}
      # Keep the newest N SHA versions per package; never delete a version that carries `latest`.
      # Needs repo Admin on each package (Manage Actions access). No PAT — GITHUB_TOKEN only.
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          for pkg in \
            "reference-app-copy-${{ env.BACKEND }}" \
            "reference-app-copy-${{ env.FRONTEND }}"
          do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Packages land private, so the host pulls them with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.BACKEND }} ${{ env.FRONTEND }}
            docker compose up -d --remove-orphans ${{ env.BACKEND }} ${{ env.FRONTEND }}
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health
            docker logout ghcr.io

  api-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Reads the entry written by test-infra-tests on main; no need to write another.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: ./gradlew test -Denv=reference_prod -DincludeTags=api -DallureReportMode=none
        working-directory: tests/java/${{ env.TESTS_JAVA }}

  java-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.includeTags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Manual slices against prod: read the shared entry, never write one of their own.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - env:
          RUN_ENV: ${{ inputs.env }}
          INCLUDE_TAGS: ${{ inputs.includeTags }}
          EXCLUDE_TAGS: ${{ inputs.excludeTags }}
        run: ./gradlew test "-Denv=$RUN_ENV" "-DincludeTags=$INCLUDE_TAGS" "-DexcludeTags=$EXCLUDE_TAGS" -DallureReportMode=none
        working-directory: tests/java/${{ env.TESTS_JAVA }}

  javascript-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'javascript' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/javascript/${{ env.TESTS_JAVASCRIPT }}/package-lock.json
      - run: npm ci
        working-directory: tests/javascript/${{ env.TESTS_JAVASCRIPT }}
      # Toolchain follows the active TESTS_JAVASCRIPT module (playwright today).
      - run: npx playwright install --with-deps chromium
        working-directory: tests/javascript/${{ env.TESTS_JAVASCRIPT }}
      - run: npm test
        working-directory: tests/javascript/${{ env.TESTS_JAVASCRIPT }}

  python-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'python' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/python/${{ env.TESTS_PYTHON }}/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: tests/python/${{ env.TESTS_PYTHON }}
      - run: python -m pytest
        working-directory: tests/python/${{ env.TESTS_PYTHON }}
