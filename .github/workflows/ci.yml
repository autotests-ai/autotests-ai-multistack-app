name: CI

# Teaching tests: when TESTS_LANG=java, two knobs (-Denv / -DincludeTags) pick stand and slice.
# Other TESTS_LANG values run the full active-module suite (no Gradle tag filters yet).
# Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — APP_URL / UI_URL / BASE_URL, GHCR package
# names and RUN_LABEL are derived from them. Swap TESTS / TESTS_DIR / TESTS_LANG (or
# BACKEND / FRONTEND) when the teaching default changes; job ids stay layer names.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Stand for -Denv when TESTS_LANG=java (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      layers:
        description: "Browser layer jobs (java tag slice; other TESTS_LANG → full suite on e2e-tests only)"
        type: choice
        options: [none, integration, e2e, visual, manual, all]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  # java|kotlin|python|go|javascript|typescript — unit-tests setup/run follows this
  BACKEND_LANG: java
  BACKEND_PORT: "8800"
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Teaching tests module — selenide today; flip TESTS/TESTS_DIR/TESTS_LANG together
  TESTS: tests-java-gradle-junit5-allure3-selenide
  TESTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide
  # java|javascript|typescript|python — test-infra / api / browser layer jobs follow this
  TESTS_LANG: java
  APP_SLUG: reference-app-copy
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.25"
  # ── Derived (edit stack defaults above, not these) ───────────────────────
  PUBLIC_HOST: ${{ env.APP_SLUG }}.autotests.ai
  APP_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/
  # Playwright → UI_URL; pytest → BASE_URL (same stand URL)
  UI_URL: ${{ env.APP_URL }}
  BASE_URL: ${{ env.APP_URL }}
  GHCR_BACKEND_PACKAGE: ${{ env.APP_SLUG }}-${{ env.BACKEND }}
  GHCR_FRONTEND_PACKAGE: ${{ env.APP_SLUG }}-${{ env.FRONTEND }}
  RUN_LABEL: "${{ github.repository }} #${{ github.run_number }}"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  # ── Allure / Telegram (publish-allure reads these; set once) ─────────────
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: "-1004381150566"
  TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_REFERENCE_APP_TOPIC_ID || vars.TELEGRAM_REFERENCE_APP_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID || '3' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # ── java / kotlin (Gradle + JaCoCo) ───────────────────────────────────
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Owns the Gradle User Home cache: entries are keyed per job, so the Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so Gradle encrypts the project
      # configuration-cache with a stable key (without it each runner invents its own).
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Enhanced caching only persists Gradle User Home; the configuration-cache lives under
      # the project and needs its own entry. Both pieces are required — either alone is a miss.
      # hashFiles needs literal globs — keep in sync when swapping BACKEND_DIR / BACKEND_LANG.
      - if: env.BACKEND_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'kotlin'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/kotlin/backend-kotlin-spring/*.gradle*', 'backend/kotlin/backend-kotlin-spring/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: ${{ env.BACKEND_DIR }}
      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin')
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.BACKEND_DIR }}
          artifact-suffix: unit-tests
          results-dir: build/allure-results
          report-dir: build/reports/allure-report
          allure-config: ""
          enable-notifications: "false"
          launch-name: "unit — ${{ env.RUN_LABEL }}"
      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-unit-tests
          path: ${{ env.BACKEND_DIR }}/build/reports/jacoco/
          if-no-files-found: ignore

      # ── python ───────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt
      - if: env.BACKEND_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.BACKEND_DIR }}

      # ── go ───────────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum
      - if: env.BACKEND_LANG == 'go'
        run: go test ./...
        working-directory: ${{ env.BACKEND_DIR }}

      # ── javascript / typescript ──────────────────────────────────────────
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.BACKEND_DIR }}

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run lint
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
      - id: run-tests
        run: npm test
        working-directory: ${{ env.FRONTEND_DIR }}
      - if: always()
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.FRONTEND_DIR }}
          artifact-suffix: component-tests
          results-dir: allure-results
          report-dir: allure-report
          allure-config: ""
          enable-notifications: "false"
          launch-name: "component — ${{ env.RUN_LABEL }}"

  test-infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYER: test-infra
    steps:
      - uses: actions/checkout@v7

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
      # Node for Allure analytics finalizedBy on test (when allureReportMode ≠ none).
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) so publish-allure / allure-action can run on PR.
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=test-infra
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
      - if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-test-infra-tests
          path: ${{ env.TESTS_DIR }}/build/reports/jacoco/
          if-no-files-found: ignore

      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}

  # Quality axis (SonarQube) — parallel to pyramid; does not gate build/deploy.
  # Default stack = java (BACKEND_LANG / TESTS_LANG). Soft-skip when SONAR_TOKEN
  # unset unless vars.SONAR_REQUIRED=true.
  # projectKeys = ${APP_SLUG}-${BACKEND|TESTS} (module folder names, not generic -backend/-tests).
  sonar-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY || format('{0}-{1}', env.APP_SLUG, env.BACKEND) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Sonar scan + gate (backend)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED || 'false' }}
        run: bash backend/scripts/ci-sonar-backend.sh
      - if: always()
        run: |
          {
            echo "## sonar-backend"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sonar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_TESTS_PROJECT_KEY || format('{0}-{1}', env.APP_SLUG, env.TESTS) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sonar scan + gate (tests)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED || 'false' }}
        run: bash backend/scripts/ci-sonar-tests.sh
      - if: always()
        run: |
          {
            echo "## sonar-tests"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [unit-tests, component-tests, test-infra-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build ${{ env.BACKEND }} ${{ env.FRONTEND }}
      - run: docker compose push ${{ env.BACKEND }} ${{ env.FRONTEND }}
      # Keep the newest N SHA versions per package; never delete a version that carries `latest`.
      # Needs repo Admin on each package (Manage Actions access). No PAT — GITHUB_TOKEN only.
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          for pkg in \
            "${{ env.GHCR_BACKEND_PACKAGE }}" \
            "${{ env.GHCR_FRONTEND_PACKAGE }}"
          do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Packages land private, so the host pulls them with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.BACKEND }} ${{ env.FRONTEND }}
            docker compose up -d --remove-orphans ${{ env.BACKEND }} ${{ env.FRONTEND }}
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health
            docker logout ghcr.io

  api-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAYER: api
    steps:
      - uses: actions/checkout@v7

      # ── java ─────────────────────────────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Reads the entry written by test-infra-tests on main; no need to write another.
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test -Denv=reference_prod -DincludeTags=api
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"

      # ── javascript / typescript (full suite) ──────────────────────────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite) ──────────────────────────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}

  # Dispatch: browser layers against prod (or reference_ci if a compose stack exists).
  # Fixed tag slices — same commands a student runs locally (see tests/LAYERS.md).
  integration-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layers == 'integration' || inputs.layers == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER: integration
    steps:
      - uses: actions/checkout@v7

      # ── java (-DincludeTags=mount) ────────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Manual slices against prod: read the shared entry, never write one of their own.
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: ${{ inputs.env }}
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=mount
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"

  e2e-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layers == 'e2e' || inputs.layers == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER: e2e
    steps:
      - uses: actions/checkout@v7

      # ── java (-DincludeTags=smoke -DexcludeTags=visual) ───────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: ${{ inputs.env }}
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=smoke -DexcludeTags=visual
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"

      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}

  visual-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layers == 'visual' || inputs.layers == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER: visual
    steps:
      - uses: actions/checkout@v7

      # ── java (-DincludeTags=visual) ───────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: ${{ inputs.env }}
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=visual
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"

  manual-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.layers == 'manual' || inputs.layers == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER: manual
    steps:
      - uses: actions/checkout@v7

      # ── java (-DincludeTags=manual) ───────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          RUN_ENV: ${{ inputs.env }}
        run: ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=manual
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        uses: ./.github/actions/publish-allure
        with:
          tests-dir: ${{ env.TESTS_DIR }}
          artifact-suffix: ${{ env.LAYER }}-tests
          notification-project: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          launch-name: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
