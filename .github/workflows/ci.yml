name: CI

# Teaching tests: two knobs (-Denv / -DincludeTags) pick stand and slice.
# Layer jobs are checkout + `uses: ./backend|frontend|tests/.github/actions/<verb>`
# with `module_dir` from stack knobs (format). Commands a
# student types locally live inside the module action, not in this file.
#
# One workflow for clone and children. No *_github.yml siblings.
# Catalog SPA sidecars (non-teaching frontends): jobs catalog-* in this file
# (`deploy=catalog|all` or sidecar path change). Skip when deploy/matrix.yaml is absent.
#
# Active stack knobs live in `env:` once: BACKEND_LANG / BACKEND_FRAMEWORK,
# FRONTEND_LANG / FRONTEND_FRAMEWORK, TESTS_LANG / BUILDER / FRAMEWORK / REPORT / UI_LIBRARY.
# Family adapters under backend|frontend|tests/.github/actions/ statically
# `uses:` the language family (GitHub does not interpolate `uses:`).
# BACKEND_LANG: java → java-spring module actions, python → backend/python/.github/actions.
# FRONTEND_LANG: typescript → frontend/typescript/.github/actions,
# javascript → frontend/javascript/.github/actions.
#
# Allure: trigger opens one shared TestOps job-run (soft); test jobs stream live and
# publish raw results. publish-allure-report is gating (lock pins, npm ci, generate).
# Pages: that job pushes gh-pages (soft); live deploy is deploy-github-pages
# (upload-pages-artifact@v5 + deploy-pages@v5). Retry Pages without the graph:
# workflow_dispatch .github/workflows/pages.yml. TestOps / Telegram stay soft too.
# TestOps UI rerun: workflow_dispatch + ALLURE_JOB_RUN_ID → ALLURE_KEEP_TESTPLAN=true.
# Launch env axes: BROWSER / OS / ENDPOINT / VERSION(=sha) / BRANCH.
# SSOT host: allure.qa.guru (legacy allure.autotests.cloud redirects).
# Layers (classical): unit · integration (no UI) · api · e2e · manual
# Sideways FE: component (jsdom) — only the active FRONTEND (same teaching knob as deploy).
# Screenshot (@Tag screenshot): compare in ui-mock-tests (every PR) and e2e-tests-stage (stage CD).
# Prod e2e-tests screenshot is dispatch run_screenshot.
# rewrite: update_mock_screenshots / update_stage_screenshots / update_e2e_screenshots, not a CD job.
# CD: push develop → stage only (WIP). Push main → same SHA to stage, then prod
# (prod jobs `needs` e2e-tests-stage). `trigger` maps push paths / dispatch `deploy`
# onto the same flags. Sonar gates deploy, not build.
# Prod deploy moves the **prod** checkout dir to the new SHA.
# Stage twin: deploy-backend-stage / deploy-frontend-stage — own APP_DIR,
# compose project autotests-ai-multistack-app-stage, ports +10000 (deploy/stage.env).
# Stage CD: push develop | push main | dispatch stage|both|production-from-main.
# Skip until vars.STAGE_APP_DIR is set. Live tests: full api/e2e vs stage
# and vs prod (after stage e2e). Stand is -Denv=; layer is @Tag api/e2e.
# Stage mutex: main preempts develop (cancel), develop yields if main is queued
# or running. Not one shared cancel-in-progress group — that would let develop
# cancel a prod promotion.
# Roots: trigger → backend-unit-tests · frontend-unit-tests · tests-harness
#   integration-tests ← backend-unit-tests (backend module, pre-build; PR + main)
#   sonar-backend ← backend-unit-tests + integration-tests
#   sonar-tests ← tests-harness (skipped on backend-only lane)
#   ui-mock-tests ← frontend-unit-tests + tests-harness (jsdom first; mock compose on the runner)
#   sonar-frontend ← frontend-unit-tests + ui-mock-tests (mock skipped ⇒ sonar still runs)
#   build-backend ← backend-unit-tests + integration-tests · build-frontend ← ui-mock-tests
#   deploy-backend-stage / deploy-frontend-stage ← same gates; cd_stage; skip until vars.STAGE_APP_DIR
#   catalog-matrix / catalog-build / catalog-deploy-* ← sidecar SPA; skip without deploy/matrix.yaml
  #   api-tests-stage / e2e-tests-stage ← deploy-*-stage + tests-harness; full api / e2e vs stage stand
#     (e2e-tests-stage also compares screenshots/stage/)
#   deploy-backend ← build-backend + sonar-backend + e2e-tests-stage (cd_production)
#   deploy-frontend ← build-frontend + sonar-frontend + e2e-tests-stage
#   api-tests ← deploy-backend + tests-harness; -Denv=prod -DincludeTags=api
#   e2e-tests ← api-tests + deploy-frontend + tests-harness; -Denv=prod -DincludeTags=e2e excludeTags=mock,screenshot
#   publish-allure-report ← layer jobs + tests-harness + sonar-backend
#     (gating generate; Allure QG also fails on layer-job `failure`, not skipped;
#      soft Telegram + Pages)
# push main|develop: trigger infers lanes from paths (tests/ ⇒ no app deploy).
# dispatch `deploy=none|backend|frontend|tests|all` + `deploy_target=production|stage|both`.
# PR (main|develop): no deploy; ui-mock-tests after frontend-unit-tests (mock compose profile).

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Lanes: none (tests only, no CD) · backend · frontend · tests (api/e2e vs live stand, no CD) · catalog (sidecar SPA CD) · all. Push infers from paths."
        type: choice
        options: [none, backend, frontend, tests, catalog, all]
        default: none
      deploy_target:
        description: "CD host: production (main: stage then prod) · stage (develop or main) · both (same chain as production from main). Push develop→stage only; push main→stage then prod."
        type: choice
        options: [production, stage, both]
        default: production
      run_integration:
        description: "Run backend integration tests (pre-deploy)"
        type: boolean
        default: false
      run_api:
        description: "Run API tests (prod: -Denv=prod -DincludeTags=api; stage: -Denv=stage -DincludeTags=api)"
        type: boolean
        default: false
      run_mock:
        description: "Run ui-mock tests on the runner (flows + screenshot compare)"
        type: boolean
        default: false
      run_e2e:
        description: "Run E2E tests (prod: -Denv=prod -DincludeTags=e2e; stage: -Denv=stage). Stage screenshot compare is always on."
        type: boolean
        default: false
      run_screenshot:
        description: "e2e-tests (prod): compare screenshot PNGs (Selenoid)"
        type: boolean
        default: false
      run_manual:
        description: "Run tests tagged manual against prod"
        type: boolean
        default: false
      include_tags:
        description: "e2e-tests: override -DincludeTags. Empty = run_e2e/run_screenshot selection."
        type: string
        default: ""
      exclude_tags:
        description: "e2e-tests: add -DexcludeTags independently of include_tags"
        type: string
        default: ""
      update_mock_screenshots:
        description: "ui-mock-tests: rewrite mock screenshot PNGs (skips compare)"
        type: boolean
        default: false
      update_e2e_screenshots:
        description: "e2e-tests: rewrite prod screenshot PNGs (skips compare)"
        type: boolean
        default: false
      update_stage_screenshots:
        description: "e2e-tests-stage: rewrite stage screenshot PNGs (skips compare)"
        type: boolean
        default: false
      ALLURE_JOB_RUN_ID:
        description: "Allure TestOps service parameter. Leave blank."
        type: string
        required: false
        default: ""
      ALLURE_USERNAME:
        description: "Allure TestOps service parameter. Leave blank."
        type: string
        required: false
        default: ""

concurrency:
  # PRs: per-ref, cancel stale. main vs develop cannot share cancel-in-progress
  # (a new develop would abort a prod promotion). Separate groups; jobs
  # preempt-develop-cd / yield-to-main-cd enforce main priority on the stage host.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || github.ref == 'refs/heads/main' && 'ci-cd-main' || github.ref == 'refs/heads/develop' && 'ci-cd-develop' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

permissions:
  actions: read
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  # Path = {zone}/{lang}/{zone}-{lang}-…. Workflow env cannot nest env.*;
  # jobs pass module_dir via format() below. Family adapters dispatch on
  # BACKEND_LANG / FRONTEND_LANG (GitHub does not interpolate uses:).
  BACKEND_LANG: java
  BACKEND_FRAMEWORK: spring
  BACKEND_PORT: "8800"
  FRONTEND_LANG: typescript
  FRONTEND_FRAMEWORK: react
  TESTS_LANG: java
  TESTS_BUILDER: gradle
  TESTS_FRAMEWORK: junit5
  TESTS_REPORT: allure3
  TESTS_UI_LIBRARY: selenide
  APP_SLUG: autotests-ai-multistack-app
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  CHECKOUT_FETCH_DEPTH: "1"
  GRADLE_CACHE_READ_ONLY: "false"
  GO_VERSION: "1.25"
  CHROME_FOR_TESTING_VERSION: "148.0.7778.178"
  ALLURECTL_VERSION: "2.22.0"
  ALLURE_JOB_RUN_ID: ${{ inputs.ALLURE_JOB_RUN_ID || '' }}
  ALLURE_JOB_RUN_UID: ${{ github.run_id }}-${{ github.run_attempt }}
  ALLURE_USERNAME: ${{ inputs.ALLURE_USERNAME || '' }}
  # TestOps UI rerun passes ALLURE_JOB_RUN_ID — keep selective testplan.
  # Ordinary PR/push leave this false so -DincludeTags / layer jobs own selection.
  ALLURE_KEEP_TESTPLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.ALLURE_JOB_RUN_ID != '' }}
  # Launch env axes for TestOps filters (real values — not sandbox toy OS/VERSION).
  BROWSER: Chrome
  OS: Linux
  ENDPOINT: prod
  VERSION: ${{ github.sha }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  SONAR_SCANNER_NPM_VERSION: "5.0.0"
  SONAR_QUALITY_GATE_TIMEOUT: "600"
  # Host + mount; stand URLs are composed in actions from LANG + FRAMEWORK.
  PUBLIC_HOST: autotests.ai
  STACK_MOUNT: stack
  # Stand URLs: actions compose from PUBLIC_HOST + LANG + FRAMEWORK (not listed here).
  RUN_LABEL: "${{ github.repository }} #${{ github.run_number }}"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  # ── Non-secret reporting defaults ───────────────────────────────────────
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}

  # ── Inline CI helpers (no .github/scripts — logic lives in workflow env) ─
  # YAML anchors left on trigger for allurectl + Playwright cache (publish reuses
  # *cache-allurectl / *setup-live-allurectl). Layer commands live in module actions.
  ALLURE_WRITE_ENVIRONMENT: |
    write_allure_environment() {
      if [[ -z "${ALLURE_RESULTS:-}" ]]; then
        echo "write-allure-environment: ALLURE_RESULTS unset — skip"
        return 0
      fi
      mkdir -p "$ALLURE_RESULTS"
      props="${ALLURE_RESULTS}/environment.properties"
      tmp="$(mktemp)"
      for key in BROWSER OS ENDPOINT VERSION BRANCH; do
        val="${!key:-}"
        [[ -n "$val" ]] || continue
        val="${val//$'\n'/ }"
        printf '%s=%s\n' "$key" "$val" >> "$tmp"
      done
      if [[ ! -s "$tmp" ]]; then
        echo "write-allure-environment: no axes set — skip"
        rm -f "$tmp"
        return 0
      fi
      mv "$tmp" "$props"
      echo "Wrote ${props} ($(wc -l <"$props" | tr -d ' ') keys)"
    }
  ALLURECTL_RUN: |
    eval "${ALLURE_WRITE_ENVIRONMENT}"
    run_with_allurectl() {
      if [[ "$#" -eq 0 ]]; then
        echo "usage: run_with_allurectl <command...>" >&2
        return 2
      fi
      run_then_write_env() {
        set +e
        "$@"
        local code=$?
        set -e
        write_allure_environment || echo "warning: failed to write environment.properties (tests exit code unchanged)" >&2
        return "$code"
      }
      fallback() {
        if [[ "${GITHUB_ACTIONS:-false}" == "true" ]]; then
          echo "::warning title=TestOps live upload unavailable::Running tests without allurectl; raw results remain available for fallback."
        else
          echo "TestOps live upload unavailable — running tests without allurectl"
        fi
        run_then_write_env "$@"
        return $?
      }
      if [[ "${ALLURE_LIVE_ENABLED:-false}" != "true" ]] || ! command -v allurectl >/dev/null 2>&1; then
        fallback "$@"
        return $?
      fi
      for name in ALLURE_ENDPOINT ALLURE_TOKEN ALLURE_PROJECT_ID ALLURE_RESULTS ALLURE_LAUNCH_ID ALLURE_JOB_RUN_ID; do
        if [[ -z "${!name:-}" ]]; then
          echo "Missing ${name}"
          fallback "$@"
          return $?
        fi
      done
      echo "Streaming Allure results to launch ${ALLURE_LAUNCH_ID}, job-run ${ALLURE_JOB_RUN_ID}"
      allurectl --http-timeout 1m watch \
        --job-run-child \
        --continue-on-error \
        -- \
        bash -c '
          set -euo pipefail
          eval "${ALLURE_WRITE_ENVIRONMENT}"
          if [[ "${ALLURE_KEEP_TESTPLAN:-false}" != "true" ]]; then
            if [[ -n "${ALLURE_TESTPLAN_PATH:-}" ]]; then
              echo "Ignoring TestOps testplan (${ALLURE_TESTPLAN_PATH}); CI layer filters own the selection"
              rm -f "${ALLURE_TESTPLAN_PATH}"
              unset ALLURE_TESTPLAN_PATH
            fi
            rm -f .allure/testplan.json
          else
            echo "Keeping TestOps testplan (ALLURE_KEEP_TESTPLAN=true)"
          fi
          set +e
          "$@"
          code=$?
          set -e
          write_allure_environment || echo "warning: failed to write environment.properties (tests exit code unchanged)" >&2
          exit "$code"
        ' bash "$@"
    }
  WRITE_SONAR_SUMMARY: |
    {
      echo "## ${GITHUB_JOB}"
      echo ""
      echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
      echo "- host: \`${SONAR_HOST_URL}\`"
      echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
      echo "- commit: \`${GITHUB_SHA:0:7}\`"
    } >> "$GITHUB_STEP_SUMMARY"
  DOCKER_FRONTEND_BUILD_ARGS: |
    REACT_UI=frontend/_shared/frontend-react-ui
    UI_RUNTIME=frontend/_shared/frontend-javascript-app
  DEPLOY_SSH_SCRIPT: |
    set -euo pipefail
    APP_DIR="${DEPLOY_APP_DIR:-/home/autotests_ai_multistack/autotests-ai-multistack-app}"
    cd "$APP_DIR"
    git fetch origin
    git checkout --force "$IMAGE_TAG"
    echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    COMPOSE="docker compose"
    if [ -n "${DEPLOY_COMPOSE_PROJECT:-}" ]; then
      COMPOSE="$COMPOSE --project-name ${DEPLOY_COMPOSE_PROJECT}"
    fi
    if [ -n "${DEPLOY_COMPOSE_ENV_FILE:-}" ]; then
      COMPOSE="$COMPOSE --env-file ${DEPLOY_COMPOSE_ENV_FILE}"
    fi
    $COMPOSE pull ${DEPLOY_COMPOSE_SERVICES}
    $COMPOSE up -d --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
    if [ -n "${DEPLOY_HEALTH_URL:-}" ]; then
      curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${DEPLOY_HEALTH_URL}"
    fi
    docker logout ghcr.io

jobs:
  # Same flags as dispatch `deploy`. Push infers from paths so tests/ does not
  # rebuild the app; PR is none (no CD). Not a layer job.
  # Shared TestOps job-run lives here too (soft: missing creds / outage disable
  # live upload without blocking tests) so the graph is one root:
  # trigger → backend-unit-tests (backend) / frontend-unit-tests (frontend) / tests-harness.
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
      tests: ${{ steps.set.outputs.tests }}
      catalog: ${{ steps.set.outputs.catalog }}
      cd_production: ${{ steps.set.outputs.cd_production }}
      cd_stage: ${{ steps.set.outputs.cd_stage }}
      enabled: ${{ steps.context.outputs.enabled }}
      launch_id: ${{ steps.context.outputs.launch_id }}
      job_run_id: ${{ steps.context.outputs.job_run_id }}
      launch_url: ${{ steps.context.outputs.launch_url }}
    steps:
      - if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve lanes
        id: set
        env:
          BEFORE: ${{ github.event.before }}
          DEPLOY: ${{ github.event.inputs.deploy || '' }}
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || '' }}
        run: |
          set -euo pipefail
          backend=false
          frontend=false
          tests=false
          catalog=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${DEPLOY}" in
              backend) backend=true ;;
              frontend) frontend=true ;;
              tests) tests=true ;;
              catalog) catalog=true ;;
              all) backend=true; frontend=true; tests=true; catalog=true ;;
              none|'') ;;
              *) echo "unknown deploy=${DEPLOY}" >&2; exit 1 ;;
            esac
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && { [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/develop" ]; }; then
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              backend=true
              frontend=true
              tests=true
              catalog=true
            else
              CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
              match() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
              SHARED='deploy/|docker-compose|\.github/'
              if match "^(backend/|${SHARED})"; then backend=true; fi
              if match "^(frontend/|${SHARED})"; then frontend=true; fi
              if match "^(tests/|${SHARED})"; then tests=true; fi
              if match "^(frontend/javascript/|frontend/typescript/frontend-typescript-(angular|vue|vanilla|jquery)/|frontend/_shared/|frontend/scripts/catalog-cd-matrix|deploy/matrix.yaml|docker-compose)"; then
                catalog=true
              fi
            fi
          fi
          cd_production=false
          cd_stage=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${DEPLOY_TARGET}" in
              stage) cd_stage=true ;;
              both|production|'')
                cd_production=true
                cd_stage=true
                ;;
              *) echo "unknown deploy_target=${DEPLOY_TARGET}" >&2; exit 1 ;;
            esac
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              cd_production=false
              if [ "${DEPLOY_TARGET}" = "production" ] || [ -z "${DEPLOY_TARGET}" ]; then
                cd_stage=false
              fi
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            cd_production=true
            cd_stage=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            cd_stage=true
          fi
          printf 'backend=%s\nfrontend=%s\ntests=%s\ncatalog=%s\ncd_production=%s\ncd_stage=%s\n' \
            "$backend" "$frontend" "$tests" "$catalog" "$cd_production" "$cd_stage" >> "$GITHUB_OUTPUT"
          echo "trigger backend=${backend} frontend=${frontend} tests=${tests} catalog=${catalog} cd_production=${cd_production} cd_stage=${cd_stage}"

      - name: Check TestOps configuration
        id: configured
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          if [ -n "${ALLURE_TOKEN:-}" ] && [ -n "${ALLURE_PROJECT_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ALLURE_LIVE_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TestOps credentials unavailable — live upload disabled"
          fi

      # Binary only (not token / launch). setup-allurectl@v1 stores under
      # $RUNNER_TOOL_CACHE/allurectl/<ver>/<goarch>/ + sibling `.complete` and
      # always hits GitHub API, so we pin the release into $RUNNER_TEMP/allurectl-bin.
      - &cache-allurectl
        name: Cache allurectl binary
        if: always() && env.ALLURE_LIVE_ENABLED == 'true'
        id: cache-allurectl
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/allurectl-bin
          key: allurectl-${{ runner.os }}-${{ runner.arch }}-${{ env.ALLURECTL_VERSION }}

      - &setup-live-allurectl
        name: Install pinned allurectl for live upload
        if: always() && env.ALLURE_LIVE_ENABLED == 'true'
        id: setup-allurectl
        continue-on-error: true
        timeout-minutes: 1
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/allurectl-bin"
          BIN="${DEST}/allurectl"
          mkdir -p "$DEST"
          bin_ok() { [[ -x "$BIN" ]] && "$BIN" --version >/dev/null 2>&1; }
          if bin_ok; then
            echo "allurectl ${ALLURECTL_VERSION} restored from cache (${BIN})"
          else
            rm -f "$BIN"
            case "${RUNNER_OS}" in Linux) os=linux ;; macOS) os=darwin ;; *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2; exit 1 ;; esac
            case "${RUNNER_ARCH}" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; *)
              echo "unsupported RUNNER_ARCH=${RUNNER_ARCH}" >&2; exit 1 ;; esac
            url="https://github.com/allure-framework/allurectl/releases/download/${ALLURECTL_VERSION}/allurectl_${os}_${arch}"
            echo "Downloading ${url}"
            curl -fsSL --connect-timeout 10 --max-time 45 -o "$BIN" "$url"
            chmod +x "$BIN"
            bin_ok || { echo "downloaded allurectl is not executable" >&2; exit 1; }
            "$BIN" --version
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          if [[ -n "${ALLURE_TOKEN:-}" ]]; then
            echo "ALLURE_TOKEN=${ALLURE_TOKEN}" >> "$GITHUB_ENV"
          fi
          if [[ -z "${ALLURE_JOB_UID:-}" ]]; then
            echo "ALLURE_JOB_UID=${GITHUB_REPOSITORY}/actions/workflows/ci.yml" >> "$GITHUB_ENV"
          fi

      - &cache-playwright-browsers
        name: Cache Playwright browsers
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # hashFiles: tests/** covers the active module lockfile.
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Create or adopt shared TestOps context
        id: context
        if: always()
        env:
          ALLURE_LAUNCH_NAME: "${{ env.APP_SLUG }} CI — ${{ env.RUN_LABEL }}"
        run: |
          set +e
          set -uo pipefail

          emit_disabled() {
            local cleanup_job_run_id="${1:-}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "launch_id=" >> "$GITHUB_OUTPUT"
            echo "job_run_id=${cleanup_job_run_id}" >> "$GITHUB_OUTPUT"
            echo "launch_url=" >> "$GITHUB_OUTPUT"
          }

          if [ "${{ steps.configured.outputs.enabled }}" != "true" ] ||
             [ "${{ steps.setup-allurectl.outcome }}" != "success" ] ||
             ! command -v allurectl >/dev/null 2>&1; then
            emit_disabled
            exit 0
          fi

          JOB_RUN_ID="${ALLURE_JOB_RUN_ID:-}"
          START_OUT=""
          if [ -z "$JOB_RUN_ID" ]; then
            JOB_RUN_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            START_OUT="$(
              allurectl --http-timeout 10s job-run start \
                --project-id "$ALLURE_PROJECT_ID" \
                --ci-type github \
                --ci-endpoint "$GITHUB_SERVER_URL" \
                --job-name "$GITHUB_WORKFLOW" \
                --job-uid "$ALLURE_JOB_UID" \
                --job-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
                --job-run-name "#$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
                --job-run-uid "$ALLURE_JOB_RUN_UID" \
                --job-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --job-run-branch "$JOB_RUN_BRANCH" \
                --launch-name "$ALLURE_LAUNCH_NAME"
            )"
            START_EXIT=$?
            if [ "$START_EXIT" -ne 0 ]; then
              echo "Unable to create TestOps job-run — live upload disabled"
              emit_disabled
              exit 0
            fi
          fi

          resolve_job_run_env() {
            allurectl --http-timeout 10s job-run env \
              --project-id "$ALLURE_PROJECT_ID" \
              "$@"
          }

          if [ -n "$JOB_RUN_ID" ]; then
            JOB_ENV="$(resolve_job_run_env --job-run-id "$JOB_RUN_ID")"
          else
            JOB_ENV="$(resolve_job_run_env --job-run-uid "$ALLURE_JOB_RUN_UID")"
          fi
          ENV_EXIT=$?
          if [ "$ENV_EXIT" -ne 0 ] && [ -n "$START_OUT" ]; then
            JOB_RUN_ID="$(
              printf '%s' "$START_OUT" \
                | grep -Eo 'Jobrun\[[0-9]+\]' \
                | head -1 \
                | sed -E 's/Jobrun\[([0-9]+)\]/\1/'
            )"
            if [ -n "$JOB_RUN_ID" ]; then
              JOB_ENV="$(resolve_job_run_env --job-run-id "$JOB_RUN_ID")"
              ENV_EXIT=$?
            fi
          fi
          if [ "$ENV_EXIT" -ne 0 ]; then
            echo "Unable to resolve TestOps job-run context — live upload disabled"
            emit_disabled "${JOB_RUN_ID:-}"
            exit 0
          fi

          # `job-run env` is the official shell-assignment handoff contract.
          # Export it locally, then expose only non-secret numeric IDs and URL.
          # shellcheck disable=SC2046
          export $(printf '%s\n' "$JOB_ENV")
          if ! [[ "${ALLURE_JOB_RUN_ID:-}" =~ ^[0-9]+$ ]] ||
             ! [[ "${ALLURE_LAUNCH_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Invalid TestOps context IDs — live upload disabled"
            emit_disabled "$JOB_RUN_ID"
            exit 0
          fi

          LAUNCH_URL="${ALLURE_LAUNCH_URL:-${ALLURE_ENDPOINT%/}/launch/${ALLURE_LAUNCH_ID}}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "launch_id=${ALLURE_LAUNCH_ID}" >> "$GITHUB_OUTPUT"
          echo "job_run_id=${ALLURE_JOB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"

  # Main owns the stage host: cancel develop CI so promotion is not tested
  # against a WIP checkout. Does not `needs` deploy — runs in parallel with build.
  preempt-develop-cd:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Cancel develop CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=""
          for status in in_progress queued pending waiting; do
            ids="$ids $(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch develop --status "$status" --limit 20 --json databaseId --jq '.[].databaseId')"
          done
          for id in $ids; do
            echo "preempt develop run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  # Develop must not start (or continue) if main already claimed the stage.
  yield-to-main-cd:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Abort this run when main CD is queued or running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_busy() {
            for status in in_progress queued pending waiting; do
              count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch main --status "$status" --limit 5 --json databaseId --jq 'length')"
              if [ "$count" != "0" ]; then
                return 0
              fi
            done
            return 1
          }
          if main_busy || { sleep 3; main_busy; }; then
            echo "main CD owns the stage — cancelling this develop run"
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
          fi

  # Keep the backend root first: GitHub has no explicit graph coordinates and uses
  # declaration order as a layout hint for otherwise independent jobs.
  # Layer jobs: checkout + `uses: ./<family>/.github/actions/<verb>` + module_dir.
  # Language setup and ./gradlew / npm live in the module action, not here.
  backend-unit-tests:
    needs: trigger
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: unit
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/unit
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}

  integration-tests:
    needs: [backend-unit-tests, trigger]
    if: >-
      always() && !cancelled() && needs.backend-unit-tests.result == 'success' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LAYER: integration
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/integration
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}

  frontend-unit-tests:
    needs: trigger
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: component
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./frontend/.github/actions/unit
        with:
          module_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}

  tests-harness:
    needs: [trigger]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      slice: ${{ steps.harness.outputs.slice }}
    env:
      LAYER: harness
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - id: harness
        uses: ./tests/.github/actions/harness
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          backend_lane: ${{ needs.trigger.outputs.backend }}
          frontend_lane: ${{ needs.trigger.outputs.frontend }}
          tests_lane: ${{ needs.trigger.outputs.tests }}

  ui-mock-tests:
    needs: [trigger, frontend-unit-tests, tests-harness]
    if: >-
      always() && !cancelled() &&
      needs.frontend-unit-tests.result == 'success' &&
      needs.tests-harness.result == 'success' && (
        github.event_name == 'pull_request' ||
        needs.trigger.outputs.frontend == 'true' ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.run_mock || inputs.update_mock_screenshots))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      LAYER: ui-mock
      SCREENSHOT_OS: linux
      SCREENSHOT_BROWSER: chrome
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/mock
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          frontend_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
          update_screenshots: ${{ inputs.update_mock_screenshots || false }}

  sonar-backend:
    needs: [backend-unit-tests, integration-tests]
    if: >-
      !cancelled() &&
      needs.backend-unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY || 'autotests-ai-multistack-app-backend-java-spring' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/sonar
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}

  # Tests-module Sonar after full harness. Backend-only is ConfigReader coverage
  # only — skip rather than fail the tests-module gate.
  sonar-tests:
    needs: [tests-harness]
    if: >-
      !cancelled() &&
      needs.tests-harness.result == 'success' &&
      needs.tests-harness.outputs.slice != 'backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_TESTS_PROJECT_KEY || 'autotests-ai-multistack-app-tests-java-gradle-junit5-allure3-selenide' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/sonar
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}

  sonar-frontend:
    needs: [frontend-unit-tests, ui-mock-tests]
    if: >-
      !cancelled() &&
      needs.frontend-unit-tests.result == 'success' &&
      (needs.ui-mock-tests.result == 'success' || needs.ui-mock-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY || 'autotests-ai-multistack-app-frontend-typescript-react' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./frontend/.github/actions/sonar
        with:
          module_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}

  build-backend:
    needs: [backend-unit-tests, integration-tests, trigger]
    if: >-
      !cancelled() &&
      needs.backend-unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.trigger.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/build
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}

  build-frontend:
    needs: [ui-mock-tests, trigger]
    if: >-
      !cancelled() &&
      needs.ui-mock-tests.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.trigger.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./frontend/.github/actions/build
        with:
          module_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}

  deploy-backend:
    needs: [build-backend, sonar-backend, trigger, e2e-tests-stage]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      needs.sonar-backend.result == 'success' &&
      needs.trigger.outputs.cd_production == 'true' &&
      needs.e2e-tests-stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'multistack-production' }}
      url: ${{ format('https://{0}/{1}/backend-{2}-{3}/frontend-{4}-{5}/', env.PUBLIC_HOST, env.STACK_MOUNT, env.BACKEND_LANG, env.BACKEND_FRAMEWORK, env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_APP_DIR: /home/autotests_ai_multistack/autotests-ai-multistack-app
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app
      DEPLOY_COMPOSE_ENV_FILE: ""
      DEPLOY_HEALTH_URL: http://127.0.0.1:8800/api/health
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/deploy
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}
          stand: prod

  # FE deploy after teaching build + sonar. One FRONTEND — no sibling matrix.
  deploy-frontend:
    needs: [build-frontend, sonar-frontend, trigger, e2e-tests-stage]
    if: >-
      !cancelled() &&
      needs.build-frontend.result == 'success' &&
      needs.sonar-frontend.result == 'success' &&
      needs.trigger.outputs.cd_production == 'true' &&
      needs.e2e-tests-stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'multistack-production' }}
      url: ${{ format('https://{0}/{1}/backend-{2}-{3}/frontend-{4}-{5}/', env.PUBLIC_HOST, env.STACK_MOUNT, env.BACKEND_LANG, env.BACKEND_FRAMEWORK, env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_APP_DIR: /home/autotests_ai_multistack/autotests-ai-multistack-app
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app
      DEPLOY_COMPOSE_ENV_FILE: ""
      DEPLOY_HEALTH_URL: ""
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./frontend/.github/actions/deploy
        with:
          module_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
          stand: prod

  # Stage twin — push develop (WIP) or push main / dispatch production|both (promotion).
  # Own checkout. Skip until repo var STAGE_APP_DIR is set.
  deploy-backend-stage:
    needs: [build-backend, sonar-backend, trigger, preempt-develop-cd, yield-to-main-cd]
    if: >-
      always() && !cancelled() &&
      needs.build-backend.result == 'success' &&
      needs.sonar-backend.result == 'success' &&
      vars.STAGE_APP_DIR != '' &&
      needs.trigger.outputs.cd_stage == 'true' &&
      (needs.preempt-develop-cd.result == 'success' || needs.preempt-develop-cd.result == 'skipped') &&
      (needs.yield-to-main-cd.result == 'success' || needs.yield-to-main-cd.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: multistack-stage
      url: ${{ format('https://stage.autotests.ai/{0}/backend-{1}-{2}/frontend-{3}-{4}/', env.STACK_MOUNT, env.BACKEND_LANG, env.BACKEND_FRAMEWORK, env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app-stage
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_APP_DIR: ${{ vars.STAGE_APP_DIR }}
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app-stage
      DEPLOY_COMPOSE_ENV_FILE: deploy/stage.env
      DEPLOY_HEALTH_URL: http://127.0.0.1:18800/api/health
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./backend/.github/actions/deploy
        with:
          module_dir: ${{ format('backend/{0}/backend-{0}-{1}', env.BACKEND_LANG, env.BACKEND_FRAMEWORK) }}
          stand: stage

  deploy-frontend-stage:
    needs: [build-frontend, sonar-frontend, trigger, preempt-develop-cd, yield-to-main-cd]
    if: >-
      always() && !cancelled() &&
      needs.build-frontend.result == 'success' &&
      needs.sonar-frontend.result == 'success' &&
      vars.STAGE_APP_DIR != '' &&
      needs.trigger.outputs.cd_stage == 'true' &&
      (needs.preempt-develop-cd.result == 'success' || needs.preempt-develop-cd.result == 'skipped') &&
      (needs.yield-to-main-cd.result == 'success' || needs.yield-to-main-cd.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: multistack-stage
      url: ${{ format('https://stage.autotests.ai/{0}/backend-{1}-{2}/frontend-{3}-{4}/', env.STACK_MOUNT, env.BACKEND_LANG, env.BACKEND_FRAMEWORK, env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app-stage
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_APP_DIR: ${{ vars.STAGE_APP_DIR }}
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app-stage
      DEPLOY_COMPOSE_ENV_FILE: deploy/stage.env
      DEPLOY_HEALTH_URL: ""
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./frontend/.github/actions/deploy
        with:
          module_dir: ${{ format('frontend/{0}/frontend-{0}-{1}', env.FRONTEND_LANG, env.FRONTEND_FRAMEWORK) }}
          stand: stage

  catalog-matrix:
    name: catalog matrix
    needs: [trigger]
    if: >-
      needs.trigger.outputs.catalog == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Catalog SPA matrix
        id: matrix
        run: |
          set -euo pipefail
          if [ ! -f deploy/matrix.yaml ] || [ ! -f frontend/scripts/catalog-cd-matrix.py ]; then
            echo 'include=[{"service":"none","dockerfile":"Dockerfile"}]' >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
            echo "catalog skipped (no deploy/matrix.yaml)"
            exit 0
          fi
          python frontend/scripts/catalog-cd-matrix.py >> "$GITHUB_OUTPUT"

  catalog-build:
    name: catalog ${{ matrix.service }}
    needs: [catalog-matrix, trigger]
    if: needs.catalog-matrix.outputs.services != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.catalog-matrix.outputs.include || '[{"service":"none","dockerfile":"Dockerfile"}]') }}
    env:
      DOCKER_CACHE_SCOPE: autotests-ai-multistack-app-docker-${{ matrix.service }}
      DOCKER_BUILD_CONTEXT: .
      DOCKER_FILE: ${{ matrix.dockerfile }}
      DOCKER_TAGS: ghcr.io/${{ github.repository_owner }}/autotests-ai-multistack-app-${{ matrix.service }}:${{ github.sha }}
      DOCKER_OCI_LABELS: |
        org.opencontainers.image.title=autotests-ai-multistack-app-${{ matrix.service }}
        org.opencontainers.image.description=autotests-ai-multistack-app · ${{ matrix.service }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.url=https://autotests.ai/stack/backend-java-spring/${{ matrix.service }}/
        org.opencontainers.image.vendor=autotests-ai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          file: ${{ env.DOCKER_FILE }}
          tags: ${{ env.DOCKER_TAGS }}
          build-args: ${{ env.DOCKER_FRONTEND_BUILD_ARGS }}
          labels: ${{ env.DOCKER_OCI_LABELS }}
          load: true
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
      - name: Push catalog image to GHCR
        run: |
          set -euo pipefail
          docker compose push ${{ matrix.service }}
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "skip :latest (only main retags latest)"
            exit 0
          fi
          img="ghcr.io/${{ github.repository_owner }}/${APP_SLUG}-${{ matrix.service }}"
          docker tag "${img}:${IMAGE_TAG}" "${img}:latest"
          docker push "${img}:latest"

  catalog-deploy-stage:
    needs: [catalog-matrix, catalog-build, trigger, preempt-develop-cd, yield-to-main-cd]
    if: >-
      always() && !cancelled() &&
      needs.catalog-build.result == 'success' &&
      needs.catalog-matrix.outputs.services != '' &&
      vars.STAGE_APP_DIR != '' &&
      needs.trigger.outputs.cd_stage == 'true' &&
      (needs.preempt-develop-cd.result == 'success' || needs.preempt-develop-cd.result == 'skipped') &&
      (needs.yield-to-main-cd.result == 'success' || needs.yield-to-main-cd.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: multistack-stage
      url: ${{ format('https://stage.{0}/{1}/', env.PUBLIC_HOST, env.STACK_MOUNT) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app-stage
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_STEP_NAME: Deploy catalog frontends to stage
      DEPLOY_APP_DIR: ${{ vars.STAGE_APP_DIR }}
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app-stage
      DEPLOY_COMPOSE_ENV_FILE: deploy/stage.env
      DEPLOY_COMPOSE_SERVICES: ${{ needs.catalog-matrix.outputs.services }}
    steps:
      - name: ${{ env.DEPLOY_STEP_NAME }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN,DEPLOY_COMPOSE_SERVICES,DEPLOY_APP_DIR,DEPLOY_COMPOSE_PROJECT,DEPLOY_COMPOSE_ENV_FILE
          script: ${{ env.DEPLOY_SSH_SCRIPT }}

  catalog-deploy-prod:
    needs: [catalog-matrix, catalog-build, catalog-deploy-stage, trigger]
    if: >-
      always() && !cancelled() &&
      needs.catalog-build.result == 'success' &&
      needs.catalog-matrix.outputs.services != '' &&
      needs.trigger.outputs.cd_production == 'true' &&
      (needs.catalog-deploy-stage.result == 'success' ||
       needs.catalog-deploy-stage.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'multistack-production' }}
      url: ${{ format('https://{0}/{1}/', env.PUBLIC_HOST, env.STACK_MOUNT) }}
    concurrency:
      group: deploy-autotests-ai-multistack-app
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_STEP_NAME: Deploy catalog frontends to production
      DEPLOY_APP_DIR: /home/autotests_ai_multistack/autotests-ai-multistack-app
      DEPLOY_COMPOSE_PROJECT: autotests-ai-multistack-app
      DEPLOY_COMPOSE_ENV_FILE: ""
      DEPLOY_COMPOSE_SERVICES: ${{ needs.catalog-matrix.outputs.services }}
    steps:
      - name: ${{ env.DEPLOY_STEP_NAME }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN,DEPLOY_COMPOSE_SERVICES,DEPLOY_APP_DIR,DEPLOY_COMPOSE_PROJECT,DEPLOY_COMPOSE_ENV_FILE
          script: ${{ env.DEPLOY_SSH_SCRIPT }}

  # Rest Assured against deployed backend — starts as soon as that lane finishes (FE may
  # still be deploying). Dispatch can run api without a backend deploy this run.
  api-tests:
    needs: [deploy-backend, trigger, tests-harness]
    if: >-
      always() && !cancelled() &&
      needs.tests-harness.result == 'success' &&
      needs.trigger.outputs.cd_production == 'true' && (
        (needs.trigger.outputs.backend == 'true' &&
         needs.deploy-backend.result == 'success') ||
        (needs.trigger.outputs.tests == 'true' &&
         (needs.deploy-backend.result == 'success' ||
          needs.deploy-backend.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && inputs.run_api &&
         (needs.deploy-backend.result == 'success' ||
          needs.deploy-backend.result == 'skipped') &&
         (needs.trigger.outputs.backend != 'true' ||
          needs.deploy-backend.result == 'success'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: api
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/api
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          stand: prod

  e2e-tests:
    needs: [api-tests, deploy-frontend, trigger, tests-harness]
    if: >-
      always() && !cancelled() &&
      needs.tests-harness.result == 'success' &&
      needs.trigger.outputs.cd_production == 'true' && (
        (needs.deploy-frontend.result == 'success' ||
         needs.deploy-frontend.result == 'skipped') && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           (needs.api-tests.result == 'success' ||
            (needs.api-tests.result == 'skipped' &&
             needs.deploy-frontend.result == 'success'))) ||
          (needs.trigger.outputs.tests == 'true' &&
           github.event_name == 'workflow_dispatch' &&
           (needs.api-tests.result == 'success' ||
            needs.api-tests.result == 'skipped')) ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.run_e2e ||
            inputs.run_screenshot ||
            inputs.update_e2e_screenshots ||
            inputs.include_tags != '' ||
            inputs.exclude_tags != '') &&
           (needs.api-tests.result == 'success' || needs.api-tests.result == 'skipped') &&
           (needs.trigger.outputs.frontend != 'true' ||
            needs.deploy-frontend.result == 'success'))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: e2e
      SCREENSHOT_OS: linux
      SCREENSHOT_BROWSER: chrome
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SELENOID_REMOTE_URL: ${{ secrets.SELENOID_REMOTE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/e2e
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          stand: prod
          include_tags: ${{ inputs.include_tags || '' }}
          exclude_tags: ${{ inputs.exclude_tags || '' }}
          run_e2e: ${{ inputs.run_e2e || false }}
          run_screenshot: ${{ inputs.run_screenshot || false }}
          update_screenshots: ${{ inputs.update_e2e_screenshots || false }}

  api-tests-stage:
    needs: [deploy-backend-stage, trigger, tests-harness]
    if: >-
      always() && !cancelled() &&
      needs.tests-harness.result == 'success' &&
      needs.trigger.outputs.cd_stage == 'true' && (
        (needs.trigger.outputs.backend == 'true' &&
         needs.deploy-backend-stage.result == 'success') ||
        (needs.trigger.outputs.tests == 'true' &&
         (needs.deploy-backend-stage.result == 'success' ||
          needs.deploy-backend-stage.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && inputs.run_api &&
         (needs.deploy-backend-stage.result == 'success' ||
          needs.deploy-backend-stage.result == 'skipped') &&
         (needs.trigger.outputs.backend != 'true' ||
          needs.deploy-backend-stage.result == 'success'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: api
      ENDPOINT: stage
      PUBLIC_HOST: stage.autotests.ai
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/api
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          stand: stage

  e2e-tests-stage:
    needs: [api-tests-stage, deploy-frontend-stage, trigger, tests-harness]
    if: >-
      always() && !cancelled() &&
      needs.tests-harness.result == 'success' &&
      needs.trigger.outputs.cd_stage == 'true' && (
        (needs.deploy-frontend-stage.result == 'success' ||
         needs.deploy-frontend-stage.result == 'skipped') && (
          (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
           (needs.api-tests-stage.result == 'success' ||
            (needs.api-tests-stage.result == 'skipped' &&
             needs.deploy-frontend-stage.result == 'success'))) ||
          (needs.trigger.outputs.tests == 'true' &&
           github.event_name == 'workflow_dispatch' &&
           (needs.api-tests-stage.result == 'success' ||
            needs.api-tests-stage.result == 'skipped')) ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.run_e2e ||
            inputs.run_screenshot ||
            inputs.update_stage_screenshots ||
            inputs.include_tags != '' ||
            inputs.exclude_tags != '') &&
           (needs.api-tests-stage.result == 'success' || needs.api-tests-stage.result == 'skipped') &&
           (needs.trigger.outputs.frontend != 'true' ||
            needs.deploy-frontend-stage.result == 'success'))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LAYER: e2e
      ENDPOINT: stage
      PUBLIC_HOST: stage.autotests.ai
      SCREENSHOT_OS: linux
      SCREENSHOT_BROWSER: chrome
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SELENOID_REMOTE_URL: ${{ secrets.SELENOID_REMOTE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/e2e
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          stand: stage
          include_tags: ${{ inputs.include_tags || '' }}
          exclude_tags: ${{ inputs.exclude_tags || '' }}
          run_e2e: ${{ inputs.run_e2e || false }}
          run_screenshot: ${{ inputs.run_screenshot || false }}
          update_screenshots: ${{ inputs.update_stage_screenshots || false }}

  manual-tests:
    needs: [e2e-tests, trigger]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' && inputs.run_manual &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: manual
      ALLURE_LIVE_ENABLED: ${{ needs.trigger.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.trigger.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}
      - uses: ./tests/.github/actions/manual
        with:
          module_dir: ${{ format('tests/{0}/tests-{0}-{1}-{2}-{3}-{4}', env.TESTS_LANG, env.TESTS_BUILDER, env.TESTS_FRAMEWORK, env.TESTS_REPORT, env.TESTS_UI_LIBRARY) }}
          stand: prod

  # Gating Allure generate after e2e. Lock pins + npm ci live here (not extra
  # graph boxes). Pages push + Telegram are soft after generate; live Pages
  # deploy is the following job (deploy-pages@v5).
  publish-allure-report:
    name: publish-allure-report
    needs:
      - backend-unit-tests
      - frontend-unit-tests
      - tests-harness
      - ui-mock-tests
      - integration-tests
      - api-tests
      - e2e-tests
      - api-tests-stage
      - e2e-tests-stage
      - manual-tests
      - trigger
      - sonar-backend
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      REPORT_ID: ${{ github.run_id }}
      GH_PAGES_BASE: ${{ vars.GH_PAGES_BASE || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      ALLURE_LIVE_ENABLED: ${{ vars.ALLURE_PROJECT_ID != '' }}
      NPM_CI_IF: "true"
    outputs:
      testops_launch_url: ${{ steps.resolve-testops-url.outputs.launch_url }}
      pages_artifact: ${{ steps.pages-artifact.outcome }}
    steps:
      - name: Resolve tests module dir
        run: |
          set -euo pipefail
          echo "TESTS_DIR=tests/${TESTS_LANG}/tests-${TESTS_LANG}-${TESTS_BUILDER}-${TESTS_FRAMEWORK}-${TESTS_REPORT}-${TESTS_UI_LIBRARY}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json

      - name: package.json pins must match package-lock.json
        working-directory: ${{ env.TESTS_DIR }}
        run: node scripts/check-package-lock.mjs

      - name: Load Allure history
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: history.jsonl
          sparse-checkout-cone-mode: false

      - &cache-allure-nm
        name: Cache Allure npm node_modules
        id: cache-allure-nm
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/node_modules
          key: allure-nm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.TESTS_DIR)) }}

      - name: Skip npm ci on node_modules cache hit
        if: steps.cache-allure-nm.outcome == 'success' && steps.cache-allure-nm.outputs.cache-hit == 'true'
        run: echo "NPM_CI_IF=false" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        if: env.NPM_CI_IF == 'true'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}

      - name: Download merged raw Allure results
        id: results
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          pattern: allure-results-*
          path: ${{ env.TESTS_DIR }}/build/allure-results
          merge-multiple: true

      - name: Verify merged Allure results
        id: merged-results
        if: steps.results.outcome == 'success'
        env:
          ALLURE_RESULTS: ${{ env.TESTS_DIR }}/build/allure-results
        run: |
          if [ -n "$(find "${ALLURE_RESULTS}" -type f 2>/dev/null | head -1)" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No merged Allure results — skip publish"
          fi

      # Canonical environment.properties after merge (one file for Pages / fallback upload).
      - name: Write launch environment axes
        if: steps.merged-results.outputs.has_results == 'true'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.TESTS_DIR }}/build/allure-results
        run: |
          eval "${ALLURE_WRITE_ENVIRONMENT}"
          write_allure_environment

      - name: Restore Allure history
        if: steps.merged-results.outputs.has_results == 'true'
        run: |
          if [ -f gh-pages/history.jsonl ]; then
            cp gh-pages/history.jsonl "${{ env.TESTS_DIR }}/history.jsonl"
          elif [ -f "${{ env.TESTS_DIR }}/history.jsonl" ]; then
            echo "Using checked-in history.jsonl"
          fi

      - *cache-allurectl
      - *setup-live-allurectl

      - name: Write executor.json
        if: steps.merged-results.outputs.has_results == 'true'
        env:
          ALLURE_RESULTS: ${{ env.TESTS_DIR }}/build/allure-results
        run: |
          mkdir -p "${ALLURE_RESULTS}"
          cat > "${ALLURE_RESULTS}/executor.json" <<EOF
          {
            "reportName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "${GH_PAGES_BASE}/reports/${REPORT_ID}/awesome/index.html",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Fallback upload merged results to Allure TestOps
        if: >-
          always() &&
          needs.trigger.outputs.enabled != 'true' &&
          steps.merged-results.outputs.has_results == 'true' &&
          env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: testops-upload
        working-directory: ${{ env.TESTS_DIR }}
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_LAUNCH_NAME: "${{ env.APP_SLUG }} CI — ${{ env.RUN_LABEL }}"
        run: |
          set +e
          set -uo pipefail
          if [ -z "${ALLURE_TOKEN:-}" ]; then
            echo "No ALLURE_TOKEN — skip TestOps upload"
            exit 0
          fi
          if ! command -v allurectl >/dev/null 2>&1; then
            echo "allurectl not available — skip TestOps upload"
            exit 0
          fi
          allurectl upload "build/allure-results" \
            --endpoint "${ALLURE_ENDPOINT}" \
            --token "${ALLURE_TOKEN}" \
            --project-id "${ALLURE_PROJECT_ID}" \
            --launch-name "${ALLURE_LAUNCH_NAME}" 2>&1 | tee allurectl-upload.log
          UPLOAD_EXIT=${PIPESTATUS[0]}
          if [ "$UPLOAD_EXIT" -eq 0 ]; then
            LAUNCH_URL=$(grep -Eo 'https://[^ ]+/launch/[0-9]+' allurectl-upload.log | head -1 || true)
            if [ -z "$LAUNCH_URL" ] && allurectl job-run env >/tmp/allure-env 2>/dev/null; then
              # shellcheck disable=SC1091
              source /tmp/allure-env
              LAUNCH_URL="${ALLURE_LAUNCH_URL:-}"
            fi
            if [ -n "$LAUNCH_URL" ]; then
              echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
              echo "TESTOPS_LAUNCH_URL=${LAUNCH_URL}" >> "$GITHUB_ENV"
            fi
          fi
          exit 0

      - name: Stop shared TestOps job-run
        if: >-
          always() &&
          needs.trigger.outputs.job_run_id != '' &&
          steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        env:
          ALLURE_JOB_RUN_ID: ${{ needs.trigger.outputs.job_run_id }}
        run: |
          set -euo pipefail
          allurectl --http-timeout 30s job-run stop \
            --project-id "$ALLURE_PROJECT_ID" \
            --job-run-id "$ALLURE_JOB_RUN_ID"

      - name: Resolve TestOps launch URL
        id: resolve-testops-url
        if: always()
        env:
          LIVE_LAUNCH_URL: ${{ needs.trigger.outputs.launch_url }}
          FALLBACK_LAUNCH_URL: ${{ steps.testops-upload.outputs.launch_url }}
        run: |
          LAUNCH_URL="${LIVE_LAUNCH_URL:-${FALLBACK_LAUNCH_URL:-}}"
          echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$LAUNCH_URL" ]; then
            echo "TESTOPS_LAUNCH_URL=${LAUNCH_URL}" >> "$GITHUB_ENV"
          fi

      - name: Download Sonar backend report-task
        id: sonar-report-task
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: sonar-backend-report-task
          path: sonar-backend-report-task

      - name: Attach live Sonar quality gate
        if: steps.merged-results.outputs.has_results == 'true'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          REPORT_TASK="$(find "${GITHUB_WORKSPACE}/sonar-backend-report-task" -name 'report-task.txt' -print -quit 2>/dev/null || true)"
          if [[ -z "${REPORT_TASK}" || ! -f "${REPORT_TASK}" ]]; then
            echo "No Sonar report-task — Allure panel keeps fixture"
            exit 0
          fi
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "SONAR_TOKEN unset — Allure panel keeps fixture"
            exit 0
          fi
          node scripts/dump-sonar-quality-gate.mjs \
            --report-task "${REPORT_TASK}" \
            --out allure/sonar-quality-gate.json \
            --timeout "${SONAR_QUALITY_GATE_TIMEOUT}"

      - name: Allure quality gate + report
        if: always() && steps.merged-results.outputs.has_results == 'true'
        id: allure-report
        working-directory: ${{ env.TESTS_DIR }}
        env:
          CI_LAYER_JOBS: ${{ toJSON(needs) }}
        run: |
          set +e
          npx --no-install allure quality-gate build/allure-results --config allurerc.mjs
          echo "QUALITY_GATE_EXIT=$?" >> "$GITHUB_ENV"
          npx --no-install allure generate build/allure-results \
            -o build/reports/allure-report/allureReport \
            --config allurerc.mjs
          REPORT_EXIT=$?
          if [ "${REPORT_EXIT}" -eq 0 ]; then
            node allure/tests-table-from-run.mjs \
              --results build/allure-results \
              --history history.jsonl \
              --report build/reports/allure-report/allureReport
            node allure/attach-ci-jobs-quality-gate.mjs \
              --report build/reports/allure-report/allureReport
          fi
          set -e
          exit "${REPORT_EXIT}"

      - name: Publish merged Allure report artifact
        if: always() && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ci
          path: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/
          if-no-files-found: ignore
          retention-days: 14

      # Soft Pages — same job so generate stays the gate; PR skips these steps.
      - name: Prepare GitHub Pages
        id: pages-prepare
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.allure-report.outcome == 'success'
        continue-on-error: true
        env:
          ALLURE_REPORT_ROOT: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport
          ALLURE_AWESOME: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/awesome
          ALLURE_RESULTS: ${{ env.TESTS_DIR }}/build/allure-results
        run: |
          if [ ! -f "${ALLURE_AWESOME}/index.html" ]; then
            echo "No ${ALLURE_AWESOME}/index.html — skip GitHub Pages"
            exit 0
          fi
          mkdir -p pages/reports/${REPORT_ID}
          cp -r "${ALLURE_REPORT_ROOT}/." "pages/reports/${REPORT_ID}/"
          rm -rf pages/reports/latest
          cp -r "pages/reports/${REPORT_ID}" pages/reports/latest
          if [ -f "${{ env.TESTS_DIR }}/history.jsonl" ]; then
            cp "${{ env.TESTS_DIR }}/history.jsonl" pages/history.jsonl
          elif [ -f "${ALLURE_REPORT_ROOT}/history.jsonl" ]; then
            cp "${ALLURE_REPORT_ROOT}/history.jsonl" pages/history.jsonl
          fi
          echo "${REPORT_ID}" > pages/latest-run-id.txt
          printf 'reports.autotests.ai\n' > pages/CNAME
          touch pages/.nojekyll
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=reports/latest/awesome/index.html"><link rel="canonical" href="reports/latest/awesome/index.html"><title>Allure</title>' > pages/index.html
          mkdir -p pages/readme
          bash .github/scripts/generate-readme-badge.sh \
            "${ALLURE_RESULTS}" pages/readme main "#${{ github.run_number }}" \
            "" "Multistack" "Java 21 · Spring Boot · Allure 3" ""

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.allure-report.outcome == 'success' &&
          steps.pages-prepare.outcome == 'success' &&
          hashFiles('pages/reports/**/awesome/index.html') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Backup Allure report on gh-pages
        id: gh-pages-deploy
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.allure-report.outcome == 'success' &&
          steps.pages-prepare.outcome == 'success' &&
          hashFiles('pages/reports/**/awesome/index.html') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
          enable_jekyll: false
          # Branch backup only (history.jsonl + one run). Live site is
          # deploy-github-pages / pages.yml. keep_files: true bloated the
          # branch (~12GB) when it was also the Pages source.
          keep_files: false
          cname: reports.autotests.ai

      - name: Send Allure Telegram notification
        if: always() && steps.allure-report.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: ${{ env.TESTS_DIR }}
        env:
          NOTIFICATION_PROJECT: "${{ env.APP_SLUG }} CI #${{ github.run_number }}"
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTOPS_LAUNCH_URL: ${{ steps.resolve-testops-url.outputs.launch_url }}
          ALLURE_FOLDER: ${{ github.workspace }}/${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/awesome
          ALLURE_RESULTS_FOLDER: ${{ github.workspace }}/${{ env.TESTS_DIR }}/build/allure-results
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID || '3' }}
          NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
          PAGES_OUTCOME: ${{ steps.gh-pages-deploy.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "No Telegram token — skip notification"
            exit 0
          fi
          if [ ! -f "${ALLURE_FOLDER}/summary.json" ]; then
            echo "No ${ALLURE_FOLDER}/summary.json — skip Telegram"
            exit 0
          fi
          if [ "${PAGES_OUTCOME}" = "success" ]; then
            export ALLURE_REPORT_URL="${GH_PAGES_BASE}/reports/${REPORT_ID}/awesome/index.html"
            export ALLURE_DASHBOARD_URL="${GH_PAGES_BASE}/reports/${REPORT_ID}/dashboard/index.html"
          else
            export ALLURE_REPORT_URL=""
            export ALLURE_DASHBOARD_URL=""
          fi
          node scripts/render-notifications-config.mjs
          if [ "${NOTIFICATION_MODE}" = "live" ]; then
            MODE_FLAG="--live"
          else
            MODE_FLAG="--dry-run"
          fi
          npx --no-install allure-notifications send \
            --config notifications/config.runtime.json \
            "${MODE_FLAG}" \
            --out collage.png

      - name: Job summary
        if: always()
        env:
          ALLURE_AWESOME: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/awesome
          PAGES_OUTCOME: ${{ steps.gh-pages-deploy.outcome }}
        run: |
          {
            echo "## publish-allure-report"
            echo ""
            echo "- [GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [ -f "${ALLURE_AWESOME}/index.html" ]; then
              echo "- Allure report artifact: allure-report-ci"
            fi
            if [ "${PAGES_OUTCOME}" = "success" ]; then
              echo "- [Allure report](${GH_PAGES_BASE}/reports/latest/awesome/index.html)"
              echo "- [Allure dashboard](${GH_PAGES_BASE}/reports/latest/dashboard/index.html)"
            elif [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- GitHub Pages not deployed"
            fi
            if [ -n "${TESTOPS_LAUNCH_URL:-}" ]; then
              echo "- [Allure TestOps launch](${TESTOPS_LAUNCH_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Live GitHub Pages. Soft: a 503 must not fail generate. Retry: pages.yml.
  deploy-github-pages:
    name: deploy-github-pages
    needs: publish-allure-report
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.publish-allure-report.outputs.pages_artifact == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
