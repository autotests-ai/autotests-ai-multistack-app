name: CI

# Teaching tests: when TESTS_LANG=java, two knobs (-Denv / -DincludeTags) pick stand and slice.
# Other TESTS_LANG values run the full active-module suite (no Gradle tag filters yet).
# Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — paths, compose services, prod URL and GHCR
# package names are derived from them. Swap TESTS / TESTS_DIR / TESTS_LANG (or BACKEND /
# FRONTEND) when the teaching default changes; job ids stay language/layer names, not tools.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Stand for -Denv when TESTS_LANG=java (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      includeTags:
        description: "-DincludeTags when TESTS_LANG=java, e.g. visual | manual | smoke | mount (empty = no extra layer-tests run)"
        type: string
        default: ""
      excludeTags:
        description: "-DexcludeTags when TESTS_LANG=java, e.g. visual"
        type: string
        default: ""
      runners:
        description: "Extra language runners against prod (side stacks under tests/<lang>/)"
        type: choice
        options: [none, javascript, python, both]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  # java|kotlin|python|go|javascript|typescript — unit-tests setup/run follows this
  BACKEND_LANG: java
  BACKEND_PORT: "8800"
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Teaching tests module — selenide today; flip TESTS/TESTS_DIR/TESTS_LANG together
  TESTS: tests-java-gradle-junit5-allure3-selenide
  TESTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide
  # java|javascript|typescript|python — test-infra / api / layer-tests follow this
  TESTS_LANG: java
  PUBLIC_HOST: reference-app-copy.autotests.ai
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.25"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # ── java / kotlin (Gradle + JaCoCo) ───────────────────────────────────
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Owns the Gradle User Home cache: entries are keyed per job, so the Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so Gradle encrypts the project
      # configuration-cache with a stable key (without it each runner invents its own).
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Enhanced caching only persists Gradle User Home; the configuration-cache lives under
      # the project and needs its own entry. Both pieces are required — either alone is a miss.
      # hashFiles needs literal globs — keep in sync when swapping BACKEND_DIR / BACKEND_LANG.
      - if: env.BACKEND_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'kotlin'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/kotlin/backend-kotlin-spring/*.gradle*', 'backend/kotlin/backend-kotlin-spring/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: ${{ env.BACKEND_DIR }}

      # ── python ───────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt
      - if: env.BACKEND_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.BACKEND_DIR }}

      # ── go ───────────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum
      - if: env.BACKEND_LANG == 'go'
        run: go test ./...
        working-directory: ${{ env.BACKEND_DIR }}

      # ── javascript / typescript ──────────────────────────────────────────
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.BACKEND_DIR }}

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run lint
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm test
        working-directory: ${{ env.FRONTEND_DIR }}

  test-infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      - if: env.TESTS_LANG == 'java'
        run: ./gradlew test jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=test-infra -DallureReportMode=none
        working-directory: ${{ env.TESTS_DIR }}

      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}
        env:
          UI_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
        env:
          BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

  build:
    needs: [unit-tests, component-tests, test-infra-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build ${{ env.BACKEND }} ${{ env.FRONTEND }}
      - run: docker compose push ${{ env.BACKEND }} ${{ env.FRONTEND }}
      # Keep the newest N SHA versions per package; never delete a version that carries `latest`.
      # Needs repo Admin on each package (Manage Actions access). No PAT — GITHUB_TOKEN only.
      - name: Retain last 10 GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          for pkg in \
            "reference-app-copy-${{ env.BACKEND }}" \
            "reference-app-copy-${{ env.FRONTEND }}"
          do
            echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
            to_delete="$(
              gh api --paginate \
                "/orgs/${org}/packages/container/${pkg}/versions" \
                --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
                | sort -r \
                | tail -n "+$((KEEP + 1))" \
                | cut -f2
            )"
            if [ -z "${to_delete}" ]; then
              echo "Nothing to delete for ${pkg}"
              continue
            fi
            while IFS= read -r id; do
              [ -n "${id}" ] || continue
              echo "DELETE ${pkg} version ${id}"
              gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
            done <<< "${to_delete}"
          done

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Packages land private, so the host pulls them with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.BACKEND }} ${{ env.FRONTEND }}
            docker compose up -d --remove-orphans ${{ env.BACKEND }} ${{ env.FRONTEND }}
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health
            docker logout ghcr.io

  api-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # ── java ─────────────────────────────────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Reads the entry written by test-infra-tests on main; no need to write another.
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        run: ./gradlew test -Denv=reference_prod -DincludeTags=api -DallureReportMode=none
        working-directory: ${{ env.TESTS_DIR }}

      # ── javascript / typescript (full suite) ──────────────────────────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}
        env:
          UI_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

      # ── python (full suite) ──────────────────────────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
        env:
          BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

  # Dispatch path for integration / e2e / visual / manual (and any other tag slice).
  layer-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.includeTags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # ── java (tag slice via -DincludeTags / -DexcludeTags) ────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Manual slices against prod: read the shared entry, never write one of their own.
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - if: env.TESTS_LANG == 'java'
        env:
          RUN_ENV: ${{ inputs.env }}
          INCLUDE_TAGS: ${{ inputs.includeTags }}
          EXCLUDE_TAGS: ${{ inputs.excludeTags }}
        run: ./gradlew test "-Denv=$RUN_ENV" "-DincludeTags=$INCLUDE_TAGS" "-DexcludeTags=$EXCLUDE_TAGS" -DallureReportMode=none
        working-directory: ${{ env.TESTS_DIR }}

      # ── javascript / typescript (full suite; tag inputs ignored) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}
        env:
          UI_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

      # ── python (full suite; tag inputs ignored) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
        env:
          BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

  javascript-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'javascript' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/javascript/tests-javascript-playwright/package-lock.json
      - run: npm ci
        working-directory: tests/javascript/tests-javascript-playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/javascript/tests-javascript-playwright
      # job.env cannot read workflow env; steps.env can.
      - run: npm test
        working-directory: tests/javascript/tests-javascript-playwright
        env:
          UI_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/

  python-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'python' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/python/tests-python-selenium/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: tests/python/tests-python-selenium
      - run: python -m pytest
        working-directory: tests/python/tests-python-selenium
        env:
          BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.BACKEND }}/${{ env.FRONTEND }}/
