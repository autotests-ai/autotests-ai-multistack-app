name: CI

# Teaching tests: when TESTS_LANG=java, two knobs (-Denv / -DincludeTags) pick stand and slice.
# Other TESTS_LANG values run the full active-module suite (no Gradle tag filters yet).
# Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — APP_URL / UI_URL / BASE_URL, GHCR package
# names and RUN_LABEL are derived from them. Swap TESTS / TESTS_DIR / TESTS_LANG (or
# BACKEND / FRONTEND) when the teaching default changes; job ids stay layer names.
#
# Allure: TestOps upload + `allure generate` + Telegram per job (native inline, no scripts).
# Pyramid layers (classical): unit · integration (no UI) · api · e2e · manual
# Sideways FE: component (jsdom). Visual (@Tag visual) inside e2e; baselines → e2e-update-baselines.
# CD on main (two lanes; deploy host serialized via concurrency group).
# needs = real dependencies only (not graph layout). Sonar gates deploy, not build.
# Deploy of either lane moves the shared host checkout dir to the new SHA.
# Roots: unit-tests · component-tests · tests-harness-* · e2e-mock-tests · changes
#   sonar-backend ← unit-tests · sonar-frontend ← component-tests
#   sonar-tests ← tests-harness-backend + tests-harness-frontend
#   build-backend ← unit-tests · build-frontend ← component-tests
#   deploy-backend ← build-backend + sonar-backend
#   deploy-frontend ← build-frontend + sonar-frontend + e2e-mock-tests
#   stand-ready ← deploy-backend + deploy-frontend (curl live UI + /api/health)
#   integration-tests · api-tests ← stand-ready (parallel)
#   e2e-tests ← integration-tests + api-tests → manual-tests · e2e-update-baselines
# push main: changes gates build/deploy by path; tests + sonar always run.
# PR: no deploy; e2e-mock-tests runs on runner (mock compose profile).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "CD lanes to build+deploy (push ignores — uses path diff via changes job)"
        type: choice
        options: [none, backend, frontend, both]
        default: none
      env:
        description: "Stand for -Denv when TESTS_LANG=java (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      layers:
        description: "Comma-separated layer jobs: integration,api,mock,e2e,visual,manual (none/empty = skip; harness always runs as required checks)"
        type: string
        default: none
      include_tags:
        description: "e2e-tests (java): override -DincludeTags (e.g. e2e,visual,mock). Empty = job default from layers."
        type: string
        default: ""
      exclude_tags:
        description: "e2e-tests (java): override -DexcludeTags (e.g. visual). Empty = job default from layers."
        type: string
        default: ""
      update_baselines:
        description: "Run e2e-update-baselines: -DincludeTags=visual -DupdateBaselines=true (refresh PNG baselines)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  # java|kotlin|python|go|javascript|typescript — unit-tests setup/run follows this
  BACKEND_LANG: java
  BACKEND_PORT: "8800"
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Teaching tests module — selenide today; flip TESTS/TESTS_DIR/TESTS_LANG together
  TESTS: tests-java-gradle-junit5-allure3-selenide
  TESTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide
  # java|javascript|typescript|python — harness / api / browser layer jobs follow this
  TESTS_LANG: java
  APP_SLUG: reference-app-copy
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  GO_VERSION: "1.25"
  # ── Derived (literals — workflow env cannot nest env.*; keep in sync above) ─
  PUBLIC_HOST: reference-app-copy.autotests.ai
  APP_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  # Playwright → UI_URL; pytest → BASE_URL (same stand URL)
  UI_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  BASE_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
  GHCR_BACKEND_PACKAGE: reference-app-copy-backend-java-spring
  GHCR_FRONTEND_PACKAGE: reference-app-copy-frontend-typescript-react
  RUN_LABEL: "${{ github.repository }} #${{ github.run_number }}"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  # ── Allure / Telegram (inlined in jobs below; set once) ─────────────────
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
  ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: "-1004381150566"
  TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_REFERENCE_APP_TOPIC_ID || vars.TELEGRAM_REFERENCE_APP_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID || '3' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          if echo "$CHANGED" | grep -qE '^(backend/|deploy/|docker-compose|\.github/workflows/ci\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|deploy/|docker-compose|\.github/workflows/ci\.yml)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAYER: unit
    steps:
      - uses: actions/checkout@v7

      # ── java / kotlin (Gradle + JaCoCo) ───────────────────────────────────
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Owns the Gradle User Home cache: entries are keyed per job, so the Java jobs no
      # longer share one. setup-java's `cache: gradle` must stay off — both cache ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so Gradle encrypts the project
      # configuration-cache with a stable key (without it each runner invents its own).
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.BACKEND_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'kotlin'
        uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/kotlin/backend-kotlin-spring/*.gradle*', 'backend/kotlin/backend-kotlin-spring/gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: ${{ env.BACKEND_DIR }}
      - if: (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: ${{ env.BACKEND_DIR }}/build/
          include: |
            jacoco/**
            reports/jacoco/**
            classes/**
          if-no-files-found: error
      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          allure-token: ${{ env.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && env.ALLURE_PROJECT_ID != '' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          ALLURE_ENDPOINT: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
          ALLURE_PROJECT_ID: ${{ env.ALLURE_PROJECT_ID }}
          ALLURE_LAUNCH_NAME: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
        run: |
          set -euo pipefail
          RESULTS="build/allure-results"
          if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null || true)" ]; then
            echo "No allure-results at ${RESULTS} — skip TestOps upload"
            exit 0
          fi
          ARGS=(
            upload "$RESULTS"
            --endpoint "${ALLURE_ENDPOINT}"
            --token "${ALLURE_TOKEN}"
            --project-id "${ALLURE_PROJECT_ID}"
          )
          if [ -n "${ALLURE_LAUNCH_NAME:-}" ]; then
            ARGS+=(--launch-name "${ALLURE_LAUNCH_NAME}")
          fi
          allurectl "${ARGS[@]}"


      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin')
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin')
        continue-on-error: true
        id: allure-report
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          ARGS=(generate "build/allure-results" -o "build/reports/allure-report")
          npx --yes allure@3.13.0 "${ARGS[@]}"

      - if: always() && (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-unit-tests
          path: ${{ env.BACKEND_DIR }}/build/reports/allure-report/
          if-no-files-found: ignore


      # ── python ───────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements.txt
      - if: env.BACKEND_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.BACKEND_DIR }}

      # ── go ───────────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum
      - if: env.BACKEND_LANG == 'go'
        run: go test ./...
        working-directory: ${{ env.BACKEND_DIR }}

      # ── javascript / typescript ──────────────────────────────────────────
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.BACKEND_DIR }}
      - if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.BACKEND_DIR }}

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYER: component
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run lint
        working-directory: ${{ env.FRONTEND_DIR }}
      - run: npm run typecheck
        working-directory: ${{ env.FRONTEND_DIR }}
      - id: run-tests
        run: npm test -- --coverage
        working-directory: ${{ env.FRONTEND_DIR }}
      - if: steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage/
          if-no-files-found: error
      - if: always() && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          allure-token: ${{ env.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      - if: always() && env.ALLURE_PROJECT_ID != '' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          ALLURE_ENDPOINT: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
          ALLURE_PROJECT_ID: ${{ env.ALLURE_PROJECT_ID }}
          ALLURE_LAUNCH_NAME: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
        run: |
          set -euo pipefail
          RESULTS="allure-results"
          if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null || true)" ]; then
            echo "No allure-results at ${RESULTS} — skip TestOps upload"
            exit 0
          fi
          ARGS=(
            upload "$RESULTS"
            --endpoint "${ALLURE_ENDPOINT}"
            --token "${ALLURE_TOKEN}"
            --project-id "${ALLURE_PROJECT_ID}"
          )
          if [ -n "${ALLURE_LAUNCH_NAME:-}" ]; then
            ARGS+=(--launch-name "${ALLURE_LAUNCH_NAME}")
          fi
          allurectl "${ARGS[@]}"


      - if: always()
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - if: always()
        continue-on-error: true
        id: allure-report
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          set -euo pipefail
          ARGS=(generate "allure-results" -o "allure-report")
          npx --yes allure@3.13.0 "${ARGS[@]}"

      - if: always() && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-component-tests
          path: ${{ env.FRONTEND_DIR }}/allure-report/
          if-no-files-found: ignore


  tests-harness-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYER: harness-backend
    steps:
      - uses: actions/checkout@v7

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-
      # Node for Allure analytics finalizedBy on test (when allureReportMode ≠ none).
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) for TestOps / report / Telegram steps below.
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-backend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-backend
          path: ${{ env.TESTS_DIR }}/build/
          include: |
            jacoco/**
            reports/jacoco/**
            classes/**
          if-no-files-found: error
      - if: always() && env.TESTS_LANG == 'java' && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          allure-token: ${{ env.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      - if: always() && env.TESTS_LANG == 'java' && env.ALLURE_PROJECT_ID != '' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          ALLURE_ENDPOINT: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
          ALLURE_PROJECT_ID: ${{ env.ALLURE_PROJECT_ID }}
          ALLURE_LAUNCH_NAME: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
        run: |
          set -euo pipefail
          RESULTS="build/allure-results"
          if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null || true)" ]; then
            echo "No allure-results at ${RESULTS} — skip TestOps upload"
            exit 0
          fi
          ARGS=(
            upload "$RESULTS"
            --endpoint "${ALLURE_ENDPOINT}"
            --token "${ALLURE_TOKEN}"
            --project-id "${ALLURE_PROJECT_ID}"
          )
          if [ -n "${ALLURE_LAUNCH_NAME:-}" ]; then
            ARGS+=(--launch-name "${ALLURE_LAUNCH_NAME}")
          fi
          allurectl "${ARGS[@]}"


      - if: always() && env.TESTS_LANG == 'java'
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        id: allure-report
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          set -euo pipefail
          ARGS=(generate "build/allure-results" -o "build/reports/allure-report/allureReport")
          CONFIG="allurerc.mjs"
          if [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
            ARGS+=(--config "$CONFIG")
          fi
          npx --yes allure@3.13.0 "${ARGS[@]}"

      - if: always() && env.TESTS_LANG == 'java' && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ env.LAYER }}-tests
          path: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/
          if-no-files-found: ignore

      - if: always() && env.TESTS_LANG == 'java' && steps.allure-report.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          NOTIFICATION_PROJECT: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ env.TELEGRAM_TOPIC_ID || '3' }}
          NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
        run: |
          set -euo pipefail
          if [ ! -f notifications/config.json ]; then
            echo "No notifications/config.json — skip Telegram"
            exit 0
          fi
          ALLURE_FOLDER="${PWD}/build/reports/allure-report/allureReport/awesome"
          ALLURE_RESULTS="${PWD}/build/allure-results"
          if [ ! -f "${ALLURE_FOLDER}/summary.json" ]; then
            echo "No ${ALLURE_FOLDER}/summary.json — skip Telegram"
            exit 0
          fi
          CFG=notifications/config.ci.json
          jq \
            --arg p "${NOTIFICATION_PROJECT:-}" \
            --arg b "${BUILD_URL:-}" \
            --arg af "${ALLURE_FOLDER}" \
            --arg ar "${ALLURE_RESULTS}" \
            'if ($p | length) > 0 then .base.project = $p else . end
             | if ($b | length) > 0 then .base.links.build = $b else . end
             | .base.allureFolder = $af
             | .base.allureResultsFolder = $ar' \
            notifications/config.json > "$CFG"
          MODE_FLAG="--dry-run"
          if [ "${NOTIFICATION_MODE}" = "live" ]; then
            MODE_FLAG="--live"
          fi
          npx --yes allure-notifications@6.0.12 send \
            --config "$CFG" \
            ${MODE_FLAG} \
            --out collage.png



  tests-harness-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LAYER: harness-frontend
    steps:
      - uses: actions/checkout@v7

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - if: env.TESTS_LANG == 'java'
        uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-
      # Node for Allure analytics finalizedBy on test (when allureReportMode ≠ none).
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) for TestOps / report / Telegram steps below.
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-frontend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-frontend
          path: ${{ env.TESTS_DIR }}/build/
          include: |
            jacoco/**
            reports/jacoco/**
            classes/**
          if-no-files-found: error
      - if: always() && env.TESTS_LANG == 'java' && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          allure-token: ${{ env.ALLURE_TOKEN }}
          allure-project-id: ${{ env.ALLURE_PROJECT_ID }}

      - if: always() && env.TESTS_LANG == 'java' && env.ALLURE_PROJECT_ID != '' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          ALLURE_ENDPOINT: ${{ env.ALLURE_ENDPOINT || 'https://allure.autotests.cloud' }}
          ALLURE_TOKEN: ${{ env.ALLURE_TOKEN }}
          ALLURE_PROJECT_ID: ${{ env.ALLURE_PROJECT_ID }}
          ALLURE_LAUNCH_NAME: "${{ env.LAYER }} — ${{ env.RUN_LABEL }}"
        run: |
          set -euo pipefail
          RESULTS="build/allure-results"
          if [ ! -d "$RESULTS" ] || [ -z "$(ls -A "$RESULTS" 2>/dev/null || true)" ]; then
            echo "No allure-results at ${RESULTS} — skip TestOps upload"
            exit 0
          fi
          ARGS=(
            upload "$RESULTS"
            --endpoint "${ALLURE_ENDPOINT}"
            --token "${ALLURE_TOKEN}"
            --project-id "${ALLURE_PROJECT_ID}"
          )
          if [ -n "${ALLURE_LAUNCH_NAME:-}" ]; then
            ARGS+=(--launch-name "${ALLURE_LAUNCH_NAME}")
          fi
          allurectl "${ARGS[@]}"


      - if: always() && env.TESTS_LANG == 'java'
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        id: allure-report
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          set -euo pipefail
          ARGS=(generate "build/allure-results" -o "build/reports/allure-report/allureReport")
          CONFIG="allurerc.mjs"
          if [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
            ARGS+=(--config "$CONFIG")
          fi
          npx --yes allure@3.13.0 "${ARGS[@]}"

      - if: always() && env.TESTS_LANG == 'java' && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ env.LAYER }}-tests
          path: ${{ env.TESTS_DIR }}/build/reports/allure-report/allureReport/
          if-no-files-found: ignore

      - if: always() && env.TESTS_LANG == 'java' && steps.allure-report.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          NOTIFICATION_PROJECT: "${{ env.APP_SLUG }} ${{ env.LAYER }} #${{ github.run_number }}"
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ env.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ env.TELEGRAM_TOPIC_ID || '3' }}
          NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
        run: |
          set -euo pipefail
          if [ ! -f notifications/config.json ]; then
            echo "No notifications/config.json — skip Telegram"
            exit 0
          fi
          ALLURE_FOLDER="${PWD}/build/reports/allure-report/allureReport/awesome"
          ALLURE_RESULTS="${PWD}/build/allure-results"
          if [ ! -f "${ALLURE_FOLDER}/summary.json" ]; then
            echo "No ${ALLURE_FOLDER}/summary.json — skip Telegram"
            exit 0
          fi
          CFG=notifications/config.ci.json
          jq \
            --arg p "${NOTIFICATION_PROJECT:-}" \
            --arg b "${BUILD_URL:-}" \
            --arg af "${ALLURE_FOLDER}" \
            --arg ar "${ALLURE_RESULTS}" \
            'if ($p | length) > 0 then .base.project = $p else . end
             | if ($b | length) > 0 then .base.links.build = $b else . end
             | .base.allureFolder = $af
             | .base.allureResultsFolder = $ar' \
            notifications/config.json > "$CFG"
          MODE_FLAG="--dry-run"
          if [ "${NOTIFICATION_MODE}" = "live" ]; then
            MODE_FLAG="--live"
          fi
          npx --yes allure-notifications@6.0.12 send \
            --config "$CFG" \
            ${MODE_FLAG} \
            --out collage.png


      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TESTS_DIR }}/package-lock.json
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        run: npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - if: env.TESTS_LANG == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.TESTS_DIR }}/requirements.txt
      - if: env.TESTS_LANG == 'python'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'python'
        run: python -m pytest
        working-directory: ${{ env.TESTS_DIR }}

  # Quality axis (SonarQube) — hard gate before deploy (not build). Coverage reused via artifacts.
  # Gate poll: scripts/sonar-gate-wait.py only (no external .sh wrappers).
  sonar-backend:
    needs: [unit-tests]
    if: ${{ !cancelled() && needs.unit-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY || 'reference-app-copy-backend-java-spring' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.BACKEND_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.BACKEND }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.BACKEND }}-
      - uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: ${{ env.BACKEND_DIR }}/build
      - name: Sonar scan + gate (backend)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          if [[ ! -f build/reports/jacoco/test/jacocoTestReport.xml ]]; then
            echo "ERROR: JaCoCo report missing — unit-tests artifact incomplete" >&2
            exit 1
          fi

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi
          if ! curl -sf --max-time 15 "${SONAR_HOST_URL%/}/api/system/status" >/dev/null; then
            echo "ERROR: Sonar host unreachable: ${SONAR_HOST_URL}" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          # Token via env only (SONAR_TOKEN) — never argv (canon: docs/sonar/GITHUB-ACTIONS.md).
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}"

          echo "==> quality gate poll"
          REPORT_TASK="build/sonar/report-task.txt"
          if [[ ! -f "$REPORT_TASK" ]]; then
            echo "ERROR: report-task not found: $REPORT_TASK" >&2
            exit 1
          fi
          python "${GITHUB_WORKSPACE}/scripts/sonar-gate-wait.py" \
            --report-task "$REPORT_TASK" \
            --project-key "$SONAR_PROJECT_KEY" \
            --url "$SONAR_HOST_URL"
      - if: always()
        run: |
          {
            echo "## sonar-backend"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tests-module Sonar after both harness slices; coverage merged from harness job artifacts.
  sonar-tests:
    needs: [tests-harness-backend, tests-harness-frontend]
    if: >-
      !cancelled() &&
      needs.tests-harness-backend.result == 'success' &&
      needs.tests-harness-frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_TESTS_PROJECT_KEY || 'reference-app-copy-tests-java-gradle-junit5-allure3-selenide' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/cache@v6
        with:
          path: ${{ env.TESTS_DIR }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.TESTS }}-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.TESTS }}-
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-backend
          path: harness-backend
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-frontend
          path: harness-frontend
      - name: Sonar scan + gate (tests)
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          set -euo pipefail
          JACOCO_XML_PATHS="${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml,${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"
          for xml in "${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml" \
                     "${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"; do
            if [[ ! -f "$xml" ]]; then
              echo "ERROR: JaCoCo report missing: $xml" >&2
              exit 1
            fi
          done

          ./gradlew compileTestJava --no-daemon

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi
          if ! curl -sf --max-time 15 "${SONAR_HOST_URL%/}/api/system/status" >/dev/null; then
            echo "ERROR: Sonar host unreachable: ${SONAR_HOST_URL}" >&2
            exit 1
          fi

          echo "==> sonar scan (harness coverage artifacts) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths="${JACOCO_XML_PATHS}"

          echo "==> quality gate poll"
          REPORT_TASK="build/sonar/report-task.txt"
          if [[ ! -f "$REPORT_TASK" ]]; then
            echo "ERROR: report-task not found: $REPORT_TASK" >&2
            exit 1
          fi
          python "${GITHUB_WORKSPACE}/scripts/sonar-gate-wait.py" \
            --report-task "$REPORT_TASK" \
            --project-key "$SONAR_PROJECT_KEY" \
            --url "$SONAR_HOST_URL"
      - if: always()
        run: |
          {
            echo "## sonar-tests"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sonar-frontend:
    needs: [component-tests]
    if: ${{ !cancelled() && needs.component-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY || 'reference-app-copy-frontend-typescript-react' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage
      - name: Sonar scan + gate (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          set -euo pipefail
          if [[ ! -d coverage ]] || [ -z "$(ls -A coverage 2>/dev/null || true)" ]; then
            echo "ERROR: coverage artifact missing — component-tests incomplete" >&2
            exit 1
          fi
          npm ci

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi
          if ! curl -sf --max-time 15 "${SONAR_HOST_URL%/}/api/system/status" >/dev/null; then
            echo "ERROR: Sonar host unreachable: ${SONAR_HOST_URL}" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          npx --yes @sonar/scan \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}"

          echo "==> quality gate poll"
          REPORT_TASK=".scannerwork/report-task.txt"
          if [[ ! -f "$REPORT_TASK" ]]; then
            echo "ERROR: report-task not found: $REPORT_TASK" >&2
            exit 1
          fi
          python "${GITHUB_WORKSPACE}/scripts/sonar-gate-wait.py" \
            --report-task "$REPORT_TASK" \
            --project-key "$SONAR_PROJECT_KEY" \
            --url "$SONAR_HOST_URL"
      - if: always()
        run: |
          {
            echo "## sonar-frontend"
            echo ""
            echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    needs: [unit-tests, changes]
    if: >-
      !cancelled() &&
      needs.unit-tests.result == 'success' &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'backend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build ${{ env.BACKEND }}
      - run: docker compose push ${{ env.BACKEND }}
      # Keep the newest N GHCR versions; never delete a version that carries `latest`.
      # Needs repo Admin on the package (Manage Actions access). No PAT — GITHUB_TOKEN only.
      - name: Retain last 10 GHCR versions (backend)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
          GHCR_PACKAGE: ${{ env.GHCR_BACKEND_PACKAGE }}
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          pkg="${GHCR_PACKAGE}"
          echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
          to_delete="$(
            gh api --paginate \
              "/orgs/${org}/packages/container/${pkg}/versions" \
              --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
              | sort -r \
              | tail -n "+$((KEEP + 1))" \
              | cut -f2
          )"
          if [ -z "${to_delete}" ]; then
            echo "Nothing to delete for ${pkg}"
            exit 0
          fi
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            echo "DELETE ${pkg} version ${id}"
            gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
          done <<< "${to_delete}"

  build-frontend:
    needs: [component-tests, changes]
    if: >-
      !cancelled() &&
      needs.component-tests.result == 'success' &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build ${{ env.FRONTEND }}
      - run: docker compose push ${{ env.FRONTEND }}
      - name: Retain last 10 GHCR versions (frontend)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "10"
          GHCR_PACKAGE: ${{ env.GHCR_FRONTEND_PACKAGE }}
        run: |
          set -euo pipefail
          org="${{ github.repository_owner }}"
          pkg="${GHCR_PACKAGE}"
          echo "Cleaning ghcr.io/${org}/${pkg} (keep ${KEEP}; protect latest)"
          to_delete="$(
            gh api --paginate \
              "/orgs/${org}/packages/container/${pkg}/versions" \
              --jq '.[] | select((.metadata.container.tags // [] | index("latest")) | not) | "\(.created_at)\t\(.id)"' \
              | sort -r \
              | tail -n "+$((KEEP + 1))" \
              | cut -f2
          )"
          if [ -z "${to_delete}" ]; then
            echo "Nothing to delete for ${pkg}"
            exit 0
          fi
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            echo "DELETE ${pkg} version ${id}"
            gh api --method DELETE "/orgs/${org}/packages/container/${pkg}/versions/${id}"
          done <<< "${to_delete}"

  deploy-backend:
    needs: [build-backend, sonar-backend]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      needs.sonar-backend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared deploy host: serialize git checkout with deploy-frontend (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    # Backend (+ postgres) — integration-tests need API :8800, not frontend.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull postgres postgres-ensure-dbs ${{ env.BACKEND }}
            docker compose up -d --remove-orphans postgres postgres-ensure-dbs ${{ env.BACKEND }}
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health
            docker logout ghcr.io

  # Stub API on runner (compose --profile mock); gates FE deploy; PR + FE-touch push.
  e2e-mock-tests:
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (contains(format(',{0},', inputs.layers), ',mock,') ||
          inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAYER: e2e-mock
    steps:
      - uses: actions/checkout@v7

      # ── java (-Denv=reference_mock -DincludeTags=mock) ────────────────────
      - if: env.TESTS_LANG == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Gradle User Home cache read-only (harness jobs may have warmed entries on main).
      - if: env.TESTS_LANG == 'java'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      # stand-gateway serves the SPA and proxies /api/ to WireMock stubs (deploy/mock/mappings).
      - if: env.TESTS_LANG == 'java'
        name: Bring up mock stand
        run: |
          set -euo pipefail
          docker compose --profile mock up -d --build
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:${MOCK_GATEWAY_PORT}/api/health"
        env:
          MOCK_GATEWAY_PORT: "9911"
      - if: env.TESTS_LANG == 'java'
        id: run-tests
        run: ./gradlew test -Denv=reference_mock -DincludeTags=mock
        working-directory: ${{ env.TESTS_DIR }}
      - if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        name: Tear down mock stand
        run: docker compose --profile mock down -v --remove-orphans
      - if: always() && env.TESTS_LANG == 'java' && env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
