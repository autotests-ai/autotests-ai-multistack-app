      needs.build-frontend.result == 'success' &&
      needs.sonar-frontend.result == 'success' &&
      needs.e2e-mock-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of backend lane; shared host lock via concurrency (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull ${{ env.FRONTEND }}
            docker compose up -d --remove-orphans ${{ env.FRONTEND }}
            docker logout ghcr.io

