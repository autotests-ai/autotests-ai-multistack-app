name: CI

# One test task, two knobs: -Denv=<stand> picks where we point, -DincludeTags/-DexcludeTags pick
# which tests run. Every job below is the same command a student types locally.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: "Stand for -Denv (reference_ci needs a compose stack, which a runner has none of)"
        type: choice
        options: [reference_prod, reference_ci]
        default: reference_prod
      includeTags:
        description: "-DincludeTags, e.g. visual | manual | smoke | mount (empty = no extra gradle run)"
        type: string
        default: ""
      excludeTags:
        description: "-DexcludeTags, e.g. visual"
        type: string
        default: ""
      runners:
        description: "Extra language runners against prod"
        type: choice
        options: [none, playwright, pytest, both]
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
        working-directory: backend/java/backend-java-spring

  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/typescript/frontend-typescript-react/package-lock.json
      - run: npm ci
        working-directory: frontend/typescript/frontend-typescript-react
      - run: npm test
        working-directory: frontend/typescript/frontend-typescript-react

  test-infra-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      - run: ./gradlew test jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=test-infra -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  build:
    needs: [unit-tests, component-tests, test-infra-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose build backend-java-spring frontend-typescript-react
      - run: docker compose push backend-java-spring frontend-typescript-react

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Packages land private, so the host pulls them with this job's GITHUB_TOKEN.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /home/reference_app_copy/reference-app-copy
            git fetch origin
            git checkout --force "$IMAGE_TAG"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull backend-java-spring frontend-typescript-react
            docker compose up -d --remove-orphans backend-java-spring frontend-typescript-react
            curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8800/api/health

  api-tests:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test -Denv=reference_prod -DincludeTags=api -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  gradle-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.includeTags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - env:
          RUN_ENV: ${{ inputs.env }}
          INCLUDE_TAGS: ${{ inputs.includeTags }}
          EXCLUDE_TAGS: ${{ inputs.excludeTags }}
        run: ./gradlew test "-Denv=$RUN_ENV" "-DincludeTags=$INCLUDE_TAGS" "-DexcludeTags=$EXCLUDE_TAGS" -DallureReportMode=none
        working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide

  playwright-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'playwright' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UI_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tests/javascript/tests-javascript-playwright/package-lock.json
      - run: npm ci
        working-directory: tests/javascript/tests-javascript-playwright
      - run: npx playwright install --with-deps chromium
        working-directory: tests/javascript/tests-javascript-playwright
      - run: npm test
        working-directory: tests/javascript/tests-javascript-playwright

  pytest-tests:
    if: github.event_name == 'workflow_dispatch' && (inputs.runners == 'pytest' || inputs.runners == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/python/tests-python-selenium/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: tests/python/tests-python-selenium
      - run: python -m pytest
        working-directory: tests/python/tests-python-selenium
