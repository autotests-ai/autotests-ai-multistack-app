# Orchestrator — single entry for PR / push main.
# Leafs: test.yml, deploy.yml (allure-report / notifications — phase C).
#
# PR:          test(ci)
# push main:   test(ci) → deploy → test(prod)
# dispatch:    same as push when on main (optional skip_deploy)

name: reference-app-copy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Run CI tests only (no deploy / prod_api)"
        type: boolean
        required: false
        default: false

run-name: reference-app-copy ci (${{ github.event_name }} @ ${{ github.sha }})

concurrency:
  group: ci-reference-app-copy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_ci:
    name: test (ci)
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      scope: ci

  deploy:
    name: deploy
    needs: test_ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.skip_deploy == false))
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  test_prod:
    name: test (prod)
    needs: deploy
    if: ${{ success() }}
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      scope: prod

