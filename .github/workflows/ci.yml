name: CI

# Teaching tests: when TESTS_LANG=java, two knobs (-Denv / -DincludeTags) pick stand and slice.
# Other TESTS_LANG values run the full active-module suite (no Gradle tag filters yet).
# Every job below is the same command a student types locally.
#
# Active stack defaults live in `env:` once — APP_URL / UI_URL / BASE_URL, GHCR package
# names and RUN_LABEL are derived from them. Swap TESTS / TESTS_DIR / TESTS_LANG (or
# BACKEND / FRONTEND) when the teaching default changes; job ids stay layer names.
#
# Allure: testops-context opens one shared TestOps job-run; test jobs stream live and
# publish raw results. publish-allure-report merges once for Pages/report (allure-report-kit
# soft-fork + overview/QG lead), stops the job-run and hands one launch URL to
# send-allure-notifications (kit collage profile; all non-gating).
# TestOps UI rerun: workflow_dispatch + ALLURE_JOB_RUN_ID → ALLURE_KEEP_TESTPLAN=true.
# Launch env axes: BROWSER / OS / ENDPOINT / VERSION(=sha) / BRANCH.
# SSOT host: allure.qa.guru (legacy allure.autotests.cloud redirects).
# Pyramid layers (classical): unit · integration (no UI) · api · e2e · manual
# Sideways FE: component (jsdom) — only the active FRONTEND (same teaching knob as deploy).
# Screenshot (@Tag screenshot): compare in ui-mock-tests (every PR) and e2e-tests (dispatch);
# rewrite is a step in those jobs (update_mock_screenshots / update_e2e_screenshots), not a CD job.
# CD on main (two lanes; deploy host serialized via concurrency group).
# needs = real dependencies only (not graph layout). Sonar gates deploy, not build.
# Deploy of either lane moves the shared host checkout dir to the new SHA.
# Roots: unit-tests · component-tests · tests-harness-* · changes
#   integration-tests ← unit-tests (backend Spring+PG, pre-build; PR + main)
#   sonar-backend ← unit-tests + integration-tests
#   sonar-tests ← tests-harness-backend + tests-harness-frontend
#   ui-mock-tests ← component-tests (jsdom first; mock compose on the runner)
#   sonar-frontend ← component-tests + ui-mock-tests (mock skipped ⇒ sonar still runs)
#   build-backend ← unit-tests + integration-tests · build-frontend ← ui-mock-tests
#   deploy-backend ← build-backend + sonar-backend
#   deploy-frontend ← build-frontend + sonar-frontend
#   api-tests ← deploy-backend (curl /api/health; no join with frontend)
#   e2e-tests ← api-tests + deploy-frontend (curl live UI) → manual-tests
# push main: changes gates build/deploy by path; tests + sonar always run.
# PR: no deploy; ui-mock-tests after component-tests (mock compose profile).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "CD lanes to build+deploy (push ignores — uses path diff via changes job)"
        type: choice
        options: [none, backend, frontend, both]
        default: none
      run_integration:
        description: "Run backend Spring+PG integration tests (pre-deploy)"
        type: boolean
        default: false
      run_api:
        description: "Run API contract tests against reference_prod"
        type: boolean
        default: false
      run_mock:
        description: "Run ui-mock tests on the runner (flows + screenshot compare)"
        type: boolean
        default: false
      run_e2e:
        description: "Run regular E2E tests (screenshot excluded unless run_screenshot=true)"
        type: boolean
        default: false
      run_screenshot:
        description: "e2e-tests: compare screenshot PNGs (Selenoid)"
        type: boolean
        default: false
      run_manual:
        description: "Run tests tagged manual against reference_prod"
        type: boolean
        default: false
      include_tags:
        description: "e2e-tests (java): override -DincludeTags. Empty = run_e2e/run_screenshot selection."
        type: string
        default: ""
      exclude_tags:
        description: "e2e-tests (java): add -DexcludeTags independently of include_tags"
        type: string
        default: ""
      update_mock_screenshots:
        description: "ui-mock-tests: rewrite mock screenshot PNGs (skips compare)"
        type: boolean
        default: false
      update_e2e_screenshots:
        description: "e2e-tests: rewrite e2e screenshot PNGs (skips compare)"
        type: boolean
        default: false
      ALLURE_JOB_RUN_ID:
        description: "Allure TestOps service parameter. Leave blank."
        type: string
        required: false
        default: ""
      ALLURE_USERNAME:
        description: "Allure TestOps service parameter. Leave blank."
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}
  # ── Active stack defaults (change here only) ─────────────────────────────
  BACKEND: backend-java-spring
  BACKEND_DIR: backend/java/backend-java-spring
  # java|kotlin|python|go|javascript|typescript — unit-tests setup/run follows this
  BACKEND_LANG: java
  BACKEND_PORT: "8800"
  # Deploy + component-tests + sonar-frontend target this one module. Other frontends stay
  # active on the stand (matrix.yaml / compose) but are not CI-gated until FRONTEND flips.
  FRONTEND: frontend-typescript-react
  FRONTEND_DIR: frontend/typescript/frontend-typescript-react
  # Teaching tests module — selenide today; flip TESTS/TESTS_DIR/TESTS_LANG together
  TESTS: tests-java-gradle-junit5-allure3-selenide
  TESTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide
  # java|javascript|typescript|python — harness / api / browser layer jobs follow this
  TESTS_LANG: java
  APP_SLUG: reference-app-copy
  # ── Allure paths (literals — keep in sync with TESTS_DIR above) ───────────
  ALLURE_RESULTS_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results
  ALLURE_REPORT_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide/build/reports/allure-report/allureReport
  ALLURE_AWESOME_DIR: tests/java/tests-java-gradle-junit5-allure3-selenide/build/reports/allure-report/allureReport/awesome
  JAVA_VERSION: "21"
  NODE_VERSION: "26"
  PYTHON_VERSION: "3.12"
  CHECKOUT_FETCH_DEPTH: "1"
  GRADLE_CACHE_READ_ONLY: "false"
  GO_VERSION: "1.25"
  CHROME_FOR_TESTING_VERSION: "148.0.7778.178"
  ALLURECTL_VERSION: "2.22.0"
  ALLURE_JOB_RUN_ID: ${{ inputs.ALLURE_JOB_RUN_ID || '' }}
  ALLURE_JOB_RUN_UID: ${{ github.run_id }}-${{ github.run_attempt }}
  ALLURE_USERNAME: ${{ inputs.ALLURE_USERNAME || '' }}
  # TestOps UI rerun passes ALLURE_JOB_RUN_ID — keep selective testplan.
  # Ordinary PR/push leave this false so -DincludeTags / layer jobs own selection.
  ALLURE_KEEP_TESTPLAN: ${{ github.event_name == 'workflow_dispatch' && inputs.ALLURE_JOB_RUN_ID != '' }}
  # Launch env axes for TestOps filters (real values — not sandbox toy OS/VERSION).
  BROWSER: Chrome
  OS: Linux
  ENDPOINT: reference_prod
  VERSION: ${{ github.sha }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  SONAR_SCANNER_NPM_VERSION: "5.0.0"
  SONAR_QUALITY_GATE_TIMEOUT: "600"
  # ── Derived (literals — workflow env cannot nest env.*; keep in sync above) ─
  PUBLIC_HOST: autotests.ai
  STACK_MOUNT: stack
  APP_URL: https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/
  # Playwright → UI_URL; pytest → BASE_URL (same stand URL)
  UI_URL: https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/
  BASE_URL: https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/
  GHCR_BACKEND_PACKAGE: reference-app-copy-backend-java-spring
  GHCR_FRONTEND_PACKAGE: reference-app-copy-frontend-typescript-react
  RUN_LABEL: "${{ github.repository }} #${{ github.run_number }}"
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
  # ── Non-secret reporting defaults ───────────────────────────────────────
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}

  # ── Inline CI helpers (no .github/scripts — logic lives in workflow env) ─
  # Step templates: YAML anchors at first use (&checkout, &setup-java, &setup-gradle,
  # &cache-gradle-cc, &cache-allurectl, &cache-playwright-browsers,
  # &cache-chrome-for-testing, &setup-python, &pip-install, &setup-node, &npm-ci,
  # &install-playwright, &upload-allure-results, &write-sonar-summary,
  # &docker-login-ghcr, &setup-docker-buildx, &docker-build-push, &ssh-deploy).
  # Job env supplies if-knobs / paths / artifact names as LITERALS — GitHub rejects
  # ${{ env.* }} inside jobs.<id>.env (Unrecognized named-value: 'env'). Keep in sync
  # with BACKEND_* / FRONTEND_* / TESTS_* above. Step if/with may still use env.*.
  # Gradle/test commands stay inline.
  ALLURE_WRITE_ENVIRONMENT: |
    write_allure_environment() {
      if [[ -z "${ALLURE_RESULTS:-}" ]]; then
        echo "write-allure-environment: ALLURE_RESULTS unset — skip"
        return 0
      fi
      mkdir -p "$ALLURE_RESULTS"
      props="${ALLURE_RESULTS}/environment.properties"
      tmp="$(mktemp)"
      for key in BROWSER OS ENDPOINT VERSION BRANCH; do
        val="${!key:-}"
        [[ -n "$val" ]] || continue
        val="${val//$'\n'/ }"
        printf '%s=%s\n' "$key" "$val" >> "$tmp"
      done
      if [[ ! -s "$tmp" ]]; then
        echo "write-allure-environment: no axes set — skip"
        rm -f "$tmp"
        return 0
      fi
      mv "$tmp" "$props"
      echo "Wrote ${props} ($(wc -l <"$props" | tr -d ' ') keys)"
    }
  ALLURECTL_RUN: |
    eval "${ALLURE_WRITE_ENVIRONMENT}"
    run_with_allurectl() {
      if [[ "$#" -eq 0 ]]; then
        echo "usage: run_with_allurectl <command...>" >&2
        return 2
      fi
      run_then_write_env() {
        set +e
        "$@"
        local code=$?
        set -e
        write_allure_environment || echo "warning: failed to write environment.properties (tests exit code unchanged)" >&2
        return "$code"
      }
      fallback() {
        if [[ "${GITHUB_ACTIONS:-false}" == "true" ]]; then
          echo "::warning title=TestOps live upload unavailable::Running tests without allurectl; raw results remain available for fallback."
        else
          echo "TestOps live upload unavailable — running tests without allurectl"
        fi
        run_then_write_env "$@"
        return $?
      }
      if [[ "${ALLURE_LIVE_ENABLED:-false}" != "true" ]] || ! command -v allurectl >/dev/null 2>&1; then
        fallback "$@"
        return $?
      fi
      for name in ALLURE_ENDPOINT ALLURE_TOKEN ALLURE_PROJECT_ID ALLURE_RESULTS ALLURE_LAUNCH_ID ALLURE_JOB_RUN_ID; do
        if [[ -z "${!name:-}" ]]; then
          echo "Missing ${name}"
          fallback "$@"
          return $?
        fi
      done
      echo "Streaming Allure results to launch ${ALLURE_LAUNCH_ID}, job-run ${ALLURE_JOB_RUN_ID}"
      allurectl --http-timeout 1m watch \
        --job-run-child \
        --continue-on-error \
        -- \
        bash -c '
          set -euo pipefail
          eval "${ALLURE_WRITE_ENVIRONMENT}"
          if [[ "${ALLURE_KEEP_TESTPLAN:-false}" != "true" ]]; then
            if [[ -n "${ALLURE_TESTPLAN_PATH:-}" ]]; then
              echo "Ignoring TestOps testplan (${ALLURE_TESTPLAN_PATH}); CI layer filters own the selection"
              rm -f "${ALLURE_TESTPLAN_PATH}"
              unset ALLURE_TESTPLAN_PATH
            fi
            rm -f .allure/testplan.json
          else
            echo "Keeping TestOps testplan (ALLURE_KEEP_TESTPLAN=true)"
          fi
          set +e
          "$@"
          code=$?
          set -e
          write_allure_environment || echo "warning: failed to write environment.properties (tests exit code unchanged)" >&2
          exit "$code"
        ' bash "$@"
    }
  WRITE_SONAR_SUMMARY: |
    {
      echo "## ${GITHUB_JOB}"
      echo ""
      echo "- projectKey: \`${SONAR_PROJECT_KEY}\`"
      echo "- host: \`${SONAR_HOST_URL}\`"
      echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=${SONAR_PROJECT_KEY}"
      echo "- commit: \`${GITHUB_SHA:0:7}\`"
    } >> "$GITHUB_STEP_SUMMARY"
  DOCKER_FRONTEND_BUILD_ARGS: |
    REACT_UI=frontend/_shared/frontend-react-ui
    UI_RUNTIME=frontend/_shared/frontend-javascript-app
  DEPLOY_SSH_SCRIPT: |
    set -euo pipefail
    cd /home/reference_app_copy/reference-app-copy
    git fetch origin
    git checkout --force "$IMAGE_TAG"
    echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    docker compose pull ${DEPLOY_COMPOSE_SERVICES}
    docker compose up -d --remove-orphans ${DEPLOY_COMPOSE_SERVICES}
    if [ -n "${DEPLOY_HEALTH_URL:-}" ]; then
      curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${DEPLOY_HEALTH_URL}"
    fi
    docker logout ghcr.io

jobs:
  # Create/adopt one TestOps job-run before tests fan out. This job is deliberately
  # non-gating: missing credentials, fork PRs or a TestOps outage disable live upload
  # without preventing the test jobs from running and publishing raw artifacts.
  testops-context:
    name: testops-context
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      launch_id: ${{ steps.context.outputs.launch_id }}
      job_run_id: ${{ steps.context.outputs.job_run_id }}
      launch_url: ${{ steps.context.outputs.launch_url }}
    steps:
      - name: Check TestOps configuration
        id: configured
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          if [ -n "${ALLURE_TOKEN:-}" ] && [ -n "${ALLURE_PROJECT_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "ALLURE_LIVE_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "TestOps credentials unavailable — live upload disabled"
          fi

      # Binary only (not token / launch). setup-allurectl@v1 stores under
      # $RUNNER_TOOL_CACHE/allurectl/<ver>/<goarch>/ + sibling `.complete` and
      # always hits GitHub API, so we pin the release into $RUNNER_TEMP/allurectl-bin.
      - &cache-allurectl
        name: Cache allurectl binary
        if: always() && env.ALLURE_LIVE_ENABLED == 'true'
        id: cache-allurectl
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/allurectl-bin
          key: allurectl-${{ runner.os }}-${{ runner.arch }}-${{ env.ALLURECTL_VERSION }}

      - &setup-live-allurectl
        name: Install pinned allurectl for live upload
        if: always() && env.ALLURE_LIVE_ENABLED == 'true'
        id: setup-allurectl
        continue-on-error: true
        timeout-minutes: 1
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/allurectl-bin"
          BIN="${DEST}/allurectl"
          mkdir -p "$DEST"
          bin_ok() { [[ -x "$BIN" ]] && "$BIN" --version >/dev/null 2>&1; }
          if bin_ok; then
            echo "allurectl ${ALLURECTL_VERSION} restored from cache (${BIN})"
          else
            rm -f "$BIN"
            case "${RUNNER_OS}" in Linux) os=linux ;; macOS) os=darwin ;; *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2; exit 1 ;; esac
            case "${RUNNER_ARCH}" in X64) arch=amd64 ;; ARM64) arch=arm64 ;; *)
              echo "unsupported RUNNER_ARCH=${RUNNER_ARCH}" >&2; exit 1 ;; esac
            url="https://github.com/allure-framework/allurectl/releases/download/${ALLURECTL_VERSION}/allurectl_${os}_${arch}"
            echo "Downloading ${url}"
            curl -fsSL --connect-timeout 10 --max-time 45 -o "$BIN" "$url"
            chmod +x "$BIN"
            bin_ok || { echo "downloaded allurectl is not executable" >&2; exit 1; }
            "$BIN" --version
          fi
          echo "$DEST" >> "$GITHUB_PATH"
          if [[ -n "${ALLURE_TOKEN:-}" ]]; then
            echo "ALLURE_TOKEN=${ALLURE_TOKEN}" >> "$GITHUB_ENV"
          fi
          if [[ -z "${ALLURE_JOB_UID:-}" ]]; then
            echo "ALLURE_JOB_UID=${GITHUB_REPOSITORY}/actions/workflows/ci.yml" >> "$GITHUB_ENV"
          fi

      - &cache-playwright-browsers
        name: Cache Playwright browsers
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # hashFiles needs literal globs — keep in sync when flipping TESTS_DIR.
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Create or adopt shared TestOps context
        id: context
        if: always()
        env:
          ALLURE_LAUNCH_NAME: "${{ env.APP_SLUG }} CI — ${{ env.RUN_LABEL }}"
        run: |
          set +e
          set -uo pipefail

          emit_disabled() {
            local cleanup_job_run_id="${1:-}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "launch_id=" >> "$GITHUB_OUTPUT"
            echo "job_run_id=${cleanup_job_run_id}" >> "$GITHUB_OUTPUT"
            echo "launch_url=" >> "$GITHUB_OUTPUT"
          }

          if [ "${{ steps.configured.outputs.enabled }}" != "true" ] ||
             [ "${{ steps.setup-allurectl.outcome }}" != "success" ] ||
             ! command -v allurectl >/dev/null 2>&1; then
            emit_disabled
            exit 0
          fi

          JOB_RUN_ID="${ALLURE_JOB_RUN_ID:-}"
          START_OUT=""
          if [ -z "$JOB_RUN_ID" ]; then
            JOB_RUN_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            START_OUT="$(
              allurectl --http-timeout 10s job-run start \
                --project-id "$ALLURE_PROJECT_ID" \
                --ci-type github \
                --ci-endpoint "$GITHUB_SERVER_URL" \
                --job-name "$GITHUB_WORKFLOW" \
                --job-uid "$ALLURE_JOB_UID" \
                --job-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/ci.yml" \
                --job-run-name "#$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
                --job-run-uid "$ALLURE_JOB_RUN_UID" \
                --job-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --job-run-branch "$JOB_RUN_BRANCH" \
                --launch-name "$ALLURE_LAUNCH_NAME"
            )"
            START_EXIT=$?
            if [ "$START_EXIT" -ne 0 ]; then
              echo "Unable to create TestOps job-run — live upload disabled"
              emit_disabled
              exit 0
            fi
          fi

          resolve_job_run_env() {
            allurectl --http-timeout 10s job-run env \
              --project-id "$ALLURE_PROJECT_ID" \
              "$@"
          }

          if [ -n "$JOB_RUN_ID" ]; then
            JOB_ENV="$(resolve_job_run_env --job-run-id "$JOB_RUN_ID")"
          else
            JOB_ENV="$(resolve_job_run_env --job-run-uid "$ALLURE_JOB_RUN_UID")"
          fi
          ENV_EXIT=$?
          if [ "$ENV_EXIT" -ne 0 ] && [ -n "$START_OUT" ]; then
            JOB_RUN_ID="$(
              printf '%s' "$START_OUT" \
                | grep -Eo 'Jobrun\[[0-9]+\]' \
                | head -1 \
                | sed -E 's/Jobrun\[([0-9]+)\]/\1/'
            )"
            if [ -n "$JOB_RUN_ID" ]; then
              JOB_ENV="$(resolve_job_run_env --job-run-id "$JOB_RUN_ID")"
              ENV_EXIT=$?
            fi
          fi
          if [ "$ENV_EXIT" -ne 0 ]; then
            echo "Unable to resolve TestOps job-run context — live upload disabled"
            emit_disabled "${JOB_RUN_ID:-}"
            exit 0
          fi

          # `job-run env` is the official shell-assignment handoff contract.
          # Export it locally, then expose only non-secret numeric IDs and URL.
          # shellcheck disable=SC2046
          export $(printf '%s\n' "$JOB_ENV")
          if ! [[ "${ALLURE_JOB_RUN_ID:-}" =~ ^[0-9]+$ ]] ||
             ! [[ "${ALLURE_LAUNCH_ID:-}" =~ ^[0-9]+$ ]]; then
            echo "Invalid TestOps context IDs — live upload disabled"
            emit_disabled "$JOB_RUN_ID"
            exit 0
          fi

          LAUNCH_URL="${ALLURE_LAUNCH_URL:-${ALLURE_ENDPOINT%/}/launch/${ALLURE_LAUNCH_ID}}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "launch_id=${ALLURE_LAUNCH_ID}" >> "$GITHUB_OUTPUT"
          echo "job_run_id=${ALLURE_JOB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"

  # Keep the backend root first: GitHub has no explicit graph coordinates and uses
  # declaration order as a layout hint for otherwise independent jobs.
  unit-tests:
    needs: testops-context
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: unit
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: backend/java/backend-java-spring
      GRADLE_CC_KEY_PREFIX: backend-java-spring
      ALLURE_RESULTS_ARTIFACT: allure-results-unit
      ALLURE_RESULTS_UPLOAD_PATH: backend/java/backend-java-spring/build/allure-results/**
      SETUP_NODE_IF: "false"
      NODE_CACHE_DEPENDENCY_PATH: backend/java/backend-java-spring/package-lock.json
      SETUP_PYTHON_IF: "false"
      PYTHON_CACHE_DEPENDENCY_PATH: backend/java/backend-java-spring/requirements.txt
      PYTHON_WORKDIR: backend/java/backend-java-spring
      NPM_CI_IF: "false"
      NPM_WORKDIR: backend/java/backend-java-spring
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ env.CHECKOUT_FETCH_DEPTH }}

      - *cache-allurectl
      - *setup-live-allurectl

      # ── java / kotlin (Gradle + JaCoCo) ───────────────────────────────────
      # setup-java must not set `cache: gradle` — setup-gradle owns ~/.gradle.
      # cache-encryption-key exports GRADLE_ENCRYPTION_KEY so CC is reusable across runners.
      - &setup-java
        if: env.SETUP_JVM_IF == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - &setup-gradle
        if: env.SETUP_JVM_IF == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY == 'true' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # hashFiles needs literal globs (format(env.*) is rejected at workflow parse).
      # Keep in sync when swapping BACKEND_DIR / TESTS_DIR in workflow env.
      - &cache-gradle-cc
        if: env.GRADLE_CC_IF == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.GRADLE_CC_MODULE }}/.gradle/configuration-cache
          key: gradle-cc-${{ env.GRADLE_CC_KEY_PREFIX }}-${{ hashFiles('backend/java/backend-java-spring/*.gradle*', 'backend/java/backend-java-spring/gradle/wrapper/gradle-wrapper.properties', 'backend/java/backend-java-spring/gradle.properties', 'backend/kotlin/backend-kotlin-spring/*.gradle*', 'backend/kotlin/backend-kotlin-spring/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-cc-${{ env.GRADLE_CC_KEY_PREFIX }}-
      - name: Run unit tests (Gradle + JaCoCo)
        if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.BACKEND_DIR }}/build/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test jacocoTestReport jacocoTestCoverageVerification -DexcludeTags=integration
        working-directory: ${{ env.BACKEND_DIR }}
      - if: (env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin') && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: |
            ${{ env.BACKEND_DIR }}/build/jacoco/**
            ${{ env.BACKEND_DIR }}/build/reports/jacoco/**
            ${{ env.BACKEND_DIR }}/build/classes/**
          if-no-files-found: error
      # ── python ───────────────────────────────────────────────────────────
      - &setup-python
        if: env.SETUP_PYTHON_IF == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.PYTHON_CACHE_DEPENDENCY_PATH }}
      - &pip-install
        name: Install Python dependencies
        if: env.SETUP_PYTHON_IF == 'true'
        run: python -m pip install -r requirements.txt
        working-directory: ${{ env.PYTHON_WORKDIR }}
      - name: Run Python tests (pytest)
        if: env.BACKEND_LANG == 'python'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.BACKEND_DIR }}/build/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl python -m pytest
        working-directory: ${{ env.BACKEND_DIR }}

      # ── go ───────────────────────────────────────────────────────────────
      - if: env.BACKEND_LANG == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.BACKEND_DIR }}/go.sum
      - name: Run Go unit tests
        if: env.BACKEND_LANG == 'go'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.BACKEND_DIR }}/build/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl go test ./...
        working-directory: ${{ env.BACKEND_DIR }}

      # ── javascript / typescript ──────────────────────────────────────────
      - &setup-node
        if: env.SETUP_NODE_IF == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.NODE_CACHE_DEPENDENCY_PATH }}
      - &npm-ci
        name: Install npm dependencies
        if: env.NPM_CI_IF == 'true'
        run: npm ci
        working-directory: ${{ env.NPM_WORKDIR }}
      - name: Run backend unit tests (npm)
        if: env.BACKEND_LANG == 'javascript' || env.BACKEND_LANG == 'typescript'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.BACKEND_DIR }}/build/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl npm test
        working-directory: ${{ env.BACKEND_DIR }}
      - &upload-allure-results
        name: Publish raw Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ALLURE_RESULTS_ARTIFACT }}
          path: ${{ env.ALLURE_RESULTS_UPLOAD_PATH }}
          if-no-files-found: ignore
          retention-days: 1

  integration-tests:
    needs: [unit-tests, testops-context]
    if: >-
      always() && !cancelled() && needs.unit-tests.result == 'success' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.run_integration)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LAYER: integration
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: backend/java/backend-java-spring
      GRADLE_CC_KEY_PREFIX: backend-java-spring-integration
      ALLURE_RESULTS_ARTIFACT: allure-results-integration
      ALLURE_RESULTS_UPLOAD_PATH: backend/java/backend-java-spring/build/allure-results/**
    steps:
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java / kotlin (Spring Boot + Testcontainers PostgreSQL) ───────────
      - *setup-java
      - *setup-gradle
      - *cache-gradle-cc
      - name: Run integration tests (Gradle + Testcontainers)
        if: env.BACKEND_LANG == 'java' || env.BACKEND_LANG == 'kotlin'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.BACKEND_DIR }}/build/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test -DincludeTags=integration
        working-directory: ${{ env.BACKEND_DIR }}
      - *upload-allure-results

  changes:
    runs-on: ubuntu-24.04
    env:
      CHECKOUT_FETCH_DEPTH: "0"
    outputs:
      backend: ${{ steps.set.outputs.backend }}
      frontend: ${{ steps.set.outputs.frontend }}
      tests: ${{ steps.set.outputs.tests }}
    steps:
      - *checkout
      - name: Detect changed paths
        id: set
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            emit backend false; emit frontend false; emit tests false
            exit 0
          fi
          # Force-push and first-push leave `before` unusable (nulled, or a commit this clone
          # never fetched); diffing against it aborts the job, so fall back to "everything".
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            emit backend true; emit frontend true; emit tests true
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          match() { printf '%s\n' "$CHANGED" | grep -qE "$1"; }
          SHARED='deploy/|docker-compose|\.github/workflows/ci\.yml'
          match "^(backend/|${SHARED})"  && emit backend true  || emit backend false
          match "^(frontend/|${SHARED})" && emit frontend true || emit frontend false
          match "^(tests/|${SHARED})"    && emit tests true    || emit tests false

  # Same teaching knob as deploy/sonar: only FRONTEND_DIR. Sibling frontends are not gated.
  # Coverage always on (this job is the deploy default). lint/typecheck --if-present for JS.
  # Do not point FRONTEND at frontend-javascript-vanilla (no npm/Vitest — browser layers only).
  component-tests:
    needs: testops-context
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: component
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_NODE_IF: "true"
      NODE_CACHE_DEPENDENCY_PATH: frontend/typescript/frontend-typescript-react/package-lock.json
      NPM_CI_IF: "true"
      NPM_WORKDIR: frontend/typescript/frontend-typescript-react
      ALLURE_RESULTS_ARTIFACT: allure-results-component
      ALLURE_RESULTS_UPLOAD_PATH: frontend/typescript/frontend-typescript-react/allure-results/**
    steps:
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl
      - *setup-node
      - *npm-ci
      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Typecheck frontend
        run: npm run typecheck --if-present
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Run component tests (Vitest + coverage)
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.FRONTEND_DIR }}/allure-results
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl npm test -- --coverage
        working-directory: ${{ env.FRONTEND_DIR }}
      - if: steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage/
          if-no-files-found: error
      - *upload-allure-results

  # Stub API on runner (compose --profile mock); after jsdom, before FE image push.
  ui-mock-tests:
    needs: [changes, testops-context, component-tests]
    if: >-
      always() && !cancelled() &&
      needs.component-tests.result == 'success' && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.run_mock ||
          inputs.update_mock_screenshots ||
          inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      LAYER: ui-mock
      SCREENSHOT_OS: linux
      SCREENSHOT_BROWSER: chrome
      # Stable GHA BuildKit scope — hashFiles is not allowed in job env; layers are content-addressed.
      DOCKER_CACHE_SCOPE: reference-app-copy-docker-mock-stand-gateway
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CACHE_READ_ONLY: "true"
      SETUP_BUILDX_IF: "true"
      # Build path. Do not name this DOCKER_CONTEXT — GHA injects job env into
      # every step; Docker CLI/buildx treat DOCKER_CONTEXT as a named context.
      DOCKER_BUILD_CONTEXT: .
      DOCKER_FILE: frontend/typescript/frontend-typescript-react/Dockerfile
      DOCKER_TAGS: ghcr.io/${{ github.repository_owner }}/reference-app-copy-frontend-typescript-react:mock-local
      DOCKER_BUILD_ARGS: |
        REACT_UI=frontend/_shared/frontend-react-ui
        UI_RUNTIME=frontend/_shared/frontend-javascript-app
      ALLURE_RESULTS_ARTIFACT: allure-results-ui-mock
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java (-Denv=reference_mock -DincludeTags=mock) ────────────────────
      # Read-only GUH (GRADLE_CACHE_READ_ONLY). No CC restore: entries pin
      # absolute GRADLE_USER_HOME (JaCoCo agent jars) from other runners.
      - *setup-java
      - *setup-gradle
      # reference_mock has no remoteUrl: the stand lives on the runner's localhost, which a
      # Selenoid browser could not reach, so the browser has to be local too.
      # setup-chrome only has an in-runner tool-cache; persist it like allurectl.
      # Path is $RUNNER_TOOL_CACHE/setup-chrome/{chrome,chromedriver}/<ver>/<arch>/.
      - &cache-chrome-for-testing
        name: Cache Chrome for Testing
        if: env.TESTS_LANG == 'java'
        id: cache-chrome-for-testing
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/setup-chrome
          key: chrome-for-testing-${{ runner.os }}-${{ runner.arch }}-${{ env.CHROME_FOR_TESTING_VERSION }}
      - name: Install pinned Chrome for Testing
        if: env.TESTS_LANG == 'java'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2.1.2
        with:
          chrome-version: ${{ env.CHROME_FOR_TESTING_VERSION }}
          install-chromedriver: true
      # stand-gateway serves the SPA and proxies /api/ to WireMock stubs (deploy/mock/mappings).
      # Pre-build frontend with GHA layer cache; compose up pulls api-mock and starts nginx gateway.
      - &setup-docker-buildx
        if: env.SETUP_BUILDX_IF != 'false'
        uses: docker/setup-buildx-action@v4
      - &docker-build-push
        if: env.SETUP_BUILDX_IF != 'false'
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          file: ${{ env.DOCKER_FILE }}
          tags: ${{ env.DOCKER_TAGS }}
          build-args: ${{ env.DOCKER_BUILD_ARGS }}
          load: true
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}
      - name: Bring up mock stand
        if: env.TESTS_LANG == 'java'
        run: |
          set -euo pipefail
          docker compose --profile mock up -d stand-gateway
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:${MOCK_GATEWAY_PORT}/api/health"
        env:
          IMAGE_TAG: mock-local
          MOCK_GATEWAY_PORT: "9911"
      - name: Run ui-mock tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test -Denv=reference_mock -DincludeTags=mock
        working-directory: ${{ env.TESTS_DIR }}
      - name: Stash mock Allure results
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: |
          set -euo pipefail
          STASH="${{ env.TESTS_DIR }}/build/allure-results-mock-stash"
          SRC="${{ env.TESTS_DIR }}/build/allure-results"
          mkdir -p "$STASH"
          if [ -d "$SRC" ]; then cp -R "$SRC/." "$STASH/"; fi
      # Same mock compose stand; separate Gradle fail from includeTags=mock.
      # includeTags CSV is OR here — do not combine mock,screenshot in one step.
      # Compare and rewrite are mutually exclusive: a UI change would fail compare
      # and block the rewrite.
      - name: Run screenshot mock compare (Gradle)
        if: >-
          always() && !cancelled() && env.TESTS_LANG == 'java' &&
          (github.event_name != 'workflow_dispatch' || inputs.update_mock_screenshots != true)
        id: run-screenshot-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test -Denv=reference_mock -DincludeTags=screenshot
        working-directory: ${{ env.TESTS_DIR }}
      - name: Update screenshots
        if: >-
          always() && !cancelled() && env.TESTS_LANG == 'java' &&
          github.event_name == 'workflow_dispatch' && inputs.update_mock_screenshots
        id: update-screenshots
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          CHROME_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test -Denv=reference_mock -DincludeTags=screenshot -DupdateScreenshots=true
        working-directory: ${{ env.TESTS_DIR }}
      - name: Merge Allure results
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: |
          set -euo pipefail
          STASH="${{ env.TESTS_DIR }}/build/allure-results-mock-stash"
          DEST="${{ env.TESTS_DIR }}/build/allure-results"
          mkdir -p "$DEST"
          if [ -d "$STASH" ]; then cp -R "$STASH/." "$DEST/"; fi
      - name: Tear down mock stand
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: docker compose --profile mock down -v --remove-orphans
      - *upload-allure-results
      - name: Publish mock screenshot PNGs
        if: >-
          always() && env.TESTS_LANG == 'java' &&
          github.event_name == 'workflow_dispatch' && inputs.update_mock_screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mock-screenshot-pngs
          path: ${{ env.TESTS_DIR }}/src/test/resources/screenshots/
          if-no-files-found: ignore

  tests-harness-backend:
    needs: testops-context
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: harness-backend
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: tests/java/tests-java-gradle-junit5-allure3-selenide
      GRADLE_CC_KEY_PREFIX: tests-java-gradle-junit5-allure3-selenide-${{ github.job }}
      ALLURE_RESULTS_ARTIFACT: allure-results-harness-backend
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - *setup-java
      - *setup-gradle
      - *cache-gradle-cc
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) and are published for the reporting matrix.
      - name: Run harness-backend tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-backend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-backend
          path: |
            ${{ env.TESTS_DIR }}/build/jacoco/**
            ${{ env.TESTS_DIR }}/build/reports/jacoco/**
            ${{ env.TESTS_DIR }}/build/classes/**
          if-no-files-found: error
      - *upload-allure-results

  tests-harness-frontend:
    needs: testops-context
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAYER: harness-frontend
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: tests/java/tests-java-gradle-junit5-allure3-selenide
      GRADLE_CC_KEY_PREFIX: tests-java-gradle-junit5-allure3-selenide-${{ github.job }}
      SETUP_NODE_IF: "false"
      NODE_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/package-lock.json
      NPM_CI_IF: "false"
      NPM_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      PLAYWRIGHT_IF: "false"
      SETUP_PYTHON_IF: "false"
      PYTHON_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/requirements.txt
      PYTHON_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      ALLURE_RESULTS_ARTIFACT: allure-results-harness-frontend
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java (Gradle tags + JaCoCo gate) ──────────────────────────────────
      - *setup-java
      - *setup-gradle
      - *cache-gradle-cc
      # Coverage gate reads build/jacoco/test.exec, so it is only meaningful with this filter.
      # Allure results stay on (default allure3) and are published for the reporting matrix.
      - name: Run harness-frontend tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=reference_ci -DincludeTags=harness-frontend
        working-directory: ${{ env.TESTS_DIR }}
      - if: env.TESTS_LANG == 'java' && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-harness-frontend
          path: |
            ${{ env.TESTS_DIR }}/build/jacoco/**
            ${{ env.TESTS_DIR }}/build/reports/jacoco/**
            ${{ env.TESTS_DIR }}/build/classes/**
          if-no-files-found: error
      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - *setup-node
      - *npm-ci
      - *cache-playwright-browsers
      - &install-playwright
        name: Install Playwright Chromium
        if: env.PLAYWRIGHT_IF == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.TESTS_DIR }}
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - *setup-python
      - *pip-install
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - *upload-allure-results

  # Quality axis (SonarQube) — hard gate before deploy (not build). Coverage reused via artifacts.
  # Quality Gate wait is native in each scanner (`sonar.qualitygate.wait=true`).
  sonar-backend:
    needs: [unit-tests, integration-tests]
    if: >-
      !cancelled() &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY || 'reference-app-copy-backend-java-spring' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: backend/java/backend-java-spring
      GRADLE_CC_KEY_PREFIX: backend-java-spring-sonar
    steps:
      - *checkout
      - *setup-java
      - *setup-gradle
      - *cache-gradle-cc
      - uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: ${{ env.BACKEND_DIR }}/build
      - name: Sonar scan + gate (backend)
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -f build/reports/jacoco/test/jacocoTestReport.xml ]]; then
            echo "ERROR: JaCoCo report missing — unit-tests artifact incomplete" >&2
            exit 1
          fi

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          # Token via env only (SONAR_TOKEN) — never argv (canon: docs/sonar/GITHUB-ACTIONS.md).
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - &write-sonar-summary
        name: Write Sonar summary
        if: always()
        run: |
          eval "${WRITE_SONAR_SUMMARY}"

  # Tests-module Sonar after both harness slices; coverage merged from harness job artifacts.
  sonar-tests:
    needs: [tests-harness-backend, tests-harness-frontend]
    if: >-
      !cancelled() &&
      needs.tests-harness-backend.result == 'success' &&
      needs.tests-harness-frontend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_TESTS_PROJECT_KEY || 'reference-app-copy-tests-java-gradle-junit5-allure3-selenide' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SETUP_JVM_IF: "true"
      GRADLE_CC_IF: "true"
      GRADLE_CC_MODULE: tests/java/tests-java-gradle-junit5-allure3-selenide
      GRADLE_CC_KEY_PREFIX: tests-java-gradle-junit5-allure3-selenide-${{ github.job }}
    steps:
      - *checkout
      - *setup-java
      - *setup-gradle
      - *cache-gradle-cc
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-backend
          path: harness-backend
      - uses: actions/download-artifact@v8
        with:
          name: coverage-harness-frontend
          path: harness-frontend
      - name: Sonar scan + gate (tests)
        working-directory: ${{ env.TESTS_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          JACOCO_XML_PATHS="${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml,${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"
          for xml in "${GITHUB_WORKSPACE}/harness-backend/reports/jacoco/test/jacocoTestReport.xml" \
                     "${GITHUB_WORKSPACE}/harness-frontend/reports/jacoco/test/jacocoTestReport.xml"; do
            if [[ ! -f "$xml" ]]; then
              echo "ERROR: JaCoCo report missing: $xml" >&2
              exit 1
            fi
          done

          ./gradlew compileTestJava --no-daemon

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (harness coverage artifacts) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          ./gradlew sonar --no-daemon \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.coverage.jacoco.xmlReportPaths="${JACOCO_XML_PATHS}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - *write-sonar-summary

  sonar-frontend:
    needs: [component-tests, ui-mock-tests]
    if: >-
      !cancelled() &&
      needs.component-tests.result == 'success' &&
      (needs.ui-mock-tests.result == 'success' || needs.ui-mock-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY || 'reference-app-copy-frontend-typescript-react' }}
      CHECKOUT_FETCH_DEPTH: "0"
      SETUP_NODE_IF: "true"
      NODE_CACHE_DEPENDENCY_PATH: frontend/typescript/frontend-typescript-react/package-lock.json
    steps:
      - *checkout
      - *setup-node
      - uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: ${{ env.FRONTEND_DIR }}/coverage
      - name: Sonar scan + gate (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -d coverage ]] || [ -z "$(ls -A coverage 2>/dev/null || true)" ]; then
            echo "ERROR: coverage artifact missing — component-tests incomplete" >&2
            exit 1
          fi
          npm ci

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "ERROR: SONAR_TOKEN unset" >&2
            exit 1
          fi

          echo "==> sonar scan (coverage artifact) → ${SONAR_HOST_URL} (${SONAR_PROJECT_KEY})"
          npx --yes "@sonar/scan@${SONAR_SCANNER_NPM_VERSION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectName="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout="${SONAR_QUALITY_GATE_TIMEOUT}"
      - *write-sonar-summary

  build-backend:
    needs: [unit-tests, integration-tests, changes]
    if: >-
      !cancelled() &&
      needs.unit-tests.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'backend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKER_CACHE_SCOPE: reference-app-copy-docker-backend-java-spring
      DOCKER_BUILD_CONTEXT: backend/java/backend-java-spring
      DOCKER_FILE: backend/java/backend-java-spring/Dockerfile
      DOCKER_TAGS: ghcr.io/${{ github.repository_owner }}/reference-app-copy-backend-java-spring:${{ github.sha }}
      DOCKER_BUILD_ARGS: ""
    steps:
      - *checkout
      - &docker-login-ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - *setup-docker-buildx
      - *docker-build-push
      - name: Push backend Docker image to GHCR
        run: docker compose push ${{ env.BACKEND }}

  build-frontend:
    needs: [ui-mock-tests, changes]
    if: >-
      !cancelled() &&
      needs.ui-mock-tests.result == 'success' &&
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.frontend == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         (inputs.deploy == 'frontend' || inputs.deploy == 'both'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      DOCKER_CACHE_SCOPE: reference-app-copy-docker-frontend-typescript-react
      DOCKER_BUILD_CONTEXT: .
      DOCKER_FILE: frontend/typescript/frontend-typescript-react/Dockerfile
      DOCKER_TAGS: ghcr.io/${{ github.repository_owner }}/reference-app-copy-frontend-typescript-react:${{ github.sha }}
      DOCKER_BUILD_ARGS: |
        REACT_UI=frontend/_shared/frontend-react-ui
        UI_RUNTIME=frontend/_shared/frontend-javascript-app
    steps:
      - *checkout
      - *docker-login-ghcr
      - *setup-docker-buildx
      - *docker-build-push
      - name: Push frontend Docker image to GHCR
        run: docker compose push ${{ env.FRONTEND }}

  deploy-backend:
    needs: [build-backend, sonar-backend]
    if: >-
      !cancelled() &&
      needs.build-backend.result == 'success' &&
      needs.sonar-backend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'reference-production' }}
      url: ${{ env.APP_URL }}
    # Shared deploy host: serialize git checkout with deploy-frontend (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    # Backend (+ postgres) — api-tests need API :8800 after deploy, not frontend.
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_STEP_NAME: Deploy backend to stand
      DEPLOY_COMPOSE_SERVICES: postgres postgres-ensure-dbs backend-java-spring
      DEPLOY_HEALTH_URL: http://127.0.0.1:8800/api/health
    steps:
      - &ssh-deploy
        name: ${{ env.DEPLOY_STEP_NAME }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,GHCR_TOKEN,DEPLOY_COMPOSE_SERVICES,DEPLOY_HEALTH_URL
          script: ${{ env.DEPLOY_SSH_SCRIPT }}

  # FE deploy after build + sonar; mock already gated build-frontend.
  deploy-frontend:
    needs: [build-frontend, sonar-frontend]
    if: >-
      !cancelled() &&
      needs.build-frontend.result == 'success' &&
      needs.sonar-frontend.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'reference-production' }}
      url: ${{ env.APP_URL }}
    # Independent of backend lane; shared host lock via concurrency (same checkout dir).
    concurrency:
      group: deploy-reference-app-copy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_STEP_NAME: Deploy frontend to stand
      DEPLOY_COMPOSE_SERVICES: frontend-typescript-react
      DEPLOY_HEALTH_URL: ""
    steps:
      - *ssh-deploy

  # Rest Assured against deployed backend — starts as soon as that lane finishes (FE may
  # still be deploying). A skipped backend deploy is fine when tests changed or dispatch
  # asked for api without a backend deploy; a failed backend deploy keeps this job off.
  api-tests:
    needs: [deploy-backend, changes, testops-context]
    if: >-
      always() && !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
         (needs.deploy-backend.result == 'success' ||
          (needs.deploy-backend.result == 'skipped' &&
           needs.changes.outputs.tests == 'true'))) ||
        (github.event_name == 'workflow_dispatch' && inputs.run_api &&
         (needs.deploy-backend.result == 'success' ||
          needs.deploy-backend.result == 'skipped') &&
         (!(inputs.deploy == 'backend' || inputs.deploy == 'both') ||
          needs.deploy-backend.result == 'success'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAYER: api
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CACHE_READ_ONLY: "true"
      SETUP_NODE_IF: "false"
      NODE_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/package-lock.json
      NPM_CI_IF: "false"
      NPM_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      PLAYWRIGHT_IF: "false"
      SETUP_PYTHON_IF: "false"
      PYTHON_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/requirements.txt
      PYTHON_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      ALLURE_RESULTS_ARTIFACT: allure-results-api
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - name: Wait for live API
        env:
          API_HEALTH: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/${{ env.BACKEND }}/api/health
        run: |
          set -euo pipefail
          echo "==> API ${API_HEALTH}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${API_HEALTH}"
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java (no UI — Rest Assured API contract against deployed backend) ─
      - *setup-java
      - *setup-gradle
      - name: Run API tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test -Denv=reference_prod -DincludeTags=api
        working-directory: ${{ env.TESTS_DIR }}
      # ── javascript / typescript (full suite) ──────────────────────────────
      - *setup-node
      - *npm-ci
      - *cache-playwright-browsers
      - *install-playwright
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite) ──────────────────────────────────────────────
      - *setup-python
      - *pip-install
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - *upload-allure-results

  # After API layer; also wait for frontend deploy (skipped = keep live UI).
  # Frontend-only push skips api-tests and still runs e2e.
  e2e-tests:
    needs: [api-tests, deploy-frontend, testops-context]
    if: >-
      always() && !cancelled() && (
        (needs.deploy-frontend.result == 'success' ||
         needs.deploy-frontend.result == 'skipped') && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           (needs.api-tests.result == 'success' ||
            (needs.api-tests.result == 'skipped' &&
             needs.deploy-frontend.result == 'success'))) ||
          (github.event_name == 'workflow_dispatch' &&
           (inputs.run_e2e ||
            inputs.run_screenshot ||
            inputs.update_e2e_screenshots ||
            inputs.include_tags != '' ||
            inputs.exclude_tags != '') &&
           (needs.api-tests.result == 'success' || needs.api-tests.result == 'skipped') &&
           (!(inputs.deploy == 'frontend' || inputs.deploy == 'both') ||
            needs.deploy-frontend.result == 'success'))
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: e2e
      SCREENSHOT_OS: linux
      SCREENSHOT_BROWSER: chrome
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CACHE_READ_ONLY: "true"
      SETUP_NODE_IF: "false"
      NODE_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/package-lock.json
      NPM_CI_IF: "false"
      NPM_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      PLAYWRIGHT_IF: "false"
      SETUP_PYTHON_IF: "false"
      PYTHON_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/requirements.txt
      PYTHON_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
      ALLURE_RESULTS_ARTIFACT: allure-results-e2e
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - name: Wait for live UI
        run: |
          set -euo pipefail
          echo "==> UI ${UI_URL}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${UI_URL}"
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java: -DincludeTags / -DexcludeTags (override via dispatch inputs) ─
      - *setup-java
      - *setup-gradle
      - name: Run e2e tests (Gradle with tag filters)
        if: >-
          env.TESTS_LANG == 'java' && (
            github.event_name == 'push' ||
            inputs.run_e2e ||
            inputs.include_tags != '' ||
            inputs.exclude_tags != ''
          )
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          RUN_ENV: reference_prod
          INCLUDE_TAGS: ${{ inputs.include_tags }}
          EXCLUDE_TAGS: ${{ inputs.exclude_tags }}
          # Selenoid hub URL with credentials — config files commit only the creds-less URL.
          SELENOID_REMOTE_URL: ${{ secrets.SELENOID_REMOTE_URL }}
        run: |
          set -euo pipefail
          ARGS=(-Denv="$RUN_ENV")
          if [ -n "${SELENOID_REMOTE_URL:-}" ]; then
            ARGS+=(-DremoteUrl="${SELENOID_REMOTE_URL}")
          fi
          if [ -n "${INCLUDE_TAGS}" ]; then
            ARGS+=(-DincludeTags="${INCLUDE_TAGS}")
          else
            ARGS+=(-DincludeTags=e2e)
          fi
          if [ -n "${EXCLUDE_TAGS}" ]; then
            ARGS+=(-DexcludeTags="${EXCLUDE_TAGS}")
          else
            ARGS+=(-DexcludeTags=mock,screenshot)
          fi
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test "${ARGS[@]}"
        working-directory: ${{ env.TESTS_DIR }}
      - name: Stash e2e Allure results
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: |
          set -euo pipefail
          STASH="${{ env.TESTS_DIR }}/build/allure-results-e2e-stash"
          SRC="${{ env.TESTS_DIR }}/build/allure-results"
          mkdir -p "$STASH"
          if [ -d "$SRC" ]; then cp -R "$SRC/." "$STASH/"; fi
      - name: Run screenshot e2e compare (Gradle)
        if: >-
          always() && !cancelled() && env.TESTS_LANG == 'java' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.run_screenshot &&
          inputs.update_e2e_screenshots != true
        id: run-screenshot-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          RUN_ENV: reference_prod
          SELENOID_REMOTE_URL: ${{ secrets.SELENOID_REMOTE_URL }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=screenshot -DexcludeTags=mock ${SELENOID_REMOTE_URL:+"-DremoteUrl=$SELENOID_REMOTE_URL"}
        working-directory: ${{ env.TESTS_DIR }}
      - name: Update screenshots
        if: >-
          always() && !cancelled() && env.TESTS_LANG == 'java' &&
          github.event_name == 'workflow_dispatch' && inputs.update_e2e_screenshots
        id: update-screenshots
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          RUN_ENV: reference_prod
          SELENOID_REMOTE_URL: ${{ secrets.SELENOID_REMOTE_URL }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=screenshot -DupdateScreenshots=true ${SELENOID_REMOTE_URL:+"-DremoteUrl=$SELENOID_REMOTE_URL"}
        working-directory: ${{ env.TESTS_DIR }}
      - name: Merge Allure results
        if: always() && env.TESTS_LANG == 'java'
        continue-on-error: true
        run: |
          set -euo pipefail
          STASH="${{ env.TESTS_DIR }}/build/allure-results-e2e-stash"
          DEST="${{ env.TESTS_DIR }}/build/allure-results"
          mkdir -p "$DEST"
          if [ -d "$STASH" ]; then cp -R "$STASH/." "$DEST/"; fi
      - name: Publish e2e screenshot PNGs
        if: >-
          always() && env.TESTS_LANG == 'java' &&
          github.event_name == 'workflow_dispatch' && inputs.update_e2e_screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshot-pngs
          path: ${{ env.TESTS_DIR }}/src/test/resources/screenshots/
          if-no-files-found: ignore
      # ── javascript / typescript (full suite; no tag pyramid yet) ──────────
      - *setup-node
      - *npm-ci
      - *cache-playwright-browsers
      - *install-playwright
      - name: Run tests (npm)
        if: env.TESTS_LANG == 'javascript' || env.TESTS_LANG == 'typescript'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl npm test
        working-directory: ${{ env.TESTS_DIR }}

      # ── python (full suite; no tag pyramid yet) ───────────────────────────
      - *setup-python
      - *pip-install
      - name: Run Python tests (pytest)
        if: env.TESTS_LANG == 'python'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl python -m pytest
        working-directory: ${{ env.TESTS_DIR }}
      - *upload-allure-results

  # Main-chain tip after e2e; manual execution is explicit.
  manual-tests:
    needs: [e2e-tests, testops-context]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_manual &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LAYER: manual
      ALLURE_LIVE_ENABLED: ${{ needs.testops-context.outputs.enabled }}
      ALLURE_LAUNCH_ID: ${{ needs.testops-context.outputs.launch_id }}
      ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
      SETUP_JVM_IF: "true"
      GRADLE_CACHE_READ_ONLY: "true"
      ALLURE_RESULTS_ARTIFACT: allure-results-manual
      ALLURE_RESULTS_UPLOAD_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/build/allure-results/**
    steps:
      - name: Wait for live UI
        run: |
          set -euo pipefail
          echo "==> UI ${UI_URL}"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${UI_URL}"
      - *checkout
      - *cache-allurectl
      - *setup-live-allurectl

      # ── java (-DincludeTags=manual) ───────────────────────────────────────
      - *setup-java
      - *setup-gradle
      - name: Run manual tests (Gradle)
        if: env.TESTS_LANG == 'java'
        id: run-tests
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          RUN_ENV: reference_prod
        run: |
          eval "${ALLURECTL_RUN}"
          run_with_allurectl ./gradlew test "-Denv=$RUN_ENV" -DincludeTags=manual
        working-directory: ${{ env.TESTS_DIR }}
      - *upload-allure-results

  # Non-gating observability: one merged Allure report at the CI tip, then Telegram.
  publish-allure-report:
    name: publish-allure-report
    needs:
      - unit-tests
      - component-tests
      - tests-harness-backend
      - tests-harness-frontend
      - ui-mock-tests
      - integration-tests
      - api-tests
      - e2e-tests
      - manual-tests
      - testops-context
    if: always() && !cancelled()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      REPORT_ID: ${{ github.run_id }}
      GH_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      ALLURE_LIVE_ENABLED: ${{ vars.ALLURE_PROJECT_ID != '' }}
      SETUP_NODE_IF: "true"
      NODE_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/package-lock.json
      NPM_CI_IF: "true"
      NPM_WORKDIR: tests/java/tests-java-gradle-junit5-allure3-selenide
    outputs:
      testops_launch_url: ${{ steps.resolve-testops-url.outputs.launch_url }}
      report_generated: ${{ steps.allure-report.outcome == 'success' }}
      gh_pages_deployed: ${{ steps.gh-pages-deploy.outcome == 'success' }}
    steps:
      - *checkout

      - name: Load Allure history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          sparse-checkout: history.jsonl
          sparse-checkout-cone-mode: false

      - *setup-node

      - *npm-ci

      - name: Download merged raw Allure results
        id: results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: ${{ env.ALLURE_RESULTS_DIR }}
          merge-multiple: true

      - name: Verify merged Allure results
        id: merged-results
        if: steps.results.outcome == 'success'
        env:
          ALLURE_RESULTS: ${{ env.ALLURE_RESULTS_DIR }}
        run: |
          if [ -n "$(find "${ALLURE_RESULTS}" -type f 2>/dev/null | head -1)" ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=false" >> "$GITHUB_OUTPUT"
            echo "No merged Allure results — skip publish"
          fi

      # Canonical environment.properties after merge (one file for Pages / fallback upload).
      - name: Write launch environment axes
        if: steps.merged-results.outputs.has_results == 'true'
        env:
          ALLURE_RESULTS: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
        run: |
          eval "${ALLURE_WRITE_ENVIRONMENT}"
          write_allure_environment

      - name: Restore Allure history
        if: steps.merged-results.outputs.has_results == 'true'
        run: |
          if [ -f gh-pages/history.jsonl ]; then
            cp gh-pages/history.jsonl "${{ env.TESTS_DIR }}/history.jsonl"
          elif [ -f "${{ env.TESTS_DIR }}/history.jsonl" ]; then
            echo "Using checked-in history.jsonl"
          fi

      - *cache-allurectl
      - *setup-live-allurectl

      - name: Write executor.json
        if: steps.merged-results.outputs.has_results == 'true'
        env:
          ALLURE_RESULTS: ${{ env.ALLURE_RESULTS_DIR }}
        run: |
          mkdir -p "${ALLURE_RESULTS}"
          cat > "${ALLURE_RESULTS}/executor.json" <<EOF
          {
            "reportName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "${GH_PAGES_BASE}/reports/${REPORT_ID}/awesome/index.html",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Fallback upload merged results to Allure TestOps
        if: >-
          always() &&
          needs.testops-context.outputs.enabled != 'true' &&
          steps.merged-results.outputs.has_results == 'true' &&
          env.ALLURE_PROJECT_ID != ''
        continue-on-error: true
        id: testops-upload
        working-directory: ${{ env.TESTS_DIR }}
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_LAUNCH_NAME: "${{ env.APP_SLUG }} CI — ${{ env.RUN_LABEL }}"
        run: |
          set +e
          set -uo pipefail
          if [ -z "${ALLURE_TOKEN:-}" ]; then
            echo "No ALLURE_TOKEN — skip TestOps upload"
            exit 0
          fi
          if ! command -v allurectl >/dev/null 2>&1; then
            echo "allurectl not available — skip TestOps upload"
            exit 0
          fi
          allurectl upload "build/allure-results" \
            --endpoint "${ALLURE_ENDPOINT}" \
            --token "${ALLURE_TOKEN}" \
            --project-id "${ALLURE_PROJECT_ID}" \
            --launch-name "${ALLURE_LAUNCH_NAME}" 2>&1 | tee allurectl-upload.log
          UPLOAD_EXIT=${PIPESTATUS[0]}
          if [ "$UPLOAD_EXIT" -eq 0 ]; then
            LAUNCH_URL=$(grep -Eo 'https://[^ ]+/launch/[0-9]+' allurectl-upload.log | head -1 || true)
            if [ -z "$LAUNCH_URL" ] && allurectl job-run env >/tmp/allure-env 2>/dev/null; then
              # shellcheck disable=SC1091
              source /tmp/allure-env
              LAUNCH_URL="${ALLURE_LAUNCH_URL:-}"
            fi
            if [ -n "$LAUNCH_URL" ]; then
              echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
              echo "TESTOPS_LAUNCH_URL=${LAUNCH_URL}" >> "$GITHUB_ENV"
            fi
          fi
          exit 0

      - name: Stop shared TestOps job-run
        if: >-
          always() &&
          needs.testops-context.outputs.job_run_id != '' &&
          steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        env:
          ALLURE_JOB_RUN_ID: ${{ needs.testops-context.outputs.job_run_id }}
        run: |
          set -euo pipefail
          allurectl --http-timeout 30s job-run stop \
            --project-id "$ALLURE_PROJECT_ID" \
            --job-run-id "$ALLURE_JOB_RUN_ID"

      - name: Resolve TestOps launch URL
        id: resolve-testops-url
        if: always()
        env:
          LIVE_LAUNCH_URL: ${{ needs.testops-context.outputs.launch_url }}
          FALLBACK_LAUNCH_URL: ${{ steps.testops-upload.outputs.launch_url }}
        run: |
          LAUNCH_URL="${LIVE_LAUNCH_URL:-${FALLBACK_LAUNCH_URL:-}}"
          echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
          if [ -n "$LAUNCH_URL" ]; then
            echo "TESTOPS_LAUNCH_URL=${LAUNCH_URL}" >> "$GITHUB_ENV"
          fi

      - name: Allure quality gate + report
        if: always() && steps.merged-results.outputs.has_results == 'true'
        id: allure-report
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        run: |
          set +e
          npx --no-install allure quality-gate build/allure-results --config allurerc.mjs
          echo "QUALITY_GATE_EXIT=$?" >> "$GITHUB_ENV"
          npx --no-install allure generate build/allure-results \
            -o build/reports/allure-report/allureReport \
            --config allurerc.mjs
          REPORT_EXIT=$?
          set -e
          exit "${REPORT_EXIT}"

      - name: Publish merged Allure report artifact
        if: always() && steps.allure-report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ci
          path: ${{ env.ALLURE_REPORT_DIR }}/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare GitHub Pages
        id: pages-prepare
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.allure-report.outcome == 'success'
        env:
          ALLURE_REPORT_ROOT: ${{ env.ALLURE_REPORT_DIR }}
          ALLURE_AWESOME: ${{ env.ALLURE_AWESOME_DIR }}
        run: |
          if [ ! -f "${ALLURE_AWESOME}/index.html" ]; then
            echo "No ${ALLURE_AWESOME}/index.html — skip GitHub Pages"
            exit 0
          fi
          mkdir -p pages/reports/${REPORT_ID}
          cp -r "${ALLURE_REPORT_ROOT}/." "pages/reports/${REPORT_ID}/"
          rm -rf pages/reports/latest
          cp -r "pages/reports/${REPORT_ID}" pages/reports/latest
          if [ -f "${{ env.TESTS_DIR }}/history.jsonl" ]; then
            cp "${{ env.TESTS_DIR }}/history.jsonl" pages/history.jsonl
          elif [ -f "${ALLURE_REPORT_ROOT}/history.jsonl" ]; then
            cp "${ALLURE_REPORT_ROOT}/history.jsonl" pages/history.jsonl
          fi
          echo "${REPORT_ID}" > pages/latest-run-id.txt
          touch pages/.nojekyll

      - name: Deploy Allure report to GitHub Pages
        id: gh-pages-deploy
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          steps.allure-report.outcome == 'success' &&
          steps.pages-prepare.outcome == 'success' &&
          hashFiles('pages/reports/**/awesome/index.html') != ''
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages
          enable_jekyll: false
          keep_files: true

      - name: Job summary
        if: always()
        env:
          ALLURE_AWESOME: ${{ env.ALLURE_AWESOME_DIR }}
        run: |
          {
            echo "## publish-allure-report"
            echo ""
            echo "- [GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [ "${{ steps.gh-pages-deploy.outcome }}" = "success" ]; then
              echo "- [Allure report](${GH_PAGES_BASE}/reports/latest/awesome/index.html)"
              echo "- [Allure dashboard](${GH_PAGES_BASE}/reports/latest/dashboard/index.html)"
            elif [ -f "${ALLURE_AWESOME}/index.html" ]; then
              echo "- Allure report artifact: uploaded (GitHub Pages not deployed)"
            fi
            if [ -n "${TESTOPS_LAUNCH_URL:-}" ]; then
              echo "- [Allure TestOps launch](${TESTOPS_LAUNCH_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  send-allure-notifications:
    name: send-allure-notifications
    needs: publish-allure-report
    if: always() && !cancelled() && needs.publish-allure-report.result != 'skipped'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SETUP_NODE_IF: "true"
      NODE_CACHE_DEPENDENCY_PATH: tests/java/tests-java-gradle-junit5-allure3-selenide/package-lock.json
    steps:
      - *checkout

      - name: Download merged Allure report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-report-ci
          path: allure-report

      - name: Download merged raw Allure results
        if: steps.report.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: ${{ env.ALLURE_RESULTS_DIR }}
          merge-multiple: true

      - *setup-node

      - name: Install pinned Allure notification CLI
        if: steps.report.outcome == 'success'
        run: npm ci
        working-directory: ${{ env.TESTS_DIR }}

      - name: Send Allure Telegram notification
        if: always() && steps.report.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.TESTS_DIR }}
        env:
          NOTIFICATION_PROJECT: "${{ env.APP_SLUG }} CI #${{ github.run_number }}"
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTOPS_LAUNCH_URL: ${{ needs.publish-allure-report.outputs.testops_launch_url }}
          ALLURE_FOLDER: ${{ github.workspace }}/allure-report/awesome
          ALLURE_RESULTS_FOLDER: ${{ github.workspace }}/${{ env.ALLURE_RESULTS_DIR }}
          GH_PAGES_DEPLOYED: ${{ needs.publish-allure-report.outputs.gh_pages_deployed }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_REFERENCE_APP_TOPIC_ID || vars.TELEGRAM_REFERENCE_APP_TOPIC_ID || secrets.TELEGRAM_TOPIC_ID || vars.TELEGRAM_TOPIC_ID || '3' }}
          NOTIFICATION_MODE: ${{ github.event_name != 'pull_request' && 'live' || 'dry-run' }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "No Telegram token — skip notification"
            exit 0
          fi
          if [ ! -f "${ALLURE_FOLDER}/summary.json" ]; then
            echo "No ${ALLURE_FOLDER}/summary.json — skip Telegram"
            exit 0
          fi
          if [ "${GH_PAGES_DEPLOYED}" = "true" ]; then
            export ALLURE_REPORT_URL="${GH_PAGES_BASE}/reports/latest/awesome/index.html"
            export ALLURE_DASHBOARD_URL="${GH_PAGES_BASE}/reports/latest/dashboard/index.html"
          else
            export ALLURE_REPORT_URL=""
            export ALLURE_DASHBOARD_URL=""
          fi
          node scripts/render-notifications-config.mjs
          if [ "${NOTIFICATION_MODE}" = "live" ]; then
            MODE_FLAG="--live"
          else
            MODE_FLAG="--dry-run"
          fi
          npx --no-install allure-notifications send \
            --config notifications/config.runtime.json \
            "${MODE_FLAG}" \
            --out collage.png
