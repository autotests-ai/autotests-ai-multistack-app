/*
 * tests-kotlin — load block · Gatling Kotlin DSL (Java API from Kotlin)
 *
 *   ./gradlew gatlingRun
 *   ./gradlew gatlingRun -DapiBaseUrl=http://localhost:8800 -Dgatling.profile=smoke
 *
 * Default is 1 VU against the local Java Spring API (:8800). Not the pyramid.
 * Isolated stand: -Dgatling.allowPublic=true -DapiBaseUrl=https://…
 */

buildscript {
    ext {
        javaVersion = 21
        kotlinVersion = '2.4.10'
        gatlingPluginVersion = '3.15.1.3'
        defaultApiBaseUrl = 'http://localhost:8800'
    }
}

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'io.gatling.gradle' version "${gatlingPluginVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

kotlin {
    jvmToolchain(Integer.parseInt(javaVersion.toString()))
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(Integer.parseInt(javaVersion.toString()))
}

def pass = { String key, String envName, String fallback = '' ->
    def fromProp = System.getProperty(key)
    if (fromProp != null && !fromProp.isBlank()) {
        return fromProp
    }
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && !fromEnv.isBlank()) {
        return fromEnv
    }
    return fallback
}

gatling {
    systemProperties = [
            apiBaseUrl              : pass('apiBaseUrl', 'API_BASE_URL', defaultApiBaseUrl),
            username                : pass('username', 'LOAD_USERNAME', 'user1'),
            password                : pass('password', 'LOAD_PASSWORD', 'password1'),
            'gatling.profile'       : pass('gatling.profile', 'GATLING_PROFILE', 'smoke'),
            'gatling.users'         : pass('gatling.users', 'GATLING_USERS', '1'),
            'gatling.duringSeconds' : pass('gatling.duringSeconds', 'GATLING_DURING_SECONDS', '30'),
            'gatling.p95Ms'         : pass('gatling.p95Ms', 'GATLING_P95_MS', '2000'),
            'gatling.allowPublic'   : pass('gatling.allowPublic', 'GATLING_ALLOW_PUBLIC', 'false'),
    ]
}
