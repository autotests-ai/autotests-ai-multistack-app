# Shared Java stack versions (SSOT) — backend + tests-java family
#
# Bump versions here first, then propagate into each consumer's
# `buildscript { ext { … } }` (same shape as tests-java ethалон):
# - backend: javaVersion, springBootVersion, springDependencyManagementVersion, slf4jVersion
#   → plugins "${…}"; ext['slf4j.version'] = slf4jVersion; toolchain of(javaVersion)
# - tests: javaVersion, junitVersion, slf4jVersion (+ tests-only pins below)
# - wrappers: gradle/wrapper/gradle-wrapper.properties
# - CI: JAVA_VERSION
#
# Skill `sync-gradle-ethalon` (shared keys); rule `java-stack-versions`.
# Do not ad-hoc bump a single consumer when the pin is listed below.

| Key | Value | `ext` name | Notes |
|-----|-------|------------|-------|
| `java` | `21` | `javaVersion` | toolchain + CI `JAVA_VERSION` |
| `gradle` | `9.6.0` | — (wrapper only) | `gradle-*-bin.zip`; Boot 4.1.1 accepts Gradle 8.14+ and 9.x — wrapper already in range, not bumped |
| `junit` | `6.1.3` | `junitVersion` | tests pin; backend via Boot starter-*-test (must match BOM `junit-jupiter.version`). Unified on 6.1.3: `worker_thread_pool` (bounded farm parallelism) exists only in 6.1+, kotlin schools moved 5.11.4 → 6.1.3 |
| `slf4j` | `2.0.20` | `slf4jVersion` | tests `slf4j-simple`; backend → `ext['slf4j.version']` (Boot 4.1.1 BOM) |
| `sonarqube` | `7.5.0.8588` | `sonarPluginVersion` | Gradle plugin `org.sonarqube`; backend + tests |
| `spring-boot` | `4.1.1` | `springBootVersion` | backend plugin; GA 2026-08-20. Not 4.2 (M1), not 4.0, not 3.5.x |
| `spring-dependency-management` | `1.1.7` | `springDependencyManagementVersion` | Boot 4.1.1 `spring-boot-gradle-plugin` still depends on 1.1.7 (Maven Central POM) — 4.1 line, not a leftover 3.x pin |
| `kotlin` | `2.4.21` | `kotlinVersion` | shared: `backend-kotlin-spring` plugins + `tests-kotlin-*` (junit5 + gatling/jmeter) `org.jetbrains.kotlin.jvm` plugin + ext. Latest stable (2.5.0-Beta1 is beta) |
| `datafaker` | `2.7.0` | `datafakerVersion` | tests pin (`net.datafaker`) |
