# prod — deployed stack behind host nginx; browsers come from the Selenoid hub.
# Matrix clone URL. Singlestack render rewrites to https://ai-first.autotests.ai/
# ./gradlew test -Denv=prod -DincludeTags='api & smoke'
# ./gradlew test -Denv=prod -DincludeTags='e2e & smoke' -DexcludeTags=screenshot
# SCREENSHOT_BROWSER=chrome ./gradlew test -Denv=prod -DincludeTags=screenshot
#
# Full debug run (video + VNC + all attachments):
#   -DenableVideo=true -DenableVnc=true -DattachVideo=true -DattachLastScreenshot=true \
#   -DattachPageSource=true -DattachBrowserConsoleLogs=true

# REST Assured → Allure HTML (ApiTestBase only; e2e TestBase does not apply)
enableAllureRestAssuredListener=true
allureRestAssuredListenerStyle=colored

# Target app
baseUrl=https://autotests.ai/stack/backend-java-spring/frontend-typescript-react

# REST API — origin only; tests and pages ask for /api/... themselves
apiBaseUrl=https://autotests.ai/stack/backend-java-spring/

# Browser configuration — Selenoid image tag (hub default 152.0; 151 + compat 148 still in catalog)
browserVersion=152.0
browserSize=1740x1080
headless=true

# Remote browser hub configuration (RemoteWebDriver / selenoid:options).
# Credentials are NOT committed: pass the full URL per run / from the CI secret
# SELENOID_WEBDRIVER_URL, e.g. -DremoteUrl=https://<user>:<password>@selenoid.qa.guru/wd/hub
remoteUrl=https://selenoid.qa.guru/wd/hub
videoFolder=https://selenoid.qa.guru/video/

# Console log
logToConsole=false
rootLogLevel=warn
