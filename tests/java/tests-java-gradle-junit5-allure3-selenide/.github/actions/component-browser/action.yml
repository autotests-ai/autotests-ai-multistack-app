name: component-browser layer
description: Catalog preview :3000 + Gradle testComponent for tests-java-gradle-junit5-allure3-selenide

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: tests/java/tests-java-gradle-junit5-allure3-selenide/**/*.gradle*

    - name: Catalog preview :3000
      shell: bash
      working-directory: frontend/_catalog/frontend-javascript-preview
      run: |
        python -m http.server 3000 &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:3000/components.html >/dev/null && exit 0
          sleep 1
        done
        echo "preview failed on :3000" >&2
        exit 1

    - name: Component browser (DS catalog)
      shell: bash
      working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide
      run: ./gradlew testComponent -Denv=reference_ci -DallureReportMode=none -Dheadless=true --no-daemon
