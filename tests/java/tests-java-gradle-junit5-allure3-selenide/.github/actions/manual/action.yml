name: manual layer
description: Gradle testManual stubs for tests-java-gradle-junit5-allure3-selenide

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: tests/java/tests-java-gradle-junit5-allure3-selenide/**/*.gradle*

    - name: Manual stubs
      shell: bash
      working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide
      run: ./gradlew testManual -Denv=reference_ci -DallureReportMode=none --no-daemon
