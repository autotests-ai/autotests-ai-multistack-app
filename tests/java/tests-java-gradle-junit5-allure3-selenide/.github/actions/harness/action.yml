name: harness
description: Tests-module helper checks (not a pyramid layer).
inputs:
  module_dir:
    required: true
  backend_lane:
    default: "false"
  frontend_lane:
    default: "false"
  tests_lane:
    default: "false"
outputs:
  slice:
    description: all or backend
    value: ${{ steps.slice.outputs.slice }}
runs:
  using: composite
  steps:
    - name: Select harness slice
      id: slice
      shell: bash
      env:
        LANE_BACKEND: ${{ inputs.backend_lane }}
        LANE_FRONTEND: ${{ inputs.frontend_lane }}
        LANE_TESTS: ${{ inputs.tests_lane }}
      run: |
        set -euo pipefail
        slice=all
        tags=harness
        if [ "$LANE_BACKEND" = "true" ] && [ "$LANE_FRONTEND" != "true" ] && [ "$LANE_TESTS" != "true" ]; then
          slice=backend
          tags=harness-backend
        fi
        echo "slice=${slice}" >> "$GITHUB_OUTPUT"
        echo "HARNESS_INCLUDE_TAGS=${tags}" >> "$GITHUB_ENV"
        echo "Harness slice=${slice} includeTags=${tags}"
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
    - uses: actions/cache@v6
      with:
        path: ${{ inputs.module_dir }}/.gradle/configuration-cache
        key: gradle-cc-tests-harness-${{ hashFiles('tests/java/tests-java-gradle-junit5-allure3-selenide/*.gradle*', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle/wrapper/gradle-wrapper.properties', 'tests/java/tests-java-gradle-junit5-allure3-selenide/gradle.properties') }}-${{ github.sha }}
        restore-keys: |
          gradle-cc-tests-harness-
    - name: Run harness tests (Gradle)
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification -Denv=ci -DincludeTags="${HARNESS_INCLUDE_TAGS}"
    - if: steps.run-tests.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-harness
        path: |
          ${{ inputs.module_dir }}/build/jacoco/**
          ${{ inputs.module_dir }}/build/reports/jacoco/**
          ${{ inputs.module_dir }}/build/classes/**
        if-no-files-found: error
