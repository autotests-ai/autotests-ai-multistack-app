name: integration layer
description: Gradle testIntegration (mount / layout) for tests-java-gradle-junit5-allure3-selenide

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: tests/java/tests-java-gradle-junit5-allure3-selenide/**/*.gradle*

    - name: Integration (mount / layout)
      shell: bash
      working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide
      run: ./gradlew testIntegration -Denv=reference_ci -DallureReportMode=none -Dheadless=true --no-daemon
