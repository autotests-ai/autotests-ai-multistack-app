name: e2e layer
description: Gradle testE2e smoke (local CI) for tests-java-gradle-junit5-allure3-selenide

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: tests/java/tests-java-gradle-junit5-allure3-selenide/**/*.gradle*

    - name: E2E smoke (local)
      shell: bash
      working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide
      run: ./gradlew testE2e -Denv=reference_ci_e2e -DallureReportMode=none -Dheadless=true --no-daemon
