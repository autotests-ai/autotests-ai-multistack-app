name: prod-e2e layer
description: Gradle testE2e against reference_prod_e2e (Selenoid) for tests-java-gradle-junit5-allure3-selenide

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: tests/java/tests-java-gradle-junit5-allure3-selenide/**/*.gradle*

    - name: Prod E2E smoke (Selenoid)
      shell: bash
      working-directory: tests/java/tests-java-gradle-junit5-allure3-selenide
      run: ./gradlew testE2e -Denv=reference_prod_e2e -DallureReportMode=none --no-daemon
