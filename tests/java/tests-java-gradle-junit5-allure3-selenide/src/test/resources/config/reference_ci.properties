# reference_ci — the compose stack on this machine (same one GitHub Actions brings up).
# ./gradlew test -Denv=reference_ci -DincludeTags=harness
# ./gradlew test -Denv=reference_ci -DincludeTags=api
# ./gradlew test -Denv=reference_ci -DincludeTags=e2e -DexcludeTags=visual
#
# Prerequisite for browser layers (api needs :8800; e2e needs :9811 + :8800): docker compose up -d
# UI :9811 (frontend-typescript-react)  API :8800/api/  — the prod path shape is host nginx only.
# Watch a run locally: -Dheadless=false   HAR in Allure: -DenableHar=true -DattachHarLogs=true

# Target app
baseUrl=http://localhost:9811/

# REST API — origin only; tests and pages ask for /api/... themselves
apiBaseUrl=http://localhost:8800/

# Browser configuration — local Chrome, no hub
browserSize=1920x1280
headless=true
