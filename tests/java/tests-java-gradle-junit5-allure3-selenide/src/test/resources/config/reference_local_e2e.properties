# Local e2e against published compose ports (no path router in compose).
# ./gradlew testE2e -Denv=reference_local_e2e
# Prerequisite: docker compose up -d
# UI: :8701/{frontend}/  API: :8800/api/  (prod path shape is host nginx only)

baseUrl=http://localhost:8701/frontend-typescript-react/
apiBaseUrl=http://localhost:8800/api/
componentCatalogUrl=http://localhost:3000/

browser=chrome
browserVersion=148.0
browserSize=1920x1280
headless=true
closeBrowserAfterEach=true
closeBrowserAfterAll=true

enableHar=false
enableVnc=false
enableVideo=false

logToConsole=true
selenideLogToConsole=true
rootLogLevel=info
