# reference_prod_full — e2e (@Layer(e2e) — smoke via testE2e)
# ./gradlew testE2e -Denv=reference_prod_full_e2e

# Allow attachments after each test
attachBrowserConsoleLogs=true
attachHarLogs=true
attachLastScreenshot=true
attachPageSource=true
attachVideo=true
# Allow allure steps listener
enableAllureSelenideListener=true

# Target app
baseUrl=https://reference-app-copy.autotests.ai/backend-java-spring/frontend-typescript-react/

# REST API
apiBaseUrl=https://reference-app-copy.autotests.ai/backend-java-spring/api/

# Browser configuration
browser=chrome
browserVersion=148.0
browserSize=1740x1080
headless=true
closeBrowserAfterEach=true
closeBrowserAfterAll=true

# Remote browser hub configuration
enableHar=true
enableVnc=true
enableVideo=true
videoFolder=https://selenoid.qa.guru/video/
remoteUrl=https://user1:1234@selenoid.qa.guru/wd/hub

# Console log
logToConsole=true
selenideLogToConsole=true
rootLogLevel=info
