# reference_prod_full — visual (CI slice: @Layer(e2e) + @Tag(visual))
# ./gradlew testVisual -DpyramidStand=reference_prod_full

# Allow attachments after each test
attachBrowserConsoleLogs=false
attachHarLogs=false
attachLastScreenshot=false
attachPageSource=false
attachVideo=false
# Allow allure steps listener
enableAllureSelenideListener=false

# Target app
baseUrl=https://backend-java-spring.reference-app-copy.autotests.ai/frontend-typescript-react/
componentCatalogUrl=http://localhost:3000/

# REST API
apiBaseUrl=https://reference-app.autotests.ai/

# Browser configuration
browser=chrome
browserVersion=148.0
browserSize=1740x1080
headless=true
closeBrowserAfterEach=false
closeBrowserAfterAll=true

# Remote browser hub configuration
enableHar=false
enableVnc=true
enableVideo=true
videoFolder=https://selenoid.qa.guru/video/
remoteUrl=https://user1:1234@selenoid.qa.guru/wd/hub

# Visual baselines
updateBaselines=false
baselinesDir=screenshots
visualDiffThreshold=0.015

# Console log
logToConsole=true
selenideLogToConsole=true
rootLogLevel=info
