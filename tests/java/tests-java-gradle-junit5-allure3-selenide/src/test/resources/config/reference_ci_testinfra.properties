# reference_ci — testinfra slice (pure Java — tests.testinfra.* / @Layer test-infra, @Tag test-infra)
# ./gradlew testInfra -Denv=reference_ci_testinfra

# Allure report
allureReportMode=none
allureAgentMode=none

# Allow attachments after each test
attachBrowserConsoleLogs=false
attachHarLogs=false
attachLastScreenshot=false
attachPageSource=false
attachVideo=false
# Allow allure steps listener
enableAllureSelenideListener=false

# Target app
baseUrl=http://localhost:9811/

# REST API
apiBaseUrl=http://localhost:8800/api/

# Browser configuration
browser=chrome
browserVersion=148.0
browserSize=1920x1280
headless=true
closeBrowserAfterAll=true

# Remote browser hub configuration
enableHar=false
enableVnc=false
enableVideo=false
# videoFolder=
# remoteUrl=

# Console log
logToConsole=true
selenideLogToConsole=true
rootLogLevel=info
