# Owner fallbacks. Which API: config/${env}.properties.
# Farms (Selenoid / BrowserStack) live here together — same kind of host.

backendId=backend-java-spring

# Local Appium
appiumUrl=http://127.0.0.1:4723/wd/hub

# Selenoid farm (Android only)
selenoidUrl=https://user1:1234@selenoid.qa.guru/wd/hub
android.app.url=https://github.com/autotests-ai/autotests-ai-multistack-app/releases/download/apk/multistack-app.apk

# BrowserStack farm
browserstackUrl=https://hub.browserstack.com/wd/hub
browserstack.user=${BROWSERSTACK_USERNAME}
browserstack.key=${BROWSERSTACK_ACCESS_KEY}
browserstack.app=${BROWSERSTACK_APP_ID}
browserstack.ios.app=${BROWSERSTACK_IOS_APP_ID}
browserstack.device=Google Pixel 7
browserstack.osVersion=13.0
browserstack.ios.device=iPhone 15
browserstack.ios.osVersion=17
