# ci — the compose stack on this machine (same one GitHub Actions brings up).
# ./gradlew test -Denv=ci -DincludeTags=infra
# ./gradlew test -Denv=ci -DincludeTags=api
# HTTP-only school — no e2e / browser. Sibling Retrofit 2: tests-java-gradle-junit5-allure3-retrofit2.
#
# Prerequisite: docker compose up -d (backend :8800).

# REST Assured → Allure HTML
enableAllureRestAssuredListener=true
allureRestAssuredListenerStyle=colored

# Target app — ci gateway (SPA at /, real backend at /api)
baseUrl=http://localhost:9821

# REST API — direct backend origin; tests append /api/... themselves
apiBaseUrl=http://localhost:8800/

# Browser configuration — local Chrome, no hub
browserSize=1920x1280
headless=true
