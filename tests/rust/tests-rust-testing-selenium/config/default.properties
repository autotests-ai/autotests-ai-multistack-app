# Runtime defaults — values match TestConfig.cs (Owner-file shape).
# Env profiles (config/${stand}.properties) override where we point.

allureReportMode=allure3
enableAllureRestAssuredListener=false

# Target app (HTTP stand, no trailing slash)
baseUrl=

# REST API (empty → fail fast)
apiBaseUrl=
apiHealthService=backend-java-spring
welcomeUsername=user1

# Browser — Chrome-only cell (local Chrome for Testing or Selenoid chrome).
browser=chrome
browserVersion=148
browserSize=1920x1280
headless=false
closeBrowserAfterEach=true
closeBrowserAfterAll=true
skipBlankOpen=false

enableHar=false
enableVnc=false
enableVideo=false
remoteUrl=
videoFolder=

updateScreenshots=false
screenshotsDir=screenshots
screenshotDiffThreshold=0.015
