name: e2e Playwright
description: npm ci + Playwright chromium smoke for tests-javascript-playwright

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: tests/javascript/tests-javascript-playwright/package-lock.json

    - name: Install + Playwright e2e
      shell: bash
      working-directory: tests/javascript/tests-javascript-playwright
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npm test
