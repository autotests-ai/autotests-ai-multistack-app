name: infra
description: Tests-module helper checks (Playwright --grep @infra; not a pyramid layer).
inputs:
  module_dir:
    required: true
  backend_lane:
    default: "false"
  frontend_lane:
    default: "false"
  tests_lane:
    default: "false"
outputs:
  slice:
    description: all or backend
    value: ${{ steps.slice.outputs.slice }}
runs:
  using: composite
  steps:
    - name: Select infra slice
      id: slice
      shell: bash
      env:
        LANE_BACKEND: ${{ inputs.backend_lane }}
        LANE_FRONTEND: ${{ inputs.frontend_lane }}
        LANE_TESTS: ${{ inputs.tests_lane }}
      run: |
        set -euo pipefail
        slice=all
        grep='@infra'
        include='src/helpers/env.js src/helpers/api.js src/helpers/har-collect.js'
        if [ "$LANE_BACKEND" = "true" ] && [ "$LANE_FRONTEND" != "true" ] && [ "$LANE_TESTS" != "true" ]; then
          slice=backend
          grep='@infra_backend'
          include='src/helpers/env.js src/helpers/api.js'
        fi
        echo "slice=${slice}" >> "$GITHUB_OUTPUT"
        echo "INFRA_GREP=${grep}" >> "$GITHUB_ENV"
        echo "INFRA_INCLUDE=${include}" >> "$GITHUB_ENV"
        echo "Infra slice=${slice} --grep ${grep}"
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: ${{ inputs.module_dir }}/package-lock.json
    - name: Install npm dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: npm ci
    - name: Run infra tests (Playwright + c8)
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: |
        set -euo pipefail
        # Coverage of helpers only — no fail-under (not coverage theatre).
        include_args=()
        for f in ${INFRA_INCLUDE}; do
          if [ -f "$f" ]; then
            include_args+=(--include="$f")
          fi
        done
        if [ ${#include_args[@]} -eq 0 ]; then
          echo "STOP: no infra include files under ${PWD}" >&2
          exit 1
        fi
        npx c8 "${include_args[@]}" --reporter=lcov --reporter=text --report-dir=coverage \
          npx playwright test --grep "${INFRA_GREP}"
    - if: steps.run-tests.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-infra
        path: ${{ inputs.module_dir }}/coverage/lcov.info
        if-no-files-found: error
