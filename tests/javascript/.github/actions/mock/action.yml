name: mock
description: STOP — no mock layer in the JavaScript tests family.
inputs:
  module_dir:
    required: true
  frontend_dir:
    required: false
    default: ''
  update_screenshots:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODULE_DIR: ${{ inputs.module_dir }}
      run: |
        echo "STOP: no mock layer in tests/javascript (${MODULE_DIR:-unset})" >&2
        exit 1
