# Runtime defaults — values match TestConfig.cs (Owner-file shape).
# Env profiles (config/${stand}.properties) override where we point.

allureReportMode=allure3
enableAllureRestAssuredListener=false

# Target app (HTTP stand, no trailing slash)
baseUrl=

# REST API (empty → fail fast)
apiBaseUrl=
apiHealthService=backend-java-spring
welcomeUsername=user1

# Browser — Chromium-only cell (local Chrome for Testing). Remote WS ignores browserVersion
# (image is in the wss://…/playwright-chromium/<tag> URL).
browser=chrome
browserVersion=148
browserSize=1920x1280
headless=false
closeBrowserAfterEach=true
closeBrowserAfterAll=true
skipBlankOpen=false

# Client-side HAR is not wired in this cell (Java Playwright has HarCapture).
enableHar=false

# Remote Playwright hub (SELENOID_PLAYWRIGHT_URL / wss://…/playwright-chromium/…)
enableVnc=false
enableVideo=false
remoteUrl=
# Public Selenoid video base for Allure (hub sessions).
videoFolder=

updateScreenshots=false
screenshotsDir=screenshots
screenshotDiffThreshold=0.015
