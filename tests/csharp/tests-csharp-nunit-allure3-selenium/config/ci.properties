# ci — the compose stack on this machine.
# STAND=ci dotnet test --filter TestCategory=infra
# STAND=ci dotnet test --filter TestCategory=api
# STAND=ci dotnet test --filter "TestCategory=e2e&TestCategory!=screenshot"
#
# Prerequisite: docker compose up -d (backend :8800, stand-gateway-ci :9821).

enableAllureRestAssuredListener=true

# Target app — ci gateway (SPA at /, real backend at /api)
baseUrl=http://localhost:9821

# REST API — direct backend origin; tests append /api/... themselves
apiBaseUrl=http://localhost:8800/

browserSize=1920x1280
headless=true
