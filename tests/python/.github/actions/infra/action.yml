name: infra
description: Tests-module helper checks (pytest -m infra; not a pyramid layer).
inputs:
  module_dir:
    required: true
  backend_lane:
    default: "false"
  frontend_lane:
    default: "false"
  tests_lane:
    default: "false"
outputs:
  slice:
    description: all or backend
    value: ${{ steps.slice.outputs.slice }}
runs:
  using: composite
  steps:
    - name: Select infra slice
      id: slice
      shell: bash
      env:
        LANE_BACKEND: ${{ inputs.backend_lane }}
        LANE_FRONTEND: ${{ inputs.frontend_lane }}
        LANE_TESTS: ${{ inputs.tests_lane }}
      run: |
        set -euo pipefail
        slice=all
        tags=infra
        if [ "$LANE_BACKEND" = "true" ] && [ "$LANE_FRONTEND" != "true" ] && [ "$LANE_TESTS" != "true" ]; then
          slice=backend
          tags=infra_backend
        fi
        echo "slice=${slice}" >> "$GITHUB_OUTPUT"
        echo "INFRA_MARKER=${tags}" >> "$GITHUB_ENV"
        echo "Infra slice=${slice} -m ${tags}"
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.module_dir }}/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: python -m pip install -r requirements.txt
    - name: Run infra tests (pytest)
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: |
        set -euo pipefail
        # Coverage of helpers only — no fail-under (not coverage theatre).
        # Skip missing modules so HTTP-only httpx (no har_capture) can reuse this action.
        cov=()
        want=(config api_client)
        if [ "${INFRA_MARKER}" = "infra" ]; then
          want+=(har_capture)
        fi
        for m in "${want[@]}"; do
          if [ -f "${m}.py" ]; then
            cov+=(--cov="${m}")
          fi
        done
        python -m pytest -m "${INFRA_MARKER}" \
          "${cov[@]}" \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing \
          --alluredir=allure-results
    - if: steps.run-tests.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-infra
        path: ${{ inputs.module_dir }}/coverage.xml
        if-no-files-found: error
