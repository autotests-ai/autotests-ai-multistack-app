name: manual
description: Manual-tagged stubs against a live stand (pytest -m manual).
inputs:
  module_dir:
    required: true
  stand:
    default: prod
runs:
  using: composite
  steps:
    - name: Wait for live UI
      shell: bash
      run: |
        set -euo pipefail
        ui="https://${PUBLIC_HOST}/${STACK_MOUNT}/backend-${BACKEND_LANG}-${BACKEND_FRAMEWORK}/frontend-${FRONTEND_LANG}-${FRONTEND_FRAMEWORK}/"
        echo "==> UI ${ui}"
        curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${ui}"
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.module_dir }}/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: python -m pip install -r requirements.txt
    - name: Install Playwright Chromium (when the cell uses Playwright)
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: |
        set -euo pipefail
        if python -c "import playwright" >/dev/null 2>&1 && [ -z "${SELENOID_PLAYWRIGHT_URL:-}" ]; then
          python -m playwright install chromium
        fi
    - name: Run manual tests (pytest)
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
        STAND: ${{ inputs.stand }}
        BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/frontend-${{ env.FRONTEND_LANG }}-${{ env.FRONTEND_FRAMEWORK }}/
        API_BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/
      run: |
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl python -m pytest -m manual --alluredir="${ALLURE_RESULTS}"
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-manual
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
