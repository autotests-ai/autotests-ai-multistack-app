name: e2e
description: Selenium browser layer against a live stand.
inputs:
  module_dir:
    required: true
  stand:
    required: true
  include_tags:
    default: ""
  exclude_tags:
    default: ""
  run_e2e:
    default: "false"
  run_screenshot:
    default: "false"
  update_screenshots:
    default: "false"
runs:
  using: composite
  steps:
    - name: Wait for live UI
      shell: bash
      run: |
        set -euo pipefail
        ui="https://${PUBLIC_HOST}/${STACK_MOUNT}/backend-${BACKEND_LANG}-${BACKEND_FRAMEWORK}/frontend-${FRONTEND_LANG}-${FRONTEND_FRAMEWORK}/"
        echo "==> UI ${ui}"
        curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${ui}"
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.module_dir }}/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: python -m pip install -r requirements.txt
    - name: Run e2e tests (pytest + Selenium)
      if: >-
        github.event_name == 'push' ||
        inputs.run_e2e == 'true' ||
        inputs.include_tags != '' ||
        inputs.exclude_tags != '' ||
        github.event_name != 'workflow_dispatch'
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
        STAND: ${{ inputs.stand }}
        BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/frontend-${{ env.FRONTEND_LANG }}-${{ env.FRONTEND_FRAMEWORK }}/
        API_BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/
        API_HEALTH_SERVICE: backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}
        REMOTE_URL: ${{ env.SELENOID_REMOTE_URL }}
        HEADLESS: "true"
        INCLUDE_TAGS: ${{ inputs.include_tags }}
        EXCLUDE_TAGS: ${{ inputs.exclude_tags }}
      run: |
        set -euo pipefail
        if [ -n "${INCLUDE_TAGS}" ]; then
          MARKER="${INCLUDE_TAGS}"
        else
          MARKER="e2e"
        fi
        if [ -n "${EXCLUDE_TAGS}" ]; then
          IFS=',' read -ra parts <<< "${EXCLUDE_TAGS}"
          for p in "${parts[@]}"; do
            p="${p// /}"
            [ -n "$p" ] && MARKER="${MARKER} and not ${p}"
          done
        else
          MARKER="${MARKER} and not mock and not screenshot"
        fi
        echo "==> pytest -m '${MARKER}'"
        eval "${ALLURECTL_RUN:-true}"
        if declare -F run_with_allurectl >/dev/null; then
          run_with_allurectl python -m pytest -m "${MARKER}" --alluredir="${ALLURE_RESULTS}"
        else
          python -m pytest -m "${MARKER}" --alluredir="${ALLURE_RESULTS}"
        fi
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-e2e${{ inputs.stand == 'stage' && '-stage' || '' }}
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
