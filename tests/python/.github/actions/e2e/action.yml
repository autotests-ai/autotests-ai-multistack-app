name: e2e
description: Selenium browser layer against a live stand.
inputs:
  module_dir:
    required: true
  stand:
    required: true
  include_tags:
    default: ""
  exclude_tags:
    default: ""
  run_e2e:
    default: "false"
  run_screenshot:
    default: "false"
  update_screenshots:
    default: "false"
runs:
  using: composite
  steps:
    - name: Wait for live UI
      shell: bash
      run: |
        set -euo pipefail
        ui="https://${PUBLIC_HOST}/${STACK_MOUNT}/backend-${BACKEND_LANG}-${BACKEND_FRAMEWORK}/frontend-${FRONTEND_LANG}-${FRONTEND_FRAMEWORK}/"
        echo "==> UI ${ui}"
        curl -fsS --retry 30 --retry-delay 2 --retry-all-errors "${ui}"
    - uses: ./.github/actions/setup-allurectl
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: ${{ inputs.module_dir }}/requirements.txt
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      run: python -m pip install -r requirements.txt
    - name: Run e2e tests (pytest + Selenium)
      if: >-
        github.event_name == 'push' ||
        inputs.run_e2e == 'true' ||
        inputs.include_tags != '' ||
        inputs.exclude_tags != '' ||
        github.event_name != 'workflow_dispatch'
      id: run-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
        STAND: ${{ inputs.stand }}
        BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/frontend-${{ env.FRONTEND_LANG }}-${{ env.FRONTEND_FRAMEWORK }}/
        API_BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/
        API_HEALTH_SERVICE: backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}
        HEADLESS: "true"
        INCLUDE_TAGS: ${{ inputs.include_tags }}
        EXCLUDE_TAGS: ${{ inputs.exclude_tags }}
      run: |
        set -euo pipefail
        if [ -n "${INCLUDE_TAGS}" ]; then
          MARKER="${INCLUDE_TAGS}"
        else
          MARKER="e2e"
        fi
        if [ -n "${EXCLUDE_TAGS}" ]; then
          IFS=',' read -ra parts <<< "${EXCLUDE_TAGS}"
          for p in "${parts[@]}"; do
            p="${p// /}"
            [ -n "$p" ] && MARKER="${MARKER} and not ${p}"
          done
        else
          MARKER="${MARKER} and not mock and not screenshot"
        fi
        echo "==> pytest -m '${MARKER}'"
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl python -m pytest -m "${MARKER}" --alluredir="${ALLURE_RESULTS}"
    - name: Stash e2e Allure results
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        STASH="${{ inputs.module_dir }}/allure-results-e2e-stash"
        SRC="${{ inputs.module_dir }}/allure-results"
        mkdir -p "$STASH"
        if [ -d "$SRC" ]; then cp -R "$SRC/." "$STASH/"; fi
    - name: Run screenshot compare (pytest)
      if: >-
        always() && !cancelled() &&
        (inputs.run_screenshot == 'true' || inputs.stand == 'stage') &&
        inputs.update_screenshots != 'true'
      id: run-screenshot-tests
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
        STAND: ${{ inputs.stand }}
        BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/frontend-${{ env.FRONTEND_LANG }}-${{ env.FRONTEND_FRAMEWORK }}/
        API_BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/
        API_HEALTH_SERVICE: backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}
        HEADLESS: "true"
        SCREENSHOT_OS: linux
        SCREENSHOT_BROWSER: chrome
      run: |
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl python -m pytest -m screenshot --alluredir="${ALLURE_RESULTS}"
    - name: Update screenshots
      if: always() && !cancelled() && inputs.update_screenshots == 'true'
      shell: bash
      working-directory: ${{ inputs.module_dir }}
      env:
        ALLURE_RESULTS: ${{ github.workspace }}/${{ inputs.module_dir }}/allure-results
        STAND: ${{ inputs.stand }}
        BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/frontend-${{ env.FRONTEND_LANG }}-${{ env.FRONTEND_FRAMEWORK }}/
        API_BASE_URL: https://${{ env.PUBLIC_HOST }}/${{ env.STACK_MOUNT }}/backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}/
        API_HEALTH_SERVICE: backend-${{ env.BACKEND_LANG }}-${{ env.BACKEND_FRAMEWORK }}
        HEADLESS: "true"
        SCREENSHOT_OS: linux
        SCREENSHOT_BROWSER: chrome
        UPDATE_SCREENSHOTS: "true"
      run: |
        source "${GITHUB_WORKSPACE}/.github/actions/setup-allurectl/allurectl-run.sh"
        run_with_allurectl python -m pytest -m screenshot --alluredir="${ALLURE_RESULTS}"
    - name: Merge Allure results
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        STASH="${{ inputs.module_dir }}/allure-results-e2e-stash"
        DEST="${{ inputs.module_dir }}/allure-results"
        mkdir -p "$DEST"
        if [ -d "$STASH" ]; then cp -R "$STASH/." "$DEST/"; fi
    - name: Publish screenshot PNGs
      if: always() && inputs.update_screenshots == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.stand }}-screenshot-pngs
        path: ${{ inputs.module_dir }}/src/test/resources/screenshots/
        if-no-files-found: ignore
    - name: Publish raw Allure results
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: allure-results-e2e${{ inputs.stand == 'stage' && '-stage' || '' }}
        path: ${{ inputs.module_dir }}/allure-results/**
        if-no-files-found: ignore
        retention-days: 1
