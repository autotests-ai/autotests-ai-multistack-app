[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --alluredir=allure-results
markers =
    api: HTTP contract against a live stand (LAYERS.md)
    e2e: UI through a real browser
    mock: UI on stub API (inside e2e, not a pyramid layer)
    screenshot: PNG compare (inside e2e, not a pyramid layer)
    manual: exploratory stubs in code
    harness: tests-module helpers (not a pyramid layer)
    harness_backend: ConfigReader analog
    harness_frontend: HAR / browser helper checks
    smoke: smoke scenarios
    positive: happy path
    negative: validation / error paths
