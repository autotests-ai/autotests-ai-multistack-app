[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --alluredir=allure-results
markers =
    api: HTTP contract against a live stand (LAYERS.md)
    ui: Browser SPA on stub API (mock stand)
    e2e: Full path through a live backend
    mock: UI slice — WireMock mount / error injection (inside ui, not a pyramid layer)
    screenshot: PNG compare (slice on ui or e2e, not a pyramid layer)
    manual: exploratory stubs in code
    infra: tests-module helpers (not a pyramid layer)
    infra_backend: ConfigReader analog
    infra_frontend: HAR / browser helper checks
    smoke: smoke scenarios
    positive: happy path
    negative: validation / error paths
