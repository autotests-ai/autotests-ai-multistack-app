name: e2e Python Selenium
description: pip install + pytest smoke for tests-python-selenium

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tests/python/tests-python-selenium/requirements.txt

    - name: Install + pytest smoke
      shell: bash
      working-directory: tests/python/tests-python-selenium
      run: |
        python -m pip install -r requirements.txt
        python -m pytest -m smoke
