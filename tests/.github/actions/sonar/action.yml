name: sonar
description: Dispatch sonar to the active tests language (module_dir).
inputs:
  module_dir:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.TESTS_LANG == 'java'
      uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/sonar
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.TESTS_LANG == 'javascript'
      uses: ./tests/javascript/.github/actions/sonar
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.TESTS_LANG == 'python'
      uses: ./tests/python/.github/actions/sonar
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.TESTS_LANG == 'typescript'
      uses: ./tests/typescript/.github/actions/sonar
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: >-
        env.TESTS_LANG != 'java' &&
        env.TESTS_LANG != 'javascript' &&
        env.TESTS_LANG != 'python' &&
        env.TESTS_LANG != 'typescript'
      shell: bash
      run: |
        echo "STOP: no sonar action for TESTS_LANG=${TESTS_LANG:-unset}" >&2
        exit 1
