name: harness
description: Dispatch harness to the active tests language (module_dir).
inputs:
  module_dir:
    required: true
  backend_lane:
    required: false
    default: 'false'
  frontend_lane:
    required: false
    default: 'false'
  tests_lane:
    required: false
    default: 'false'
outputs:
  slice:
    description: all or backend
    value: ${{ steps.module.outputs.slice || steps.python.outputs.slice }}
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.TESTS_LANG == 'java'
      id: module
      uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/harness
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        backend_lane: ${{ inputs.backend_lane }}
        frontend_lane: ${{ inputs.frontend_lane }}
        tests_lane: ${{ inputs.tests_lane }}
    - if: env.TESTS_LANG == 'javascript'
      uses: ./tests/javascript/.github/actions/harness
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        backend_lane: ${{ inputs.backend_lane }}
        frontend_lane: ${{ inputs.frontend_lane }}
        tests_lane: ${{ inputs.tests_lane }}
    - if: env.TESTS_LANG == 'python'
      id: python
      uses: ./tests/python/.github/actions/harness
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        backend_lane: ${{ inputs.backend_lane }}
        frontend_lane: ${{ inputs.frontend_lane }}
        tests_lane: ${{ inputs.tests_lane }}
    - if: >-
        env.TESTS_LANG != 'java' &&
        env.TESTS_LANG != 'javascript' &&
        env.TESTS_LANG != 'python'
      shell: bash
      run: |
        echo "STOP: no harness action for TESTS_LANG=${TESTS_LANG:-unset}" >&2
        exit 1
