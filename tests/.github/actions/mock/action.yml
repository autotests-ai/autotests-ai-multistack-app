name: mock
description: Dispatch mock to the active tests language (module_dir).
inputs:
  module_dir:
    required: true
  frontend_dir:
    required: false
    default: ''
  update_screenshots:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - id: fe
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.frontend_dir }}
    # Java adapter lives in the canon selenide module; module_dir is the active cell.
    - if: env.TESTS_LANG == 'java'
      uses: ./tests/java/tests-java-junit5-rest_assured-selenide/.github/actions/mock
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        frontend_dir: ${{ steps.fe.outputs.dir }}
        update_screenshots: ${{ inputs.update_screenshots }}
    - if: env.TESTS_LANG == 'javascript'
      uses: ./tests/javascript/.github/actions/mock
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        frontend_dir: ${{ steps.fe.outputs.dir }}
        update_screenshots: ${{ inputs.update_screenshots }}
    - if: env.TESTS_LANG == 'python'
      uses: ./tests/python/.github/actions/mock
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        frontend_dir: ${{ steps.fe.outputs.dir }}
        update_screenshots: ${{ inputs.update_screenshots }}
    - if: env.TESTS_LANG == 'typescript'
      uses: ./tests/typescript/.github/actions/mock
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        frontend_dir: ${{ steps.fe.outputs.dir }}
        update_screenshots: ${{ inputs.update_screenshots }}
    - if: >-
        env.TESTS_LANG != 'java' &&
        env.TESTS_LANG != 'javascript' &&
        env.TESTS_LANG != 'python' &&
        env.TESTS_LANG != 'typescript'
      shell: bash
      run: |
        echo "STOP: no mock action for TESTS_LANG=${TESTS_LANG:-unset}" >&2
        exit 1
