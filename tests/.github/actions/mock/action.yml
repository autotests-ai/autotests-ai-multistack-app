name: mock
description: Dispatch mock to the active module (module_dir).
inputs:
  module_dir:
    required: true
  frontend_dir:
    required: false
    default: ''
  update_screenshots:
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - id: fe
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.frontend_dir }}
    - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/mock
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        frontend_dir: ${{ steps.fe.outputs.dir }}
        update_screenshots: ${{ inputs.update_screenshots }}
