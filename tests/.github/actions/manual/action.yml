name: manual
description: Dispatch manual to the active module (module_dir).
inputs:
  module_dir:
    required: true
  stand:
    required: false
    default: 'prod'
runs:
  using: composite
  steps:
    - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/manual
      with:
        module_dir: ${{ inputs.module_dir }}
        stand: ${{ inputs.stand }}
