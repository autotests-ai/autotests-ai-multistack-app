name: manual
description: Dispatch manual to the active tests language (module_dir).
inputs:
  module_dir:
    required: true
  stand:
    required: false
    default: 'prod'
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.TESTS_LANG == 'java'
      uses: ./tests/java/tests-java-junit5-rest_assured-selenide/.github/actions/manual
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        stand: ${{ inputs.stand }}
    - if: env.TESTS_LANG == 'javascript'
      uses: ./tests/javascript/.github/actions/manual
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        stand: ${{ inputs.stand }}
    - if: env.TESTS_LANG == 'python'
      uses: ./tests/python/.github/actions/manual
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        stand: ${{ inputs.stand }}
    - if: env.TESTS_LANG == 'typescript'
      uses: ./tests/typescript/.github/actions/manual
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
        stand: ${{ inputs.stand }}
    - if: >-
        env.TESTS_LANG != 'java' &&
        env.TESTS_LANG != 'javascript' &&
        env.TESTS_LANG != 'python' &&
        env.TESTS_LANG != 'typescript'
      shell: bash
      run: |
        echo "STOP: no manual action for TESTS_LANG=${TESTS_LANG:-unset}" >&2
        exit 1
