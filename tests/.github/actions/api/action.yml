name: api
description: Dispatch api to the active module (module_dir).
inputs:
  module_dir:
    required: true
  stand:
    required: true
runs:
  using: composite
  steps:
    - uses: ./tests/java/tests-java-gradle-junit5-allure3-selenide/.github/actions/api
      with:
        module_dir: ${{ inputs.module_dir }}
        stand: ${{ inputs.stand }}
