name: load
description: >-
  Dispatch load smoke to the active load cell. Knobs LOAD_LANG + LOAD_TOOL
  (etalon java+jmeter). Not a named jmeter/gatling job. Unknown TOOL → STOP.
inputs:
  module_dir:
    required: true
  stand:
    required: true
runs:
  using: composite
  steps:
    - id: dir
      uses: ./.github/actions/resolve-module-dir
      with:
        module_dir: ${{ inputs.module_dir }}
    - if: env.LOAD_TOOL == 'jmeter'
      uses: ./tests/.github/actions/performance
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.LOAD_TOOL == 'gatling'
      uses: ./tests/.github/actions/gatling
      with:
        module_dir: ${{ steps.dir.outputs.dir }}
    - if: env.LOAD_TOOL != 'jmeter' && env.LOAD_TOOL != 'gatling'
      shell: bash
      run: |
        echo "STOP: no load action for LOAD_TOOL=${LOAD_TOOL:-unset} stand=${{ inputs.stand }}" >&2
        exit 1
