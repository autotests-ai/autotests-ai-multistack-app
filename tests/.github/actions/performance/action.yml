name: performance
description: Dispatch load smoke to a JMeter cell (JMX / Kotlin DSL / Groovy). Not Gatling.
inputs:
  module_dir:
    required: false
    default: tests/java/tests-java-jmeter
runs:
  using: composite
  steps:
    # GitHub Actions expressions have no replace(); basename is the artifact id.
    - id: art
      shell: bash
      run: echo "name=jmeter-$(basename "${{ inputs.module_dir }}")" >> "$GITHUB_OUTPUT"
    # GitHub does not interpolate `uses:`; the Java smoke action is the runner.
    # It only `cd`s into module_dir and runs `./gradlew jmeterSmoke`.
    - uses: ./tests/java/tests-java-jmeter/.github/actions/smoke
      with:
        module_dir: ${{ inputs.module_dir }}
        artifact_name: ${{ steps.art.outputs.name }}
