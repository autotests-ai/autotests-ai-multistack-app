name: performance
description: Dispatch load smoke to the etalon JMeter JMX cell (not Gatling).
inputs:
  module_dir:
    required: false
    default: tests/java/tests-java-jmeter
runs:
  using: composite
  steps:
    - uses: ./tests/java/tests-java-jmeter/.github/actions/smoke
      with:
        module_dir: tests/java/tests-java-jmeter
