# Defaults for local / CI override via SONAR_PROJECT_KEY.
sonar.projectKey=autotests-ai-multistack-app-tests-typescript-playwright
sonar.projectName=autotests-ai-multistack-app-tests-typescript-playwright
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/allure-results/**,**/test-results/**,**/coverage/**
# Same allow-list idea as Java JaCoCo/Sonar (ConfigReader, not HarCapture/pages):
# only helpers the harness actually measures to the quality-gate floor.
sonar.inclusions=**/helpers/env.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
