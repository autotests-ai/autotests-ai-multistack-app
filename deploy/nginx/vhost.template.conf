# Generated from deploy/matrix.yaml — do not edit by hand; run render_vhosts.py
# Single public host; path /{backend}/api and /{backend}/frontend-* .

__BACKEND_UPSTREAMS__
__WEB_UPSTREAM__

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __PUBLIC_HOST__;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/__PUBLIC_HOST__.access.log;
    error_log  /var/log/nginx/__PUBLIC_HOST__.error.log;

__BACKEND_API_LOCATIONS__
    location ~ ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ /$1 break;
        proxy_pass http://web_static;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
