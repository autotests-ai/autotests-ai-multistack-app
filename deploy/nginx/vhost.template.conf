# Generated from deploy/matrix.yaml — retire host → 301 autotests.ai/stack/…
# No upstreams here — product proxy lives on autotests.ai vhost.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __PUBLIC_HOST__ reference-app.autotests.ai;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/__PUBLIC_HOST__.access.log;
    error_log  /var/log/nginx/__PUBLIC_HOST__.error.log;

    location = / {
        return 301 https://autotests.ai/stack/;
    }
    location / {
        return 301 https://autotests.ai/stack$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__ reference-app.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
