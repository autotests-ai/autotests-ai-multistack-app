# Generated from deploy/matrix.yaml — do not edit by hand; run render-vhosts.py
# Placeholders: __BACKEND_ID__ __PUBLIC_HOST__ __API_PORT__ __WEB_PORT__

upstream __BACKEND_ID___api {
    server 127.0.0.1:__API_PORT__;
    keepalive 8;
}

upstream __BACKEND_ID___web {
    server 127.0.0.1:__WEB_PORT__;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name __PUBLIC_HOST__;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/__PUBLIC_HOST__.access.log;
    error_log  /var/log/nginx/__PUBLIC_HOST__.error.log;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://__BACKEND_ID___api/api/;
    }

    location /frontend- {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://__BACKEND_ID___web;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
