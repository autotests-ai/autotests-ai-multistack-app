server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name reference-app-copy.autotests.ai;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/reference-app-copy.autotests.ai.access.log;
    error_log  /var/log/nginx/reference-app-copy.autotests.ai.error.log;

    location = /backend-java-spring/api {
        return 301 /backend-java-spring/api/;
    }
    location /backend-java-spring/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_java_spring_api/api/;
    }

