# Generated from deploy/matrix.yaml — /stack assets + bounce bare /stack/ to the default pair.
# Defaults SSOT: frontend/_shared/stack-matrix.ts (DEFAULT_STACK_BACKEND / DEFAULT_STACK_FRONTEND).
# Include inside autotests.ai server { } BEFORE autotests.ai-stack-routes.conf.

    location = /stack {
        return 301 /stack/backend-java-spring/frontend-typescript-react/;
    }

    location = /stack/ {
        return 301 /stack/backend-java-spring/frontend-typescript-react/;
    }

    location = /stack/index.html {
        return 301 /stack/backend-java-spring/frontend-typescript-react/;
    }

    location = /stack/login {
        return 301 /stack/backend-java-spring/frontend-typescript-react/login;
    }

    location = /stack/register {
        return 301 /stack/backend-java-spring/frontend-typescript-react/register;
    }

    # Leftover in-app /stack/{pair}/stack → pair home (header Stack is the pair, not …/stack).
    location ~ ^(/stack/backend-[^/]+/frontend-[^/]+)/stack/?$ {
        return 301 $1/;
    }

    location ~ ^/stack/matrix\.json$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_typescript_react;
    }

    location ~ ^/stack/(js/|css/) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/stack/(js/|css/)(.*)$ /$1$2 break;
        proxy_pass http://frontend_typescript_react;
    }
