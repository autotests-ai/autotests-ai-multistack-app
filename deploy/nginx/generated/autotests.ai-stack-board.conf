# Generated from deploy/matrix.yaml — /stack/ board (vanilla index + shared assets).
# Include inside autotests.ai server { } BEFORE autotests.ai-stack-routes.conf.

    location = /stack {
        return 301 /stack/;
    }

    location ~ ^/stack/matrix\.json$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_typescript_react;
    }

    location ~ ^/stack/(js/|css/) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/stack/(js/|css/)(.*)$ /$1$2 break;
        proxy_pass http://frontend_typescript_react;
    }

    location = /stack/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^ /stack/index.html break;
        proxy_pass http://frontend_typescript_react;
    }
