# Generated from deploy/matrix.yaml — do not edit by hand; run render_vhosts.py
# Single public host; path /{backend}/api and /{backend}/frontend-* .

upstream backend_java_spring_api {
    server 127.0.0.1:8810;
    keepalive 8;
}

upstream backend_python_flask_api {
    server 127.0.0.1:8811;
    keepalive 8;
}

upstream backend_kotlin_spring_api {
    server 127.0.0.1:8814;
    keepalive 8;
}

upstream web_static {
    server 127.0.0.1:8801;
    keepalive 8;
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name reference-app-copy.autotests.ai;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/reference-app-copy.autotests.ai.access.log;
    error_log  /var/log/nginx/reference-app-copy.autotests.ai.error.log;

    location = /backend-java-spring/api {
        return 301 /backend-java-spring/api/;
    }
    location /backend-java-spring/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_java_spring_api/api/;
    }

    location = /backend-python-flask/api {
        return 301 /backend-python-flask/api/;
    }
    location /backend-python-flask/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_python_flask_api/api/;
    }

    location = /backend-kotlin-spring/api {
        return 301 /backend-kotlin-spring/api/;
    }
    location /backend-kotlin-spring/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_kotlin_spring_api/api/;
    }

    location ~ ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ /$1 break;
        proxy_pass http://web_static;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name reference-app-copy.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
