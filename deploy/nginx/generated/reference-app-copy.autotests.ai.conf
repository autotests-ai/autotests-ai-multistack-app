# Generated from deploy/matrix.yaml — retire host → 301 autotests.ai/stack/…
# No upstreams here — product proxy lives on autotests.ai vhost.

# Former matrix host (path-shaped URLs) → /stack + same path.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name reference-app-copy.autotests.ai;

    ssl_certificate /etc/letsencrypt/live/reference-app-copy.autotests.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reference-app-copy.autotests.ai/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/reference-app-copy.autotests.ai.access.log;
    error_log  /var/log/nginx/reference-app-copy.autotests.ai.error.log;

    location = / {
        return 301 https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/;
    }
    location / {
        return 301 https://autotests.ai/stack$request_uri;
    }
}

# Former single-app host → default java-spring + typescript-react stack.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name reference-app.autotests.ai;

    ssl_certificate /etc/letsencrypt/live/autotests.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autotests.ai/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/reference-app.autotests.ai.access.log;
    error_log  /var/log/nginx/reference-app.autotests.ai.error.log;

    location = / {
        return 301 https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/;
    }
    location = /login {
        return 301 https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/login;
    }
    location = /register {
        return 301 https://autotests.ai/stack/backend-java-spring/frontend-typescript-react/register;
    }
    location / {
        return 301 https://autotests.ai/stack$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name reference-app-copy.autotests.ai reference-app.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
