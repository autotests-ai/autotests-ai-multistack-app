# Generated from deploy/matrix.yaml — /stack/ board (vanilla index + shared assets).
# Board files: projects/autotests-ai-home/stack-matrix/overlay/ (not teaching vendor/ds).
# Include inside the product server { } BEFORE stack-routes.
# __BOARD_UPSTREAM__ = frontend_typescript_react (prod) or stage_frontend_typescript_react.

    location = /stack {
        return 301 /stack/;
    }

    location ~ ^/stack/matrix\.json$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://__BOARD_UPSTREAM__;
    }

    location ~ ^/stack/(js/|css/|templates/) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/stack/(js/|css/|templates/)(.*)$ /$1$2 break;
        proxy_pass http://__BOARD_UPSTREAM__;
    }

    location = /stack/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^ /stack/index.html break;
        proxy_pass http://__BOARD_UPSTREAM__;
    }

    # Not a product URL. Pair catch-all would strip the prefix and hit the board
    # at /stack/ inside the FE image (200 duplicate or HTTP 301).
    location ~ ^/stack/backend-[^/]+/frontend-[^/]+/stack(/|$) {
        return 404;
    }
