# Include inside autotests.ai `server { }` (443). Board BEFORE routes so
# `/{pair}/stack` 404s instead of hitting the pair catch-all.
# APP_DIR on box3: /home/autotests_ai_multistack/autotests-ai-multistack-app

    # Legacy paths without /stack/ prefix — same host, no external redirect.
    location ~ ^/backend- {
        return 301 /stack$request_uri;
    }

    include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/autotests.ai-stack-board.conf;
    include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/autotests.ai-stack-routes.conf;
