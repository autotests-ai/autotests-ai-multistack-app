# Stage product vhost — include generated upstreams at http{}, board+routes in server{}.
# Generated files live in the **prod** APP_DIR (same git tree nginx already includes).
# Enable only after cert /etc/letsencrypt/live/stage.autotests.ai/ exists (окно 03).
# APP_DIR prod: /home/autotests_ai_multistack/autotests-ai-multistack-app

include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/stage.autotests.ai-stack-upstreams.conf;

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name stage.autotests.ai;

    ssl_certificate /etc/letsencrypt/live/stage.autotests.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.autotests.ai/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/stage.autotests.ai.access.log;
    error_log  /var/log/nginx/stage.autotests.ai.error.log;

    location = / {
        return 301 /stack/;
    }

    location ~ ^/backend- {
        return 301 /stack$request_uri;
    }

    include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/stage.autotests.ai-stack-board.conf;
    include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/stage.autotests.ai-stack-routes.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
