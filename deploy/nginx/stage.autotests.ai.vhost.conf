# Stage product vhost — same path-shape as autotests-ai-app/deploy/nginx/stage.autotests.ai.conf.
# Landing gateway :18081 owns / and /stack/. Cells = generated routes (no board include).
# Generated files live in the **prod** APP_DIR.
# Enable only after cert /etc/letsencrypt/live/stage.autotests.ai/ exists.
# APP_DIR prod: /home/autotests_ai_multistack/autotests-ai-multistack-app

include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/stage.autotests.ai-stack-upstreams.conf;

upstream stage_autotests_ai_backend {
    server 127.0.0.1:18081;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name stage.autotests.ai;

    ssl_certificate /etc/letsencrypt/live/stage.autotests.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.autotests.ai/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/stage.autotests.ai.access.log;
    error_log  /var/log/nginx/stage.autotests.ai.error.log;

    location ~ ^/backend- {
        return 301 /stack$request_uri;
    }

    location = /stack {
        return 301 /stack/;
    }

    location = /stack/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location = /stack/matrix.json {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location ~ ^/stack/backend-[^/]+/frontend-[^/]+/stack(/|$) {
        return 404;
    }

    include /home/autotests_ai_multistack/autotests-ai-multistack-app/deploy/nginx/generated/stage.autotests.ai-stack-routes.conf;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://stage_autotests_ai_backend;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.autotests.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
