<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reference-app-copy · services</title>
  <style>
    :root {
      --bg: #f3f1ec;
      --ink: #1c1b19;
      --muted: #5c584f;
      --line: #d8d2c6;
      --ok: #1f7a4c;
      --ok-bg: #e4f3ea;
      --down: #a33b2b;
      --down-bg: #f8e8e5;
      --slot: #6b6570;
      --slot-bg: #eceaf0;
      --card: #fffdf8;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #fff 0%, transparent 55%),
        linear-gradient(180deg, #ebe6dc 0%, var(--bg) 40%, #e7e2d8 100%);
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { border-color: #b9b1a2; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .pill {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .pill--ok { color: var(--ok); background: var(--ok-bg); border-color: #b7dcc7; }
    .pill--down { color: var(--down); background: var(--down-bg); border-color: #e5c2bb; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.85rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 0.92rem;
    }
    th {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      background: #f7f3eb;
    }
    tr:last-child td { border-bottom: 0; }
    .id { font-family: var(--mono); font-size: 0.84rem; }
    .port { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    a { color: inherit; }
    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge--ok { color: var(--ok); background: var(--ok-bg); border-color: #b7dcc7; }
    .badge--down { color: var(--down); background: var(--down-bg); border-color: #e5c2bb; }
    .badge--slot { color: var(--slot); background: var(--slot-bg); border-color: #d5d0db; }
    .meta {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 0.2rem;
    }
    .err {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: var(--down-bg);
      color: var(--down);
      border: 1px solid #e5c2bb;
      display: none;
    }
    .err.show { display: block; }
    footer {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: var(--mono);
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>reference-app-copy · services</h1>
        <p class="lead">Локальные publish-порты из <code>deploy/matrix.yaml</code> + live probe.</p>
      </div>
      <div class="toolbar">
        <label class="meta" style="display:flex;align-items:center;gap:0.35rem">
          <input type="checkbox" id="auto" checked> auto 5s
        </label>
        <button type="button" id="refresh">Refresh</button>
      </div>
    </header>

    <div class="err" id="err"></div>
    <div class="summary" id="summary"></div>

    <table>
      <thead>
        <tr>
          <th>Service</th>
          <th>Port</th>
          <th>Alive</th>
          <th>Compose</th>
          <th>Check</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <footer id="foot"></footer>
  </main>
  <script>
    const rowsEl = document.getElementById("rows");
    const summaryEl = document.getElementById("summary");
    const footEl = document.getElementById("foot");
    const errEl = document.getElementById("err");
    const btn = document.getElementById("refresh");
    const autoEl = document.getElementById("auto");
    let timer = null;

    function badge(alive, matrixStatus) {
      if (matrixStatus === "slot") return '<span class="badge badge--slot">slot</span>';
      if (alive) return '<span class="badge badge--ok">up</span>';
      return '<span class="badge badge--down">down</span>';
    }

    function render(data) {
      errEl.classList.remove("show");
      const s = data.summary || {};
      summaryEl.innerHTML = [
        `<span class="pill">active ${s.active ?? "—"}</span>`,
        `<span class="pill pill--ok">alive ${s.alive ?? "—"}</span>`,
        `<span class="pill pill--down">down ${s.down ?? "—"}</span>`,
        `<span class="pill">compose running ${s.compose_running ?? "—"}</span>`,
      ].join("");

      const services = (data.services || []).slice().sort((a, b) => {
        const order = { backend: 0, frontend: 1, infra: 2, extra: 3 };
        const d = (order[a.kind] ?? 9) - (order[b.kind] ?? 9);
        if (d) return d;
        return String(a.id).localeCompare(String(b.id));
      });

      rowsEl.innerHTML = services.map((svc) => {
        const port = svc.publish_port != null ? svc.publish_port : "—";
        const portNote =
          svc.matrix_port != null && svc.publish_port != null && svc.matrix_port !== svc.publish_port
            ? `<div class="meta">matrix ${svc.matrix_port}</div>`
            : "";
        const link = svc.url
          ? `<a href="${svc.url}" target="_blank" rel="noopener">${svc.check_path || "/"}</a>`
          : (svc.check_path || "—");
        const httpMeta = svc.http
          ? `<div class="meta">${svc.http.http_status ?? "err"}${svc.http.latency_ms != null ? " · " + svc.http.latency_ms + "ms" : ""}${svc.http.error ? " · " + svc.http.error : ""}</div>`
          : (svc.tcp_open ? '<div class="meta">tcp open</div>' : "");
        const compose = svc.compose_status || svc.compose_state || "—";
        return `<tr>
          <td>
            <div class="id">${svc.id}</div>
            <div class="meta">${svc.kind} · ${svc.matrix_status}</div>
          </td>
          <td class="port">${port}${portNote}</td>
          <td>${badge(svc.alive, svc.matrix_status)}${httpMeta}</td>
          <td><span class="meta">${compose}</span></td>
          <td>${link}</td>
        </tr>`;
      }).join("");

      footEl.textContent = `checked ${data.checked_at || "—"} · ${data.matrix || "matrix.yaml"}`;
    }

    async function load() {
      btn.disabled = true;
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
      } catch (e) {
        errEl.textContent = "Не удалось загрузить /api/status — запусти services-status-server.py (стенд reference-app-copy-status). " + e;
        errEl.classList.add("show");
      } finally {
        btn.disabled = false;
      }
    }

    function syncTimer() {
      if (timer) clearInterval(timer);
      timer = null;
      if (autoEl.checked) timer = setInterval(load, 5000);
    }

    btn.addEventListener("click", load);
    autoEl.addEventListener("change", syncTimer);
    load();
    syncTimer();
  </script>
</body>
</html>
