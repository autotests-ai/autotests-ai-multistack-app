# Runtime ports / compose for autotests-ai-multistack-app (not the generate catalog).
# Axes ids (what exists) = hub matrix.yaml. Tests list is NOT here — board tests come from
# hub tests.modules via frontend/scripts/sync-stack-matrix.py
# (JSON → projects/autotests-ai-home/stack-matrix/overlay/stack/matrix.json).
# Catalog CD reads frontends with teaching: true skipped (frontend/scripts/catalog-cd-matrix.py).
# URL: https://autotests.ai/stack/{backend}/{frontend}/
#      https://autotests.ai/stack/{backend}/api/
# Stage: https://stage.autotests.ai/stack/…  (ports +10000, compose project *-stage)
# First path segment → API upstream; second → per-frontend container upstream.
#
# Port canon (local publish = prod host upstream; same numbers):
#   backend: language base +10 · stack +1 within language
#     8800 java · 8810 kotlin · 8820 python · 8830 go · 8840 javascript · 8850 typescript · next lang 8860…
#   frontend (compose publish = host nginx upstream): language base +10 · stack +1
#     9800 javascript · 9810 typescript · next lang 9820…
# Container-internal listen stays 8080 (backends) / 80 (frontends).
# Path routing SSOT: deploy/nginx (host). Local: hit published ports directly.

public_host: autotests.ai
# Header Stage/Prod: https://{public_host} and https://stage.{public_host}
# Runtime: frontend/_shared/frontend-javascript-app/js/env-hosts.js
#          (python frontend/scripts/sync-stack-matrix.py)
short_url_host: autotests.ai
canonical_stack_host: autotests.ai
canonical_stack_prefix: /stack
domain_suffix: autotests.ai

# Shared build overlays (copied into each frontend image).
ui_runtime: frontend/_shared/frontend-javascript-app
react_ui: frontend/_shared/frontend-react-ui

backends:
  - id: backend-java-spring
    status: active
    language: java
    module: backend/java/backend-java-spring
    compose_service: backend-java-spring
    compose_profile: null
    image: autotests-ai-multistack-app-backend-java-spring:latest
    internal_port: 8080
    publish_port: 8800
    db_name: multistack_app_java_spring
    health_service: backend-java-spring

