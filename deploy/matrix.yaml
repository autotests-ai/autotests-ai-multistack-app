# SSOT: backend host × frontend path matrix for reference-app-copy.
# URL: https://{backend}.{domain_suffix}/{frontend}/
# subdomain → API upstream; path → shared static mount (one web image).

domain_suffix: reference-app-copy.autotests.ai

# Shared static nginx (no /api). Local edge / prod host nginx route here.
web:
  compose_service: web
  image: reference-app-copy-web:latest
  # Published on host for prod host-nginx → static (local: only via edge).
  publish_port: 8801
  runtime: frontend/_shared/frontend-javascript-app
  react_ui: frontend/_shared/frontend-react-ui

# Local public entry (Host-based). Prod host nginx replaces this role.
edge:
  compose_service: edge
  # Local default; prod uses SERVER_PORT (8800) for edge-less host split — see deploy/nginx.
  publish_port: 8080

backends:
  - id: backend-java-spring
    status: active
    language: java
    module: backend/java/backend-java-spring
    compose_service: backend-java-spring
    compose_profile: null
    image: reference-app-copy-backend-java-spring:latest
    internal_port: 8080
    publish_port: 8810
    db_name: reference_app_java_spring
    health_service: reference-app-copy
    local_host: backend-java-spring.localhost
    public_host: backend-java-spring.reference-app-copy.autotests.ai

  - id: backend-python-flask
    status: stub
    language: python
    module: backend/python/backend-python-flask
    compose_service: backend-python-flask
    compose_profile: null
    image: reference-app-copy-backend-python-flask:latest
    internal_port: 8080
    publish_port: 8811
    db_name: reference_app_python_flask
    health_service: backend-python-flask
    local_host: backend-python-flask.localhost
    public_host: backend-python-flask.reference-app-copy.autotests.ai

  - id: backend-python-fastapi
