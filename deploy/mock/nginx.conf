# Local stand gateway — same-origin / + /api/ for SPA at document root (port 9911).
# Prod path shape lives in deploy/nginx/reference-app-copy.autotests.ai.conf only.

upstream frontend_spa {
    server frontend-typescript-react:80;
    keepalive 8;
}

upstream api_mock {
    server api-mock:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_mock;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend_spa;
    }
}
