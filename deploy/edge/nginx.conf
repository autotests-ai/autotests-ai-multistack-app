# Local edge: /{backend}/api → API; /{backend}/frontend-* → shared web (strip backend).
# One host — no per-backend server_name / *.localhost.

server_names_hash_bucket_size 128;

upstream web_static {
    server web:80;
}

upstream backend_java_spring {
    server backend-java-spring:8080;
}

upstream backend_kotlin_spring {
    server backend-kotlin-spring:8080;
}

upstream backend_python_flask {
    server backend-python-flask:8080;
}

upstream backend_python_fastapi {
    server backend-python-fastapi:8080;
}

upstream backend_python_django {
    server backend-python-django:8080;
}

server {
    listen 80 default_server;
    server_name _;

    location = /backend-java-spring/api {
        return 301 /backend-java-spring/api/;
    }
    location /backend-java-spring/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_java_spring/api/;
    }

    location = /backend-kotlin-spring/api {
        return 301 /backend-kotlin-spring/api/;
    }
    location /backend-kotlin-spring/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_kotlin_spring/api/;
    }

    location = /backend-python-flask/api {
        return 301 /backend-python-flask/api/;
    }
    location /backend-python-flask/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_python_flask/api/;
    }

    location = /backend-python-fastapi/api {
        return 301 /backend-python-fastapi/api/;
    }
    location /backend-python-fastapi/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_python_fastapi/api/;
    }

    location = /backend-python-django/api {
        return 301 /backend-python-django/api/;
    }
    location /backend-python-django/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_python_django/api/;
    }

    # /{backend}/{frontend}/… → /{frontend}/… on shared web (all UI mounts).
    location ~ ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/backend-[^/]+/(frontend-[^/]+(?:/.*)?)$ /$1 break;
        proxy_pass http://web_static;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
