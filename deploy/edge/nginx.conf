# Local edge: Host → backend API; /frontend-* → shared web static.
# default_server → java (curl localhost without Host still works).

server_names_hash_bucket_size 128;

upstream web_static {
    server web:80;
}

upstream backend_java_spring {
    server backend-java-spring:8080;
}

upstream backend_python_flask {
    server backend-python-flask:8080;
}

server {
    listen 80 default_server;
    server_name _ backend-java-spring.localhost
                 backend-java-spring.reference-app-copy.autotests.ai;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_java_spring/api/;
    }

    location /frontend- {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web_static;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name backend-python-flask.localhost
                backend-python-flask.reference-app-copy.autotests.ai;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_python_flask/api/;
    }

    location /frontend- {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web_static;
    }

    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
