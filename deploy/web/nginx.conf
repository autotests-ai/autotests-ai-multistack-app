# Shared static only — /api is routed by edge (local) or host nginx (prod).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product UI mounts (active frontends from deploy/matrix.yaml).
    location = /frontend-typescript-react {
        return 301 /frontend-typescript-react/;
    }
    location /frontend-typescript-react/ {
        try_files $uri $uri/ /frontend-typescript-react/index.html;
    }

    location = /frontend-typescript-vue {
        return 301 /frontend-typescript-vue/;
    }
    location /frontend-typescript-vue/ {
        try_files $uri $uri/ /frontend-typescript-vue/index.html;
    }

    location = /frontend-javascript-vanilla {
        return 301 /frontend-javascript-vanilla/;
    }
    location /frontend-javascript-vanilla/ {
        try_files $uri $uri/ /frontend-javascript-vanilla/index.html;
    }

    # Host root and everything else: empty (API lives on edge / host vhost).
    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
