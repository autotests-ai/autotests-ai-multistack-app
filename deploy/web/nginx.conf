server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JSON API → Spring (same public origin for browsers / Selenide).
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080/api/;
    }

    # Product UI mount — SPA soft routes (React Router).
    location = /frontend-typescript-react {
        return 301 /frontend-typescript-react/;
    }
    location /frontend-typescript-react/ {
        try_files $uri $uri/ /frontend-typescript-react/index.html;
    }

    # Host root and everything else: empty (API-only at /api).
    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
