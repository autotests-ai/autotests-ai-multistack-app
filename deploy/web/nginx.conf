server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JSON API → Spring (same public origin for browsers / Selenide).
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8080/api/;
    }

    # Product UI mount (matrix path). Soft routes + SPA/MPA fallback.
    location = /frontend_typescript_react {
        return 301 /frontend_typescript_react/;
    }
    location = /frontend_typescript_react/login {
        try_files /frontend_typescript_react/login.html =404;
    }
    location = /frontend_typescript_react/register {
        try_files /frontend_typescript_react/register.html =404;
    }
    location /frontend_typescript_react/ {
        try_files $uri $uri.html $uri/ /frontend_typescript_react/index.html;
    }

    # Host root and everything else: empty (API-only at /api).
    location = / {
        return 404;
    }
    location / {
        return 404;
    }
}
